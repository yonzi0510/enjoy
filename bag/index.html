<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F6ECDD">
<title>생각 놀이터</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="../shared/voice-settings.css">
<link rel="stylesheet" href="../shared/time-limit.css">
<link rel="stylesheet" href="../shared/pet.css">
<link rel="stylesheet" href="../shared/crayon.css">
<link rel="stylesheet" href="../shared/doodle-menu.css">
<link rel="stylesheet" href="css/doodle.css">
</head>
<body>

<!-- ═══ 손그림 아이콘 모음 ═══
     이모지 대신 아이가 크레용으로 그린 듯한 그림을 쓴다.
     굵고 고른 획 + feTurbulence·feDisplacementMap 으로 선을 삐뚤하게 떤다.
     (놀잇감이 아니라 '틀'에만 쓴다 — 숟가락·빨대·네모 조각·풍선 줄은 손대지 않는다) -->
<svg class="doodle-sprite" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
  <defs>
    <filter id="bg-wob" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.034" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="2.6"/>
    </filter>
    <filter id="bg-wob2" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.042" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="2.2"/>
    </filter>

    <!-- 🥄 숟가락 -->
    <symbol id="bg-spoon" viewBox="0 0 100 100">
      <g filter="url(#bg-wob)" fill="none" stroke="#2E2A24" stroke-width="8"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M35 6 C47 6 52 20 50 33 C48 45 43 54 35 54 C27 54 22 45 20 33 C18 20 23 6 35 6 Z" fill="#FFD9B0"/>
        <path d="M25 22 C29 33 41 33 45 22" stroke="#E8B078" stroke-width="5"/>
        <path d="M41 53 L70 93" stroke-width="10"/>
      </g>
    </symbol>

    <!-- 🎚️ 빨대 슬라이더 (높이가 다른 손잡이 셋) -->
    <symbol id="bg-straw" viewBox="0 0 100 100">
      <g filter="url(#bg-wob2)" fill="none" stroke="#2E2A24" stroke-width="7"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 12 L22 88"/><path d="M50 12 L50 88"/><path d="M78 12 L78 88"/>
        <path d="M13 62 L31 62" stroke="#7FC06B" stroke-width="15"/>
        <path d="M41 36 L59 36" stroke="#7FC06B" stroke-width="15"/>
        <path d="M69 72 L87 72" stroke="#7FC06B" stroke-width="15"/>
      </g>
    </symbol>

    <!-- 🟧 네모 조각 (반쪽만 칠해진 돌리는 조각) -->
    <symbol id="bg-square" viewBox="0 0 100 100">
      <g filter="url(#bg-wob)" fill="none" stroke="#2E2A24" stroke-width="8"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M79 23 L79 77 L25 77 Z" fill="#FF8C1A" stroke="none"/>
        <path d="M18 18 L82 18 L82 82 L18 82 Z"/>
        <path d="M18 18 L82 82"/>
      </g>
    </symbol>

    <!-- 🎈 풍선과 구불구불한 줄 -->
    <symbol id="bg-balloon" viewBox="0 0 100 100">
      <g filter="url(#bg-wob)" fill="none" stroke="#2E2A24" stroke-width="7"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M50 8 C67 8 78 24 78 40 C78 57 64 70 50 70 C36 70 22 57 22 40 C22 24 33 8 50 8 Z" fill="#F79BB4"/>
        <path d="M44 72 L50 66 L56 72 Z" fill="#F79BB4"/>
        <path d="M50 74 C36 80 64 86 50 97" stroke-width="6"/>
      </g>
    </symbol>

    <!-- ⭐ 별 -->
    <symbol id="bg-star" viewBox="0 0 100 100">
      <g filter="url(#bg-wob2)" stroke="#2E2A24" stroke-width="7"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M50 9 L62 37 L92 40 L69 60 L76 90 L50 74 L24 90 L31 60 L8 40 L38 37 Z" fill="#F6C453"/>
      </g>
    </symbol>

    <!-- ◀ 뒤로 -->
    <symbol id="bg-back" viewBox="0 0 100 100">
      <g filter="url(#bg-wob)" fill="none" stroke="#2E2A24" stroke-width="11"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M64 14 L28 50 L64 86"/>
      </g>
    </symbol>

    <!-- ▶ 다음 -->
    <symbol id="bg-next" viewBox="0 0 100 100">
      <g filter="url(#bg-wob)" fill="none" stroke="#2E2A24" stroke-width="11"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M36 14 L72 50 L36 86"/>
      </g>
    </symbol>

    <!-- 🔊 듣기 -->
    <symbol id="bg-speaker" viewBox="0 0 100 100">
      <g filter="url(#bg-wob2)" fill="none" stroke="#2E2A24" stroke-width="7"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 38 L28 38 L48 18 L48 82 L28 62 L10 62 Z" fill="#FFE3A6"/>
        <path d="M62 34 C70 42 70 58 62 66"/>
        <path d="M78 22 C92 38 92 62 78 78"/>
      </g>
    </symbol>

    <!-- 🧼 지우개 -->
    <symbol id="bg-eraser" viewBox="0 0 100 100">
      <g filter="url(#bg-wob)" fill="none" stroke="#2E2A24" stroke-width="7"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 64 L46 24 L84 40 L58 80 Z" fill="#CFE4FF"/>
        <path d="M33 44 L71 60"/>
      </g>
    </symbol>

    <!-- ↩️ 한 획 되돌리기 -->
    <symbol id="bg-undo" viewBox="0 0 100 100">
      <g filter="url(#bg-wob2)" fill="none" stroke="#2E2A24" stroke-width="9"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M78 80 C78 48 58 32 28 32"/>
        <path d="M44 16 L26 32 L44 48"/>
      </g>
    </symbol>

    <!-- 🧽 내 줄 지우기 -->
    <symbol id="bg-sponge" viewBox="0 0 100 100">
      <g filter="url(#bg-wob)" fill="none" stroke="#2E2A24" stroke-width="7"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 32 L78 24 L84 68 L26 78 Z" fill="#FFE1AC"/>
        <path d="M40 46 L41 46"/><path d="M60 58 L61 58"/><path d="M56 38 L57 38"/>
      </g>
    </symbol>

    <!-- 👀 본보기 눈 -->
    <symbol id="bg-eye" viewBox="0 0 100 100">
      <g filter="url(#bg-wob2)" fill="none" stroke="#2E2A24" stroke-width="7"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 50 C28 22 72 22 92 50 C72 78 28 78 8 50 Z" fill="#FFFFFF"/>
        <circle cx="50" cy="50" r="12" fill="#2E2A24" stroke="none"/>
      </g>
    </symbol>

    <!-- ✏️ 연필 -->
    <symbol id="bg-pencil" viewBox="0 0 100 100">
      <g filter="url(#bg-wob)" fill="none" stroke="#2E2A24" stroke-width="7"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 84 L28 56 L72 14 L86 28 L44 74 Z" fill="#F6C453"/>
        <path d="M28 56 L44 74"/>
      </g>
    </symbol>

    <!-- 💡 생각 (제목 글씨 앞) -->
    <symbol id="bg-bulb" viewBox="0 0 100 100">
      <g filter="url(#bg-wob)" fill="none" stroke="#2E2A24" stroke-width="7"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M50 10 C68 10 80 24 80 40 C80 52 71 60 66 68 L34 68 C29 60 20 52 20 40 C20 24 32 10 50 10 Z" fill="#FFE07A"/>
        <path d="M37 76 L63 76"/><path d="M41 87 L59 87"/>
      </g>
    </symbol>

    <!-- 🗣️ 목소리 -->
    <symbol id="bg-voice" viewBox="0 0 100 100">
      <g filter="url(#bg-wob2)" fill="none" stroke="#2E2A24" stroke-width="8"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 20 L86 20 L86 64 L50 64 L32 84 L34 64 L14 64 Z" fill="#FFFFFF"/>
        <path d="M32 36 L68 36"/><path d="M32 50 L58 50"/>
      </g>
    </symbol>
  </defs>
</svg>

<!-- 홈 -->
<section class="screen on" id="scr-home">
  <header class="home-head">
    <h1><svg class="di" aria-hidden="true"><use href="#bg-bulb"></use></svg> 생각 놀이터</h1>
    <div class="stats">
      <span class="stat"><svg class="di" aria-hidden="true"><use href="#bg-star"></use></svg> <b id="home-stars">0</b></span>
      <a href="../" class="vs-btn" style="text-decoration:none" aria-label="메인 놀이터로">🏠</a>
      <span id="pet-slot"></span>
      <button type="button" id="btn-voice" class="vs-btn" aria-label="목소리 설정"><svg class="di" aria-hidden="true"><use href="#bg-voice"></use></svg></button>
    </div>
  </header>
  <div class="menu" id="menu"></div>
</section>

<!-- 도안 목록 -->
<section class="screen" id="scr-list">
  <header class="bar">
    <button type="button" class="back" data-go="scr-home" aria-label="뒤로"><svg class="di" aria-hidden="true"><use href="#bg-back"></use></svg></button>
    <h2 id="list-title">🥄 요리조리 숟가락</h2>
  </header>
  <div class="items-list" id="play-list"></div>
</section>

<!-- 숟가락 놀이 -->
<section class="screen" id="scr-spoon">
  <header class="bar">
    <button type="button" class="back" id="btn-spoon-back" aria-label="뒤로"><svg class="di" aria-hidden="true"><use href="#bg-back"></use></svg></button>
    <h2 id="spoon-title">🥄 요리조리 숟가락</h2>
    <span class="page-count" id="spoon-count">0 / 3</span>
  </header>
  <div class="play-wrap">
    <div class="sample-card">
      <div class="sample-tag">본보기 <svg class="di" aria-hidden="true"><use href="#bg-eye"></use></svg></div>
      <svg class="sample-svg" id="spoon-sample" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div class="board-wrap">
      <svg id="spoon-stage" viewBox="0 0 100 138" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
  </div>
</section>

<!-- 빨대 놀이 -->
<section class="screen" id="scr-straw">
  <header class="bar">
    <button type="button" class="back" id="btn-straw-back" aria-label="뒤로"><svg class="di" aria-hidden="true"><use href="#bg-back"></use></svg></button>
    <h2 id="straw-title">🎚️ 요리조리 빨대</h2>
    <span class="page-count" id="straw-count">0 / 3</span>
  </header>
  <div class="play-wrap">
    <div class="sample-card">
      <div class="sample-tag">본보기 👀</div>
      <svg class="sample-svg" id="straw-sample" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div class="board-wrap">
      <svg id="straw-stage" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
  </div>
</section>

<!-- 네모 조각 놀이 -->
<section class="screen" id="scr-square">
  <header class="bar">
    <button type="button" class="back" id="btn-square-back" aria-label="뒤로"><svg class="di" aria-hidden="true"><use href="#bg-back"></use></svg></button>
    <h2 id="square-title">🟧 네모 조각 맞추기</h2>
    <span class="page-count" id="square-count">0 / 4</span>
  </header>
  <div class="play-wrap">
    <div class="sample-card">
      <div class="sample-tag">본보기 👀</div>
      <svg class="sample-svg" id="square-sample" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div class="board-wrap">
      <svg id="square-stage" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
  </div>
</section>

<!-- 요리조리 풍선 줄 놀이 — 본보기 풍선 카드의 줄 모양을 보고 똑같이 그리는 운필력 놀이 -->
<section class="screen" id="scr-balloon">
  <header class="bar">
    <button type="button" class="back" id="btn-balloon-back" aria-label="뒤로"><svg class="di" aria-hidden="true"><use href="#bg-back"></use></svg></button>
    <h2 id="balloon-title">🎈 요리조리 풍선 줄</h2>
    <span class="dots" id="balloon-dots"></span>
  </header>
  <button type="button" class="side-nav prev" id="balloon-prev" aria-label="이전 풍선"><svg class="di" aria-hidden="true"><use href="#bg-back"></use></svg></button>
  <button type="button" class="side-nav next" id="balloon-next" aria-label="다 그리고 다음 풍선"><svg class="di" aria-hidden="true"><use href="#bg-next"></use></svg></button>
  <div class="bl-stage">
    <div class="bl-cards">
      <div class="bl-card" id="balloon-sample-card">
        <span class="bl-tag"><svg class="di" aria-hidden="true"><use href="#bg-eye"></use></svg> 본보기</span>
        <canvas id="balloon-sample"></canvas>
      </div>
      <div class="bl-card mine" id="balloon-mine">
        <span class="bl-tag mine"><svg class="di" aria-hidden="true"><use href="#bg-pencil"></use></svg> 내 풍선</span>
        <canvas id="balloon-pad"></canvas>
        <button type="button" class="line-clear" id="balloon-clear" aria-label="내 줄 지우기"><svg class="di" aria-hidden="true"><use href="#bg-sponge"></use></svg></button>
        <span class="bl-fly" id="balloon-fly" hidden>🎈</span>
      </div>
    </div>
    <div class="bl-toolbar">
      <button type="button" class="bigbtn" id="btn-balloon-listen"><svg class="di" aria-hidden="true"><use href="#bg-speaker"></use></svg> 듣기</button>
      <div class="swatches" id="balloon-swatches"></div>
      <button type="button" class="bigbtn" id="btn-balloon-eraser"><svg class="di" aria-hidden="true"><use href="#bg-eraser"></use></svg> 지우개</button>
      <button type="button" class="bigbtn" id="btn-balloon-undo"><svg class="di" aria-hidden="true"><use href="#bg-undo"></use></svg> 한 획</button>
    </div>
  </div>
</section>

<!-- 색종이 축하 -->
<div id="confetti" aria-hidden="true"></div>

<!-- 보상 오버레이 -->
<div class="reward" id="reward">
  <div class="reward-card">
    <div class="reward-stars"><svg class="di" aria-hidden="true"><use href="#bg-star"></use></svg></div>
    <div class="reward-praise" id="reward-praise">참 잘했어요!</div>
    <div class="reward-btns">
      <button type="button" class="bigbtn" id="reward-close" hidden>그만할래</button>
      <button type="button" class="bigbtn primary" id="reward-next">다음 ▶</button>
    </div>
  </div>
</div>

<script src="../shared/profile.js"></script>
<script src="js/data.js"></script>
<script src="js/ink.js"></script>
<script src="js/audio.js"></script>
<script src="js/progress.js"></script>
<script src="js/app.js"></script>
<script src="../shared/parent-settings.js"></script>
<script src="../shared/voice-settings.js"></script>
<script src="../shared/pet-avatar.js"></script>
<script src="../shared/pet.js"></script>
<script src="../shared/time-limit.js"></script>
<script src="../shared/sw-register.js"></script>
<script src="../shared/home-button.js"></script>
</body>
</html>
