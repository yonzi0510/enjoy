<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#DFF7F1">
<title>선 따라 그리기</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="../shared/voice-settings.css">
<link rel="stylesheet" href="../shared/time-limit.css">
<link rel="stylesheet" href="../shared/pet.css">
<link rel="stylesheet" href="../shared/crayon.css">
<link rel="stylesheet" href="../shared/doodle-menu.css">
<link rel="stylesheet" href="css/doodle.css">
</head>
<body>

<!-- ═══════════ 아이가 그린 손그림 (인라인 SVG) ═══════════
     화면 틀에 쓰던 이모지(✏️ ⭐ ◀ 🔊 🗣️ 🧽 ☀️ 🌊 🌀) 대신 쓰는 그림들.
     굵고 고른 획, 삐뚤한 선, 안 닫히는 동그라미, 칠은 윤곽 밖으로 조금 삐져나간다.
     — 획 떨림은 feTurbulence + feDisplacementMap 두 벌(윤곽용·칠용)로 낸다.
     — ⚠️ 캔버스에 그려지는 캐릭터 얼굴(🐼🐰… js/data.js)은 여기 없다.
        놀잇감이자 채점 기준점이라 그대로 둔다. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <!-- 윤곽선용 떨림 — 자로 그은 티를 없앤다 -->
  <filter id="ln-hand" x="-18%" y="-18%" width="136%" height="136%">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7"/>
    <feDisplacementMap in="SourceGraphic" scale="2.3"/>
  </filter>
  <!-- 칠(크레용)용 떨림 — 더 크게 흔들어 윤곽 밖으로 삐져나가게 한다 -->
  <filter id="ln-crayon" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="13"/>
    <feDisplacementMap in="SourceGraphic" scale="5"/>
  </filter>

  <!-- 연필 — 제목·아직 안 그린 퍼즐 딱지 -->
  <symbol id="ln-pencil" viewBox="0 0 48 48">
    <g filter="url(#ln-crayon)" transform="translate(1.6,2.2)">
      <path d="M30 6 L42 18 L18 42 L6 42 L6 30 Z" fill="#FFD9A8"/>
    </g>
    <g filter="url(#ln-hand)" fill="none" stroke="#2E2A24" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M30 6 C34 9, 39 14, 42 18 C34 26, 26 34, 18 42 C14 42, 10 42, 6 42 C6 38, 6 34, 6 30 Z"/>
      <path d="M25 11 L37 23"/>
      <path d="M6 42 L13 35"/>
    </g>
  </symbol>

  <!-- 별 — 모은 별·다 그린 퍼즐 딱지 -->
  <symbol id="ln-star" viewBox="0 0 48 48">
    <g filter="url(#ln-crayon)" transform="translate(1.6,2.2)">
      <path d="M24 8 L28.1 19.3 L40.2 19.8 L30.7 27.2 L34 38.8 L24 32 L14 38.8 L17.3 27.2 L7.8 19.8 L19.9 19.3 Z" fill="#FFD34E"/>
    </g>
    <g filter="url(#ln-hand)" fill="none" stroke="#2E2A24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 8 L28.1 19.3 L40.2 19.8 L30.7 27.2 L34 38.8 L24 32 L14 38.8 L17.3 27.2 L7.8 19.8 L19.9 19.3 Z"/>
    </g>
  </symbol>

  <!-- 뒤로 가기 화살표 -->
  <symbol id="ln-back" viewBox="0 0 48 48">
    <g filter="url(#ln-hand)" fill="none" stroke="#2E2A24" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M29 11 L15 24 L29 37"/><path d="M16 24 H35"/>
    </g>
  </symbol>

  <!-- 목소리 설정(말풍선) -->
  <symbol id="ln-talk" viewBox="0 0 48 48">
    <g filter="url(#ln-crayon)" transform="translate(1.6,2.2)"><path d="M7 10 H41 V30 H21 L13 38 V30 H7 Z" fill="#BFE6DD"/></g>
    <g filter="url(#ln-hand)" fill="none" stroke="#2E2A24" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 10 H41 V30 H21 L13 38 V30 H7 Z"/>
      <path d="M16 20 h.6 M24 20 h.6 M32 20 h.6" stroke-width="4.6"/>
    </g>
  </symbol>

  <!-- 소리 듣기(나팔) -->
  <symbol id="ln-sound" viewBox="0 0 48 48">
    <g filter="url(#ln-crayon)" transform="translate(1.4,2)"><path d="M8 19 H16 L26 11 V37 L16 29 H8 Z" fill="#FFD6A0"/></g>
    <g filter="url(#ln-hand)" fill="none" stroke="#2E2A24" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 19 H16 L26 11 V37 L16 29 H8 Z"/>
      <path d="M32 18 C36 22, 36 26, 32 30" stroke-width="3.4"/>
      <path d="M38.5 13 C45 21, 45 27, 38.5 35" stroke-width="3.4"/>
    </g>
  </symbol>

  <!-- 지우개 — "다시 그릴래" -->
  <symbol id="ln-eraser" viewBox="0 0 48 48">
    <g filter="url(#ln-crayon)" transform="translate(1.5,2.2)">
      <path d="M14 30 L30 14 L42 26 L26 42 Z" fill="#F6B6C8"/>
    </g>
    <g filter="url(#ln-hand)" fill="none" stroke="#2E2A24" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 30 C19 25, 25 19, 30 14 C34 18, 38 22, 42 26 C37 31, 31 37, 26 42 C22 38, 18 34, 14 30 Z"/>
      <path d="M22 22 L34 34"/>
      <path d="M7 42 H24" stroke-width="4.6"/>
    </g>
  </symbol>

  <!-- ☀️ 해 — 1단계 '반짝반짝 선'(뻗어나가는 곧은 선) -->
  <symbol id="ln-sun" viewBox="0 0 48 48">
    <g filter="url(#ln-crayon)" transform="translate(1.6,2)"><circle cx="24" cy="24" r="9.5" fill="#FFD34E"/></g>
    <g filter="url(#ln-hand)" fill="none" stroke="#2E2A24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M28 13 a11 11 0 1 1 -5.5 .4"/>
      <path d="M24 5 V1.5 M24 43 V46.5 M5 24 H1.5 M43 24 H46.5"/>
      <path d="M10.5 10.5 L8 8 M37.5 10.5 L40 8 M10.5 37.5 L8 40 M37.5 37.5 L40 40"/>
    </g>
  </symbol>

  <!-- 🌊 물결 — 2단계 '구불구불 선' -->
  <symbol id="ln-wave" viewBox="0 0 48 48">
    <g filter="url(#ln-crayon)" transform="translate(1.4,2.4)">
      <path d="M4 22 C10 12, 16 32, 22 22 C28 12, 34 32, 44 22 L44 34 L4 34 Z" fill="#A9D8F0"/>
    </g>
    <g filter="url(#ln-hand)" fill="none" stroke="#2E2A24" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 18 C10 8, 16 28, 22 18 C28 8, 34 28, 44 18"/>
      <path d="M4 32 C10 22, 16 42, 22 32 C28 22, 34 42, 44 32"/>
    </g>
  </symbol>

  <!-- 🌀 소용돌이 — 3단계 '돌돌 말린 선' -->
  <symbol id="ln-swirl" viewBox="0 0 48 48">
    <g filter="url(#ln-crayon)" transform="translate(1.4,2)"><circle cx="24" cy="24" r="5.5" fill="#D6BFF2"/></g>
    <g filter="url(#ln-hand)" fill="none" stroke="#2E2A24" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 22 C27 22, 28 26, 25 27 C20 29, 17 22, 21 17 C26 10, 37 12, 40 20 C44 31, 33 42, 22 40 C9 38, 2 26, 7 15"/>
    </g>
  </symbol>

  <!-- 제목에서 첫 놀이(반짝반짝 선)로 향하는 점선 화살표 — "여기부터 그려 보자" -->
  <symbol id="ln-arrow" viewBox="0 0 110 130">
    <g filter="url(#ln-hand)" fill="none" stroke="#2E8C7E" stroke-width="6"
       stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="11 10">
      <path d="M14 10 C6 42, 12 70, 34 92 C50 108, 68 114, 92 114"/>
    </g>
    <g filter="url(#ln-hand)" fill="none" stroke="#2E8C7E" stroke-width="6"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M76 100 L95 114 L75 126"/>
    </g>
  </symbol>
</defs></svg>

<!-- 홈 -->
<section class="screen on" id="scr-home">
  <header class="home-head">
    <h1><svg class="ic ic-title" aria-hidden="true"><use href="#ln-pencil"/></svg> 선 따라 그리기</h1>
    <div class="stats">
      <span class="stat"><svg class="ic" aria-hidden="true"><use href="#ln-star"/></svg> <b id="home-stars">0</b></span>
      <a href="../" class="vs-btn" style="text-decoration:none" aria-label="메인 놀이터로">🏠</a>
      <span id="pet-slot"></span>
      <button type="button" id="btn-voice" class="vs-btn" aria-label="목소리 설정">
        <svg class="ic" aria-hidden="true"><use href="#ln-talk"/></svg>
      </button>
    </div>
  </header>
  <div class="menu" id="menu"></div>
</section>

<!-- 퍼즐 목록 -->
<section class="screen" id="scr-list">
  <header class="bar">
    <button type="button" class="back" data-go="scr-home" aria-label="뒤로">
      <svg class="ic" aria-hidden="true"><use href="#ln-back"/></svg>
    </button>
    <h2 id="list-title"><svg class="ic ic-title" aria-hidden="true"><use href="#ln-sun"/></svg> 반짝반짝 선</h2>
    <span class="page-count" id="list-count">0 / 10</span>
  </header>
  <div class="puzzle-list" id="list"></div>
</section>

<!-- 놀이(선 따라 그리기) -->
<section class="screen" id="scr-play">
  <header class="bar">
    <button type="button" class="back" id="btn-play-back" aria-label="뒤로">
      <svg class="ic" aria-hidden="true"><use href="#ln-back"/></svg>
    </button>
    <h2 id="play-title">✏️ 선 따라 그리기</h2>
    <button type="button" class="bigbtn small" id="btn-listen">
      <svg class="ic" aria-hidden="true"><use href="#ln-sound"/></svg> 듣기
    </button>
  </header>
  <div class="play-stage">
    <div class="board-wrap">
      <canvas id="play-canvas"></canvas>
    </div>
    <button type="button" class="bigbtn" id="btn-clear">
      <svg class="ic" aria-hidden="true"><use href="#ln-eraser"/></svg> 다시 그릴래
    </button>
  </div>
</section>

<!-- 보상 오버레이 -->
<div class="reward" id="reward">
  <div class="reward-card">
    <div class="reward-face" id="reward-face">⭐</div>
    <div class="reward-praise" id="reward-praise">참 잘했어요!</div>
    <div class="reward-btns">
      <button type="button" class="bigbtn" id="reward-close">그만할래</button>
      <button type="button" class="bigbtn primary" id="reward-next">다음 ▶</button>
    </div>
  </div>
</div>

<!-- 색종이 축하 -->
<div class="confetti" id="confetti" aria-hidden="true"></div>

<script src="../shared/profile.js"></script>
<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/progress.js"></script>
<script src="js/ink.js"></script>
<script src="js/app.js"></script>
<script src="../shared/parent-settings.js"></script>
<script src="../shared/voice-settings.js"></script>
<script src="../shared/pet-avatar.js"></script>
<script src="../shared/pet.js"></script>
<script src="../shared/time-limit.js"></script>
<script src="../shared/sw-register.js"></script>
<script src="../shared/home-button.js"></script>
</body>
</html>
