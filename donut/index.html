<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FCE7EE">
<title>도넛 짝맞추기</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="../shared/voice-settings.css">
<link rel="stylesheet" href="../shared/time-limit.css">
<link rel="stylesheet" href="../shared/pet.css">
<link rel="stylesheet" href="../shared/crayon.css">
<link rel="stylesheet" href="../shared/doodle-menu.css">
<link rel="stylesheet" href="css/doodle.css">
<link rel="stylesheet" href="../shared/screen.css">
</head>
<body>

<!-- 홈 -->
<section class="screen on" id="scr-home">
  <header class="home-head">
    <h1><span class="ic" data-icon="donut"></span>도넛 짝맞추기</h1>
    <div class="stats">
      <span class="stat"><span class="ic" data-icon="star"></span> <b id="home-stars">0</b></span>
      <a href="../" class="vs-btn" style="text-decoration:none" aria-label="메인 놀이터로">🏠</a>
      <span id="pet-slot"></span>
      <button type="button" id="btn-voice" class="vs-btn" aria-label="목소리 설정"><span class="ic" data-icon="voice"></span></button>
    </div>
  </header>
  <div class="menu" id="menu"></div>
</section>

<!-- 퍼즐 목록 -->
<section class="screen" id="scr-list">
  <header class="bar">
    <button type="button" class="back" data-go="scr-home" aria-label="뒤로"><span class="ic" data-icon="back"></span></button>
    <h2 id="list-title"><span class="ic" data-icon="donut"></span>작은 도넛판</h2>
    <span class="page-count" id="list-count">0 / 10</span>
  </header>
  <div class="puzzle-list" id="puzzle-list"></div>
</section>

<!-- 놀이(짝맞추기) -->
<section class="screen" id="scr-play">
  <header class="bar">
    <button type="button" class="back" id="btn-play-back" aria-label="뒤로"><span class="ic" data-icon="back"></span></button>
    <h2 id="play-title"><span class="ic" data-icon="donut"></span>도넛 짝맞추기</h2>
    <button type="button" class="bigbtn small" id="btn-listen"><span class="ic" data-icon="speaker"></span> 듣기</button>
  </header>
  <div class="play-stage" id="play-stage">
    <!-- 자리판 — 각 칸에 연한 도넛 윤곽 -->
    <div class="board-wrap">
      <div class="board" id="board"></div>
    </div>
    <!-- 도넛 트레이 -->
    <div class="tray" id="tray"></div>
  </div>
  <!-- 드래그 중 따라다니는 도넛 -->
  <div class="drag-ghost" id="drag-ghost" hidden></div>
</section>

<!-- 보상 오버레이 -->
<div class="reward" id="reward">
  <div class="reward-card">
    <div class="reward-donut" id="reward-donut" data-icon="donut" aria-label="도넛"></div>
    <div class="reward-praise" id="reward-praise">참 잘했어요!</div>
    <div class="reward-btns">
      <button type="button" class="bigbtn" id="reward-close">그만할래</button>
      <button type="button" class="bigbtn primary" id="reward-next">다음 <span class="ic" data-icon="next"></span></button>
    </div>
  </div>
</div>

<!-- 색종이 축하 -->
<div class="confetti" id="confetti" aria-hidden="true"></div>

<script src="../shared/profile.js"></script>
<script src="js/data.js"></script>
<script src="js/icons.js"></script>
<script src="js/audio.js"></script>
<script src="js/progress.js"></script>
<script src="js/app.js"></script>
<script src="../shared/parent-settings.js"></script>
<script src="../shared/voice-settings.js"></script>
<script src="../shared/pet-avatar.js"></script>
<script src="../shared/pet.js"></script>
<script src="../shared/time-limit.js"></script>
<script src="../shared/sw-register.js"></script>
<script src="../shared/home-button.js"></script>
</body>
</html>
