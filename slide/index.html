<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FDE6E0">
<title>네 색 슬라이드</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="../shared/voice-settings.css">
<link rel="stylesheet" href="../shared/time-limit.css">
<link rel="stylesheet" href="../shared/pet.css">
<link rel="stylesheet" href="../shared/crayon.css">
<link rel="stylesheet" href="../shared/doodle-menu.css">
<link rel="stylesheet" href="../shared/screen.css">
</head>
<body>

<!-- ═══════════ 아이가 그린 손그림 (인라인 SVG) ═══════════
     화면 틀에 쓰던 이모지(⭐ 🗣️ ◀ 🔊 🎨 🌈 ▶)를 대신하는 그림들.
     굵고 고른 획, 삐뚤한 선, 안 닫히는 동그라미, 칠은 윤곽 밖으로 조금 삐져나간다.
     — 떨림은 feTurbulence + feDisplacementMap 두 벌(윤곽용 sl-hand · 칠용 sl-crayon)로 낸다.
     ⚠️ 놀이 조각(빨강 원·노랑 별·초록 세모·파랑 네모)은 여기 없다.
        색맹 대비로 색마다 모양이 다른 놀잇감이라 js/data.js 의 chipDraw 그대로 둔다. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <!-- 윤곽선용 떨림 — 자로 그은 티를 없앤다 -->
  <filter id="sl-hand" x="-18%" y="-18%" width="136%" height="136%">
    <feTurbulence type="fractalNoise" baseFrequency="0.038" numOctaves="2" seed="5"/>
    <feDisplacementMap in="SourceGraphic" scale="2.4"/>
  </filter>
  <!-- 칠(크레용)용 떨림 — 더 크게 흔들어 윤곽 밖으로 삐져나가게 한다 -->
  <filter id="sl-crayon" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="2"/>
    <feDisplacementMap in="SourceGraphic" scale="5"/>
  </filter>

  <!-- 제목·목록·놀이 머리말의 그림 — 이 놀이의 네 색 조각을 그대로 옮겨 그렸다.
       (빨강 동그라미 · 노랑 별 · 초록 세모 · 파랑 네모 — 색과 모양의 짝은 놀이와 같다) -->
  <symbol id="sl-title" viewBox="0 0 48 48">
    <g filter="url(#sl-crayon)" transform="translate(1.4,2)">
      <circle cx="14" cy="14" r="8.4" fill="#E24B3B"/>
      <path d="M34 6 L36.8 12.6 L43.6 13.2 L38.4 17.6 L40.2 24.4 L34 20.6 L27.8 24.4 L29.6 17.6 L24.4 13.2 L31.2 12.6 Z" fill="#F6C744"/>
      <path d="M14 26 L22 41 L6 41 Z" fill="#57B24A"/>
      <rect x="26" y="27" width="15" height="15" rx="3" fill="#4C86D6"/>
    </g>
    <g filter="url(#sl-hand)" fill="none" stroke="#2E2A24" stroke-width="3.2"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 10.6 a8.8 8.8 0 1 1 -3 -3.4"/>
      <path d="M34 6 L36.8 12.6 L43.6 13.2 L38.4 17.6 L40.2 24.4 L34 20.6 L27.8 24.4 L29.6 17.6 L24.4 13.2 L31.2 12.6 Z"/>
      <path d="M14 26 L22 41 L6 41 Z"/>
      <path d="M26 30 C26 27, 28 27, 31 27 H41 V42 H27 C26 42, 26 40, 26 37 Z"/>
    </g>
  </symbol>

  <!-- 별 — 모은 별·완성 딱지 -->
  <symbol id="sl-star" viewBox="0 0 48 48">
    <g filter="url(#sl-crayon)" transform="translate(1.6,2.2)">
      <path d="M24 8 L28.1 19.3 L40.2 19.8 L30.7 27.2 L34 38.8 L24 32 L14 38.8 L17.3 27.2 L7.8 19.8 L19.9 19.3 Z" fill="#FFD34E"/>
    </g>
    <g filter="url(#sl-hand)" fill="none" stroke="#2E2A24" stroke-width="4"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 8 L28.1 19.3 L40.2 19.8 L30.7 27.2 L34 38.8 L24 32 L14 38.8 L17.3 27.2 L7.8 19.8 L19.9 19.3 Z"/>
    </g>
  </symbol>

  <!-- 물감 팔레트 — 「이렇게 정리해요」 딱지·아직 안 한 퍼즐 -->
  <symbol id="sl-palette" viewBox="0 0 48 48">
    <g filter="url(#sl-crayon)" transform="translate(1.6,2.2)">
      <path d="M24 6 C37 6, 43 15, 42 24 C41 32, 33 30, 31 34 C29 39, 33 42, 24 42 C12 42, 5 34, 5 24 C5 14, 12 6, 24 6 Z" fill="#FFF0CF"/>
      <circle cx="16" cy="17" r="3.6" fill="#E24B3B"/><circle cx="27" cy="14" r="3.6" fill="#F6C744"/>
      <circle cx="34" cy="22" r="3.6" fill="#57B24A"/><circle cx="14" cy="28" r="3.6" fill="#4C86D6"/>
    </g>
    <g filter="url(#sl-hand)" fill="none" stroke="#2E2A24" stroke-width="3.6"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 6 C37 6, 43 15, 42 24 C41 32, 33 30, 31 34 C29 39, 33 42, 24 42 C12 42, 5 34, 5 24 C5 14, 12 6, 24 6"/>
      <path d="M22 33 a4 4 0 1 1 -2 -3.4" stroke-width="3"/>
    </g>
  </symbol>

  <!-- 말풍선 — 목소리 설정 -->
  <symbol id="sl-talk" viewBox="0 0 48 48">
    <g filter="url(#sl-crayon)" transform="translate(1.6,2.2)"><path d="M7 10 H41 V30 H21 L13 38 V30 H7 Z" fill="#FFE1A8"/></g>
    <g filter="url(#sl-hand)" fill="none" stroke="#2E2A24" stroke-width="4.2"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 10 H41 V30 H21 L13 38 V30 H7 Z"/>
      <path d="M16 20 h.6 M24 20 h.6 M32 20 h.6" stroke-width="4.6"/>
    </g>
  </symbol>

  <!-- 뒤로 가기 -->
  <symbol id="sl-back" viewBox="0 0 48 48">
    <g filter="url(#sl-hand)" fill="none" stroke="#2E2A24" stroke-width="5"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M29 11 L15 24 L29 37"/><path d="M16 24 H35"/>
    </g>
  </symbol>

  <!-- 다음으로 -->
  <symbol id="sl-next" viewBox="0 0 48 48">
    <g filter="url(#sl-hand)" fill="none" stroke="#2E2A24" stroke-width="5"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 11 L33 24 L19 37"/><path d="M32 24 H13"/>
    </g>
  </symbol>

  <!-- 나팔(듣기) -->
  <symbol id="sl-sound" viewBox="0 0 48 48">
    <g filter="url(#sl-crayon)" transform="translate(1.6,2.2)"><path d="M6 19 H14 L24 10 V38 L14 29 H6 Z" fill="#FFD9A8"/></g>
    <g filter="url(#sl-hand)" fill="none" stroke="#2E2A24" stroke-width="4"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 19 H14 L24 10 V38 L14 29 H6 Z"/>
      <path d="M30 18 C34 22, 34 26, 30 30" stroke-width="3.4"/>
      <path d="M37 13 C44 21, 44 27, 37 35" stroke-width="3.4"/>
    </g>
  </symbol>

  <!-- 무지개 — 다 정리했을 때 -->
  <symbol id="sl-rainbow" viewBox="0 0 48 48">
    <g filter="url(#sl-crayon)" transform="translate(1.2,1.6)" fill="none" stroke-linecap="round" stroke-width="5">
      <path d="M4 38 A20 20 0 0 1 44 38" stroke="#E24B3B"/>
      <path d="M10 38 A14 14 0 0 1 38 38" stroke="#F6C744"/>
      <path d="M16 38 A8 8 0 0 1 32 38" stroke="#57B24A"/>
    </g>
    <g filter="url(#sl-hand)" fill="none" stroke="#2E2A24" stroke-width="2.6" stroke-linecap="round">
      <path d="M4 38 A20 20 0 0 1 44 38"/>
      <path d="M16 38 A8 8 0 0 1 32 38"/>
    </g>
  </symbol>

  <!-- 손으로 그은 세로 테두리 — 놀이 판의 열(튜브)과 본보기 카드의 열에 두른다.
       늘여 써야 하므로 preserveAspectRatio=none, 굵기는 non-scaling-stroke 로 지킨다.
       색·굵기·점 간격은 CSS 가 정한다. -->
  <symbol id="sl-frame" viewBox="0 0 100 240" preserveAspectRatio="none">
    <path vector-effect="non-scaling-stroke" fill="none" d="M13 8
      C36 4, 60 10, 84 5 C92 5, 96 13, 95 23
      C97 72, 91 122, 96 172 C97 202, 94 221, 95 232
      C70 236, 40 230, 15 235 C7 233, 4 221, 6 206
      C3 158, 9 108, 5 58 C4 34, 4 17, 13 8 Z"/>
  </symbol>

  <!-- 시작 화살표는 앱마다 그리지 않는다 — shared/screen.css 가 29개 앱 첫 칸에
       같은 그림·같은 색으로 얹는다(DESIGN.md 「시작 화살표」). 여기 있던 분홍 점선은 걷어냈다. -->
</defs></svg>

<!-- 홈 -->
<section class="screen on" id="scr-home">
  <header class="home-head">
    <h1><svg class="ic ic-title" aria-hidden="true"><use href="#sl-title"/></svg> 네 색 슬라이드</h1>
    <div class="stats">
      <span class="stat"><svg class="ic" aria-hidden="true"><use href="#sl-star"/></svg> <b id="home-stars">0</b></span>
      <a href="../" class="vs-btn" style="text-decoration:none" aria-label="메인 놀이터로">🏠</a>
      <span id="pet-slot"></span>
      <button type="button" id="btn-voice" class="vs-btn" aria-label="목소리 설정">
        <svg class="ic" aria-hidden="true"><use href="#sl-talk"/></svg>
      </button>
    </div>
  </header>
  <div class="menu" id="menu"></div>
</section>

<!-- 퍼즐 목록 -->
<section class="screen" id="scr-list">
  <header class="bar">
    <button type="button" class="back" data-go="scr-home" aria-label="놀이 고르기로">
      <svg class="ic" aria-hidden="true"><use href="#sl-back"/></svg>
    </button>
    <h2 id="list-title"><svg class="ic" aria-hidden="true"><use href="#sl-title"/></svg> 쉬운 정리</h2>
    <span class="page-count" id="list-count">0 / 10</span>
  </header>
  <div class="puzzle-list" id="list"></div>
</section>

<!-- 놀이(슬라이드) -->
<section class="screen" id="scr-play">
  <header class="bar">
    <button type="button" class="back" id="btn-play-back" aria-label="퍼즐 고르기로">
      <svg class="ic" aria-hidden="true"><use href="#sl-back"/></svg>
    </button>
    <h2 id="play-title"><svg class="ic" aria-hidden="true"><use href="#sl-title"/></svg> 네 색 슬라이드</h2>
    <button type="button" class="bigbtn small" id="btn-listen">
      <svg class="ic" aria-hidden="true"><use href="#sl-sound"/></svg> 듣기
    </button>
  </header>
  <div class="play-stage" id="play-stage">
    <!-- 본보기 카드(목표: 각 열의 색) -->
    <div class="goal-card" id="goal-card">
      <div class="goal-cap"><svg class="ic" aria-hidden="true"><use href="#sl-palette"/></svg> 이렇게 정리해요!</div>
      <div class="goal-card-body" id="goal-card-body"></div>
    </div>
    <!-- 놀이 판(4개의 세로 열) -->
    <div class="board" id="board"></div>
  </div>
</section>

<!-- 보상 오버레이 -->
<div class="reward" id="reward">
  <div class="reward-card">
    <div class="reward-icon" id="reward-icon"><svg class="ic" aria-hidden="true"><use href="#sl-rainbow"/></svg></div>
    <div class="reward-praise" id="reward-praise">참 잘했어요!</div>
    <div class="reward-btns">
      <button type="button" class="bigbtn" id="reward-close">그만할래</button>
      <button type="button" class="bigbtn primary" id="reward-next">
        다음 <svg class="ic" aria-hidden="true"><use href="#sl-next"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- 색종이 축하 -->
<div class="confetti" id="confetti" aria-hidden="true"></div>

<script src="../shared/profile.js"></script>
<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/progress.js"></script>
<script src="js/app.js"></script>
<script src="../shared/parent-settings.js"></script>
<script src="../shared/voice-settings.js"></script>
<script src="../shared/pet-avatar.js"></script>
<script src="../shared/pet.js"></script>
<script src="../shared/time-limit.js"></script>
<script src="../shared/sw-register.js"></script>
<script src="../shared/home-button.js"></script>
</body>
</html>
