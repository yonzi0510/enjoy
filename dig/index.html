<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F6EDE0">
<title>발굴 놀이터</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="../shared/voice-settings.css">
<link rel="stylesheet" href="../shared/time-limit.css">
<link rel="stylesheet" href="../shared/pet.css">
<link rel="stylesheet" href="../shared/crayon.css">
<link rel="stylesheet" href="../shared/doodle-menu.css">
<link rel="stylesheet" href="../shared/screen.css">
</head>
<body>

<!-- ═══════════ 아이가 그린 손그림 (인라인 SVG) ═══════════
     화면 틀에 쓰던 이모지(🦴 ⭐ 🔍 ◀ 🔊 🗣️ ✅) 대신 쓰는 그림들.
     기기마다 모양이 다른 이모지를 쓰지 않는다 — 굵고 고른 획, 삐뚤한 선, 삐져나가는 칠.
     ⚠️ 흙 아래 숨은 그림은 여기 없다. 그것은 색칠공부 밑그림(coloring/js/pictures.js)을
        그대로 불러 캔버스에 그린다 — 놀잇감이라 이 파일에서 만들지 않는다. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <!-- 윤곽선용 떨림 — 자로 그은 티를 없앤다 -->
  <filter id="dg-hand" x="-18%" y="-18%" width="136%" height="136%">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7"/>
    <feDisplacementMap in="SourceGraphic" scale="2.3"/>
  </filter>
  <!-- 칠(크레용)용 떨림 — 더 크게 흔들어 윤곽 밖으로 삐져나가게 한다 -->
  <filter id="dg-crayon" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.027" numOctaves="2" seed="13"/>
    <feDisplacementMap in="SourceGraphic" scale="5"/>
  </filter>

  <!-- 모종삽 — 제목·단계 표시 -->
  <symbol id="dg-shovel" viewBox="0 0 48 48">
    <g filter="url(#dg-crayon)" transform="translate(1.6,2.2)">
      <path d="M14 22 L26 10 L38 22 L26 40 Z" fill="#E0A96D"/>
    </g>
    <g filter="url(#dg-hand)" fill="none" stroke="#2E2A24" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 22 L26 10 L38 22 L26 40 Z"/>
      <path d="M20 16 L9 6"/><path d="M6 3 L11 9"/>
    </g>
  </symbol>

  <!-- 흙 더미 — 아직 안 판 판(목록 딱지) -->
  <symbol id="dg-mound" viewBox="0 0 48 48">
    <g filter="url(#dg-crayon)" transform="translate(1.4,2)">
      <path d="M5 36 C10 22 18 15 24 15 C30 15 38 22 43 36 Z" fill="#C79B6B"/>
    </g>
    <g filter="url(#dg-hand)" fill="none" stroke="#2E2A24" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 37 C10 22 18 14 24 14 C30 14 38 22 44 37 Z"/>
      <path d="M15 30 h.6 M24 25 h.6 M32 31 h.6" stroke-width="4.6"/>
    </g>
  </symbol>

  <!-- 별 (모은 별·완성 딱지) -->
  <symbol id="dg-star" viewBox="0 0 48 48">
    <g filter="url(#dg-crayon)" transform="translate(1.6,2.2)">
      <path d="M24 8 L28.1 19.3 L40.2 19.8 L30.7 27.2 L34 38.8 L24 32 L14 38.8 L17.3 27.2 L7.8 19.8 L19.9 19.3 Z" fill="#FFD34E"/>
    </g>
    <g filter="url(#dg-hand)" fill="none" stroke="#2E2A24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 8 L28.1 19.3 L40.2 19.8 L30.7 27.2 L34 38.8 L24 32 L14 38.8 L17.3 27.2 L7.8 19.8 L19.9 19.3 Z"/>
    </g>
  </symbol>

  <!-- 돋보기 — "미리 보기" 단추 -->
  <symbol id="dg-lens" viewBox="0 0 48 48">
    <g filter="url(#dg-crayon)" transform="translate(1.5,2)"><circle cx="21" cy="20" r="11.5" fill="#BEE4F2"/></g>
    <g filter="url(#dg-hand)" fill="none" stroke="#2E2A24" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M25 8.4 a12.8 12.8 0 1 1 -6.4 .6"/>
      <path d="M29.5 29.5 L40 40.5"/>
    </g>
  </symbol>

  <!-- 뒤로 가기 화살표 -->
  <symbol id="dg-back" viewBox="0 0 48 48">
    <g filter="url(#dg-hand)" fill="none" stroke="#2E2A24" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M29 11 L15 24 L29 37"/><path d="M16 24 H35"/>
    </g>
  </symbol>

  <!-- 목소리 설정(말풍선) — 놀이 화면에서는 감춰져 있다(shared/crayon.css) -->
  <symbol id="dg-talk" viewBox="0 0 48 48">
    <g filter="url(#dg-crayon)" transform="translate(1.6,2.2)"><path d="M7 10 H41 V30 H21 L13 38 V30 H7 Z" fill="#EBD9BE"/></g>
    <g filter="url(#dg-hand)" fill="none" stroke="#2E2A24" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 10 H41 V30 H21 L13 38 V30 H7 Z"/>
      <path d="M16 20 h.6 M24 20 h.6 M32 20 h.6" stroke-width="4.6"/>
    </g>
  </symbol>

  <!-- 소리 듣기(나팔) -->
  <symbol id="dg-sound" viewBox="0 0 48 48">
    <g filter="url(#dg-crayon)" transform="translate(1.4,2)"><path d="M8 19 H16 L26 11 V37 L16 29 H8 Z" fill="#FFD6A0"/></g>
    <g filter="url(#dg-hand)" fill="none" stroke="#2E2A24" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 19 H16 L26 11 V37 L16 29 H8 Z"/>
      <path d="M32 18 C36 22, 36 26, 32 30" stroke-width="3.4"/>
      <path d="M38.5 13 C45 21, 45 27, 38.5 35" stroke-width="3.4"/>
    </g>
  </symbol>

  <!-- 찾았다 도장 — 안 닫히는 동그라미에 체크 -->
  <symbol id="dg-check" viewBox="0 0 48 48">
    <g filter="url(#dg-crayon)" transform="translate(1.6,2.2)"><circle cx="24" cy="24" r="15" fill="#A9E0AE"/></g>
    <g filter="url(#dg-hand)" fill="none" stroke="#2E2A24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M29 9.2 a16 16 0 1 1 -8 .4"/>
      <path d="M15 24.5 L22 32 L34 15" stroke-width="5"/>
    </g>
  </symbol>

  <!-- 손가락 — "쓱쓱 문질러 봐" 안내 -->
  <symbol id="dg-rub" viewBox="0 0 48 48">
    <g filter="url(#dg-crayon)" transform="translate(1.5,2)">
      <path d="M20 20 V9 C20 6 25 6 25 9 V22 L33 24 C37 25 38 28 37 32 L35 40 H19 L11 30 C9 27 12 24 15 26 L20 30 Z" fill="#FFE0C2"/>
    </g>
    <g filter="url(#dg-hand)" fill="none" stroke="#2E2A24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 20 V9 C20 6 25 6 25 9 V22 L33 24 C37 25 38 28 37 32 L35 41 H19 L11 30 C9 27 12 24 15 26 L20 30"/>
    </g>
  </symbol>

  <!-- 시작 화살표는 앱마다 그리지 않는다 — shared/screen.css 가 첫 칸 안쪽에 얹는다. -->
</defs></svg>

<!-- 홈 -->
<section class="screen on" id="scr-home">
  <header class="home-head">
    <h1><svg class="ic ic-title" aria-hidden="true"><use href="#dg-shovel"/></svg> 발굴 놀이터</h1>
    <div class="stats">
      <span class="stat"><svg class="ic" aria-hidden="true"><use href="#dg-star"/></svg> <b id="home-stars">0</b></span>
      <span id="pet-slot"></span>
      <button type="button" id="btn-voice" class="vs-btn" aria-label="목소리 설정">
        <svg class="ic" aria-hidden="true"><use href="#dg-talk"/></svg>
      </button>
    </div>
  </header>
  <div class="menu" id="menu"></div>
</section>

<!-- 판 목록 -->
<section class="screen" id="scr-list">
  <header class="bar">
    <button type="button" class="back" data-go="scr-home" aria-label="처음으로">
      <svg class="ic" aria-hidden="true"><use href="#dg-back"/></svg>
    </button>
    <h2 id="list-title">살살 파기</h2>
    <span class="page-count" id="list-count">0 / 10</span>
  </header>
  <div class="list" id="list"></div>
</section>

<!-- 놀이(발굴) -->
<section class="screen" id="scr-play">
  <header class="bar">
    <button type="button" class="back" id="btn-play-back" aria-label="판 고르기로">
      <svg class="ic" aria-hidden="true"><use href="#dg-back"/></svg>
    </button>
    <h2 id="play-title">무엇이 숨어 있을까?</h2>
    <button type="button" class="bigbtn small" id="btn-listen">
      <svg class="ic" aria-hidden="true"><use href="#dg-sound"/></svg> 듣기
    </button>
  </header>
  <div class="play-stage" id="play-stage">
    <div class="dig-col">
      <!-- 흙판 — 아래는 그림(색칠공부 밑그림), 위는 흙. 손가락으로 쓸면 흙이 걷힌다.
           ⚠️ 캔버스에 border 를 주지 않는다(getBoundingClientRect 가 밀려 파는 자리가 어긋난다).
              테두리는 감싸는 상자의 box-shadow 로 낸다. -->
      <div class="dig-wrap" id="dig-wrap">
        <canvas id="pic-canvas" aria-hidden="true"></canvas>
        <canvas id="dirt-canvas" aria-label="흙을 문질러 파내요"></canvas>
        <span class="rub-hint" id="rub-hint" aria-hidden="true">
          <svg class="ic" aria-hidden="true"><use href="#dg-rub"/></svg>
        </span>
      </div>
      <div class="dig-tools">
        <span class="star-hint" id="star-hint" aria-label="지금 맞히면 받을 별"></span>
        <button type="button" class="bigbtn small" id="btn-peek">
          <svg class="ic" aria-hidden="true"><use href="#dg-lens"/></svg> 알겠어
        </button>
      </div>
    </div>
    <div class="choice-bar" id="choice-bar"></div>
  </div>
</section>

<!-- 보상 오버레이 -->
<div class="reward" id="reward">
  <div class="reward-card">
    <div class="reward-face" id="reward-face"></div>
    <div class="reward-stars" id="reward-stars"></div>
    <div class="reward-praise" id="reward-praise">참 잘했어요!</div>
    <div class="reward-btns">
      <button type="button" class="bigbtn" id="reward-close">그만할래</button>
      <button type="button" class="bigbtn primary" id="reward-next">다음 <svg class="ic ic-next" aria-hidden="true"><use href="#dg-back"/></svg></button>
    </div>
  </div>
</div>

<!-- 색종이 축하 -->
<div class="confetti" id="confetti" aria-hidden="true"></div>

<script src="../shared/profile.js"></script>
<script src="../coloring/js/pictures.js"></script>
<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/progress.js"></script>
<script src="js/app.js"></script>
<script src="../shared/parent-settings.js"></script>
<script src="../shared/voice-settings.js"></script>
<script src="../shared/pet-avatar.js"></script>
<script src="../shared/pet.js"></script>
<script src="../shared/time-limit.js"></script>
<script src="../shared/sw-register.js"></script>
<script src="../shared/home-button.js"></script>
</body>
</html>
