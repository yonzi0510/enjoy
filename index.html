<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FDFBF3">
<title>은아와 서하의 놀이터</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="./shared/pet.css">

<style>
/* 홈 화면은 그림 한 장이 아니라 코드로 짠다.
   손그림 느낌은 SVG(제목 글씨·크레용 테두리·놀이 아이콘·낙서)가 맡고,
   자리 배치와 크기는 CSS 가 맡는다. 그래서 화면이 바뀌면 알아서 다시 놓인다. */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",sans-serif;
  color:#3E342E;user-select:none;background:#FDFBF3;
}
/* 종이 결 — 그림 파일이 아니라 옅은 줄무늬 두 겹이다 */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background:
    repeating-linear-gradient(102deg,rgba(190,160,110,.05) 0 1px,transparent 1px 7px),
    repeating-linear-gradient(8deg,rgba(190,160,110,.04) 0 1px,transparent 1px 9px);
}
.page{position:relative;z-index:1;max-width:1500px;margin:0 auto;
      padding:10px 14px calc(18px + env(safe-area-inset-bottom))}

/* ── 머리: 제목 + 낙서 ─────────────────────────────── */
.head{position:relative;display:grid;place-items:center;padding:8px 0 4px}
.title{width:min(640px,72%);height:auto;display:block;position:relative;z-index:2}
.head .dd{position:absolute;pointer-events:none}
.dd-rainbow{left:0;top:6%;width:clamp(50px,9%,104px)}
.dd-sun{right:0;top:2%;width:clamp(48px,8.5%,98px)}
.dd-cloud{left:9%;bottom:-2%;width:clamp(34px,6%,72px);opacity:.8}
.dd-star{right:11%;bottom:-4%;width:clamp(22px,4%,44px);opacity:.9}

/* ── 누가 노나 ──────────────────────────────────────── */
.who{display:flex;justify-content:center;gap:14px;margin:6px 0 14px}
.who button{
  position:relative;display:flex;align-items:center;gap:10px;
  padding:8px 20px 8px 10px;border:0;background:none;cursor:pointer;
  font:inherit;font-size:clamp(19px,2.6vw,26px);font-weight:900;color:#3E342E;
}
.who button>:not(.fr){position:relative;z-index:1}
.who .face{width:clamp(38px,5vw,52px);height:clamp(38px,5vw,52px);flex:none}
.who .tick{color:#EFAA24;font-weight:1000;font-size:.9em}

/* ── 이어서 하기 — 최근에 논 놀이 세 개 ─────────────── */
.recent{position:relative;--c:#C77FA8;margin:0 0 12px;padding:clamp(8px,1.1vw,12px) 0 0}
.recent>:not(.fr):not(.fill){position:relative;z-index:1}
.recent-title{display:flex;align-items:center;gap:8px;margin:0 0 clamp(6px,0.9vw,10px);
              padding-inline:clamp(12px,1.6vw,20px);
              font-size:clamp(16px,2.1vw,23px);font-weight:900;letter-spacing:-.03em;color:#7C4E68}
.recent .r-ico{width:1.5em;height:1.5em;flex:none}
.recent .games{padding-bottom:clamp(9px,1.2vw,13px)}

/* ── 묶음 ───────────────────────────────────────────── */
.groups{display:grid;gap:12px}
.group{position:relative}
.bar{
  position:relative;width:100%;display:flex;align-items:center;gap:clamp(8px,1.4vw,16px);
  padding:clamp(9px,1.3vw,15px) clamp(12px,1.6vw,20px);
  border:0;background:none;cursor:pointer;font:inherit;text-align:left;color:#3E342E;
}
.bar>:not(.fr):not(.fill),.game>:not(.fr):not(.fill){position:relative;z-index:1}
.bar .rabbit{width:clamp(50px,6.6vw,84px);height:clamp(50px,6.6vw,84px);flex:none}
.bar .cat-ico{width:clamp(34px,4.4vw,54px);height:clamp(34px,4.4vw,54px);flex:none}
.bar .name{flex:1;font-size:clamp(19px,2.7vw,30px);font-weight:900;letter-spacing:-.03em;
           word-break:keep-all}
.bar .chev{width:clamp(30px,3.6vw,44px);height:clamp(30px,3.6vw,44px);flex:none}
.bar:active{transform:translate(1px,1px)}

/* 크레용 테두리 — 늘여 써도 선 굵기가 변하지 않게 non-scaling-stroke 를 쓴다.
   (CSS border 로는 손으로 그은 선을 못 만든다) */
.fr{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;color:var(--c);z-index:0}
.fill{position:absolute;inset:3px;border-radius:26px;pointer-events:none;z-index:0;
      background:repeating-linear-gradient(36deg,
        color-mix(in srgb,var(--c) 13%,transparent) 0 3px,
        transparent 3px 11px);}

/* ── 묶음 안의 놀이 단추 ────────────────────────────── */
/* 칸 수를 못 박지 않는다 — 글자 크기에 맞춘 최소 너비(12.6em)를 주고
   들어가는 만큼만 나란히 놓는다. 그래야 반쪽 폭 묶음에서도 이름이 두 줄로 안 넘어간다. */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,12.6em),1fr));
       font-size:clamp(15px,2vw,22px);
       gap:clamp(7px,1vw,12px);padding:0 clamp(10px,1.4vw,18px) clamp(11px,1.4vw,16px)}
.game{
  position:relative;display:flex;align-items:center;gap:10px;
  padding:clamp(8px,1.1vw,13px) clamp(10px,1.2vw,15px);
  border:0;background:none;cursor:pointer;font:inherit;text-decoration:none;color:#3E342E;
  font-size:inherit;font-weight:800;letter-spacing:-.03em;min-height:52px;
}
.game .gi{width:1.9em;height:1.9em;flex:none}
.game>span:not(.lock){word-break:keep-all}
.game .fill{inset:2px;border-radius:18px;background:rgba(255,255,255,.62)}
.game.locked{opacity:.55}
.game[hidden]{display:none}
.game .lock{margin-left:auto;font-size:.95em}
.group[aria-expanded="false"] .games{display:none}

/* ── 바닥 ───────────────────────────────────────────── */
.foot{position:relative;margin-top:16px}
.foot .scene{display:block;width:100%;height:clamp(54px,7vw,86px)}
.parent-link{display:block;width:max-content;margin:8px auto 0;padding:8px 14px;color:#7B6F65;
             text-decoration:none;font-weight:800;border-bottom:2px dashed rgba(62,52,46,.28)}

/* ── 가로 화면: 두 줄로 나눠 화면을 다 쓴다 ─────────── */
@media (orientation:landscape) and (min-width:820px){
  .page{padding-inline:22px}
  .head{padding:2px 0 0}
  .title{width:min(520px,44%)}
  .who{margin:2px 0 10px}
  .groups{grid-template-columns:1fr 1fr;align-items:start;gap:10px}
  .group.wide{grid-column:1 / -1}
  .games{gap:8px;padding-bottom:10px}
  .bar{padding-block:clamp(7px,0.9vw,11px)}
  .game{min-height:48px;padding-block:8px}
  .foot{margin-top:8px}
  .foot .scene{height:clamp(40px,4.4vw,60px)}
}
/* 폰을 눕히면 세로가 아주 짧다 — 묶음을 세 줄로 벌리고 여백을 더 줄인다 */
@media (orientation:landscape) and (max-height:520px){
  .head{padding:0}
  .title{width:min(360px,34%)}
  .who{margin:0 0 6px}
  .who .face{width:34px;height:34px}
  .who button{font-size:17px;padding:6px 14px 6px 8px}
  .groups{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .group.wide{grid-column:1 / -1}
  .games{font-size:14px;gap:6px;padding:0 8px 8px}
  .bar{gap:8px;padding:5px 10px}
  .bar .rabbit{width:42px;height:42px}
  .bar .cat-ico{width:26px;height:26px}
  .bar .name{font-size:17px}
  .bar .chev{width:26px;height:26px}
  .game{min-height:44px;gap:7px;padding:5px 8px}
  .foot{margin-top:4px}
  .foot .scene{height:30px}
  .parent-link{margin-top:2px;padding:4px 12px;font-size:14px}
}

:focus-visible{outline:4px dashed rgba(214,157,19,.9);outline-offset:-4px;border-radius:18px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>window.EnjoyProfileBadge = false;</script>
<script src="./shared/profile.js"></script>
<script src="./shared/parent-settings.js"></script>

<script>
(() => {
  /* 묶음 여섯. 놀이를 새로 넣을 때는 여기 한 줄만 더하면 된다
     (아이콘은 위 <defs> 에 #i-<아이디> 로 그려 넣는다). */
  const GROUPS = [
    { key:'learn', name:'배우기', c:'#E0A21B', rabbit:'cat-learn', wide:true, open:true,
      games:[['한글 놀이터','hangul'],['영어 놀이터','english'],['일본어 놀이터','japanese'],
             ['산수 놀이터','math'],['시장 놀이터','market'],['픽셀 놀이터','pixel'],
             ['프랙티카 놀이터','practika']] },
    { key:'draw', name:'그리기와 쓰기', c:'#3E86BE', rabbit:'cat-draw',
      games:[['글씨 놀이터','write'],['선 따라 그리기','lines'],['색칠공부','coloring']] },
    { key:'shape', name:'모양 만들기', c:'#4E9B48', rabbit:'cat-shape',
      games:[['도형 놀이터','shape'],['무지개 탱그램','tangram'],['지오보드','geoboard'],
             ['컵 쌓기','cups']] },
    { key:'color', name:'색 맞추기', c:'#7E57B5', rabbit:'cat-color',
      games:[['색깔 실험실','lab'],['구슬 보드','beads'],['손가락 고무줄','rings'],
             ['시험관 구슬','tubes'],['네 색 슬라이드','slide']] },
    { key:'order', name:'순서와 규칙', c:'#DD8329', rabbit:'cat-order',
      games:[['햄버거 가게','burger'],['꼬치 가게','kkochi'],['패턴 놀이터','pattern'],
             ['점 잇기','connect']] },
    { key:'find', name:'찾기와 짝맞추기', c:'#CE5C55', rabbit:'cat-find',
      games:[['찾기 놀이터','play'],['동물 주사위','dice'],['도넛 짝맞추기','donut'],
             ['돌림 블록','twist'],['방향·색 놀이터','matrix'],['생각 놀이터','bag']] },
  ];

  function speak(text){
    if(!window.speechSynthesis) return 0;
    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);
      u.lang='ko-KR';u.rate=1;u.pitch=1.15;
      if(window.VoiceSettings){
        const v=VoiceSettings.koVoice(); if(v) u.voice=v;
        u.rate=1*VoiceSettings.rateFactor();
      }
      speechSynthesis.speak(u);
      return 1;
    }catch(e){return 0}
  }

  function go(href,say){
    const spoke=speak(say);
    setTimeout(()=>{location.href=href}, spoke?700:0);
  }

  /* ── 누가 노나 ── */
  const FACE={ eunah:'cat-learn', seoha:'cat-order' };
  const who=document.getElementById('who');
  const list=(window.Profile && Profile.LIST) || [{id:'euna',name:'은아'},{id:'seoha',name:'서하'}];
  who.innerHTML=list.map(p=>`
    <button type="button" data-id="${p.id}" aria-pressed="false" aria-label="${p.name} 선택">
      <svg class="fr" preserveAspectRatio="none"><use href="#crayon-pill"></use></svg>
      <img class="face" src="./assets/${FACE[p.id]||'cat-learn'}.svg" alt="">
      <span>${p.name}</span><span class="tick" hidden>✓</span>
    </button>`).join('');

  function syncProfile(){
    const cur = window.Profile ? Profile.current() : 'euna';
    who.querySelectorAll('button').forEach(b=>{
      const on = b.dataset.id===cur;
      b.setAttribute('aria-pressed', on?'true':'false');
      b.querySelector('.tick').hidden = !on;
      b.querySelector('.fr').style.cssText = on
        ? '--c:#EFAA24;--w:5.4' : '--c:#8A6A4F;--w:4';
    });
  }
  who.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click',()=>{
      if(window.Profile && b.dataset.id!==Profile.current()) Profile.set(b.dataset.id);
      syncProfile();
      if(typeof drawRecent==='function') drawRecent();
      speak(b.querySelector('span').textContent+', 어서 와!');
    });
  });

  /* ── 이어서 하기 ──
     아이가 마지막에 논 놀이를 홈 맨 위에 다시 꺼내 준다.
     아이별로 따로 기억한다 (Profile.key). */
  const RECENT_KEY = 'enjoy-recent-v1';
  const RECENT_MAX = 3;
  const NAME_OF = {};
  function recentKey(){ return window.Profile ? Profile.key(RECENT_KEY) : RECENT_KEY; }
  function recentRead(){
    try{
      const v = JSON.parse(localStorage.getItem(recentKey()) || '[]');
      return Array.isArray(v) ? v.filter(id => NAME_OF[id]) : [];
    }catch(e){ return []; }
  }
  function recentPush(id){
    try{
      const list = [id, ...recentRead().filter(x => x !== id)].slice(0, 6);
      localStorage.setItem(recentKey(), JSON.stringify(list));
    }catch(e){}
  }

  /* ── 묶음과 놀이 ── */
  const jaLocked = window.ParentSettings && !ParentSettings.japaneseUnlocked();
  /* 프랙티카는 회화라 5세에겐 어렵다 — 부모님이 켜야 보인다 */
  const showPractika = !!(window.ParentSettings && ParentSettings.get('showPractika'));

  document.getElementById('groups').innerHTML = GROUPS.map(g=>`
    <section class="group${g.wide?' wide':''}" data-key="${g.key}"
             aria-expanded="${g.open?'true':'false'}" style="--c:${g.c}">
      <button class="bar" type="button" aria-label="${g.name} 열기">
        <svg class="fr" preserveAspectRatio="none" style="--w:5"><use href="#crayon-frame"></use></svg>
        <div class="fill"></div>
        <img class="rabbit" src="./assets/${g.rabbit}.svg" alt="">
        <svg class="cat-ico" aria-hidden="true"><use href="#i-${g.key}"></use></svg>
        <span class="name">${g.name}</span>
        <svg class="chev" aria-hidden="true"><use href="#${g.open?'chev-up':'chev'}"></use></svg>
      </button>
      <div class="games">${g.games.map(([name,id])=>{
        const locked = id==='japanese' && jaLocked;
        const hide = id==='practika' && !showPractika;
        return `<a class="game${locked?' locked':''}" href="./${id}/" data-id="${id}"
                   aria-label="${name}"${hide?' hidden':''}>
          <svg class="fr" preserveAspectRatio="none" style="--w:3.4"><use href="#crayon-frame"></use></svg>
          <div class="fill"></div>
          <svg class="gi" aria-hidden="true"><use href="#i-${id}"></use></svg>
          <span>${name}</span>${locked?'<span class="lock">🔒</span>':''}
        </a>`;
      }).join('')}</div>
    </section>`).join('');

  document.querySelectorAll('.bar').forEach(b=>{
    b.addEventListener('click',()=>{
      const s=b.closest('.group');
      const open = s.getAttribute('aria-expanded')==='true';
      s.setAttribute('aria-expanded', open?'false':'true');
      b.querySelector('.chev use').setAttribute('href', open?'#chev':'#chev-up');
      if(!open) speak(s.querySelector('.name').textContent);
    });
  });

  /* 이어서 하기 줄을 그린다 (놀이 단추와 같은 모양) */
  const recentBox = document.getElementById('recent');
  const recentGames = document.getElementById('recent-games');
  function drawRecent(){
    const ids = recentRead()
      .filter(id => !(id==='practika' && !showPractika))
      .slice(0, RECENT_MAX);
    recentBox.hidden = ids.length === 0;
    recentGames.innerHTML = ids.map(id=>`
      <a class="game" href="./${id}/" data-id="${id}" aria-label="${NAME_OF[id]}">
        <svg class="fr" preserveAspectRatio="none" style="--w:3.4"><use href="#crayon-frame"></use></svg>
        <div class="fill"></div>
        <svg class="gi" aria-hidden="true"><use href="#i-${id}"></use></svg>
        <span>${NAME_OF[id]}</span>
      </a>`).join('');
    bindGames(recentGames);
  }

  function bindGames(root){
    root.querySelectorAll('.game').forEach(a=>{
      a.addEventListener('click',e=>{
        e.preventDefault();
        const name=a.querySelector('span').textContent;
        if(a.classList.contains('locked')){
          speak('한글 놀이터에서 낱말 카드를 열 장 모으면 열려요!');
          return;
        }
        recentPush(a.dataset.id);
        go(a.getAttribute('href'), name);
      });
    });
  }

  GROUPS.forEach(g=>g.games.forEach(([name,id])=>{ NAME_OF[id]=name; }));
  bindGames(document.getElementById('groups'));
  drawRecent();

  syncProfile();
})();
</script>

<script src="./shared/sw-register.js"></script>
<script src="./shared/pet-avatar.js"></script>
<script src="./shared/pet.js"></script>
</body>
