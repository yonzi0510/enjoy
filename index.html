<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fffaf0">
<title>은아와 서하의 놀이터</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="./shared/pet.css">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#fffaf0}
body{
  font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  color:#3e342e;
  user-select:none;
}
.page{
  width:min(914px,100%);
  margin:0 auto;
  padding:0 0 calc(26px + env(safe-area-inset-bottom));
}
.stage{
  position:relative;
  width:100%;
  aspect-ratio:914 / 1536;
  overflow:hidden;
  background:#fffaf0;
}
.design{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}
.hotspot{
  position:absolute;
  display:block;
  border:0;
  padding:0;
  margin:0;
  background:transparent;
  cursor:pointer;
  border-radius:24px;
  text-decoration:none;
  z-index:3;
}
.hotspot:focus-visible{
  outline:4px dashed rgba(214,157,19,.9);
  outline-offset:-5px;
}

/* invisible hit areas aligned to the approved artwork */
.euna{left:21.4%;top:12.55%;width:31.8%;height:8.0%}
.seoha{left:53.3%;top:12.55%;width:25.7%;height:8.0%}

.hangul{left:7.8%;top:30.1%;width:41.6%;height:7.3%}
.english{left:51.0%;top:30.1%;width:41.3%;height:7.3%}
.japanese{left:7.8%;top:38.0%;width:41.6%;height:7.3%}
.math{left:51.0%;top:38.0%;width:41.3%;height:7.3%}
.market{left:7.8%;top:45.7%;width:41.6%;height:7.3%}
.pixel{left:51.0%;top:45.7%;width:41.3%;height:7.3%}

.draw-cat{left:4.5%;top:55.7%;width:91.0%;height:9.0%}
.shape-cat{left:4.5%;top:65.5%;width:91.0%;height:8.8%}
.color-cat{left:4.5%;top:75.0%;width:91.0%;height:8.8%}
.order-cat{left:4.5%;top:84.3%;width:91.0%;height:9.2%}
.find-cat{right:0;bottom:0;width:22%;height:9.5%}

/* dynamic state overlays */
.state-check{
  position:absolute;
  z-index:4;
  color:#efaa24;
  font-size:clamp(18px,4.1vw,38px);
  font-weight:1000;
  line-height:1;
  transform:rotate(-10deg);
  pointer-events:none;
}
.state-check.euna-check{left:43.1%;top:15.35%}
.state-check.seoha-check{left:73.8%;top:15.35%}

.state-lock{
  position:absolute;
  z-index:4;
  left:42.0%;
  top:40.6%;
  font-size:clamp(17px,4vw,36px);
  line-height:1;
  pointer-events:none;
}

/* Secondary drawers: initial screen remains exactly the artwork. */
.drawer-backdrop{
  position:fixed;
  inset:0;
  z-index:50;
  display:none;
  place-items:center;
  padding:18px;
  background:rgba(59,48,40,.28);
  backdrop-filter:blur(2px);
}
.drawer-backdrop.open{display:grid}
.drawer{
  width:min(680px,96vw);
  max-height:min(78vh,760px);
  overflow:auto;
  padding:22px;
  border:4px solid var(--accent,#4e9bd2);
  border-radius:30px 23px 32px 25px;
  background:
    repeating-linear-gradient(178deg,rgba(110,80,45,.025) 0 1px,transparent 1px 6px),
    #fffaf0;
  box-shadow:7px 8px 0 rgba(62,52,46,.14);
}
.drawer-head{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
}
.drawer-title{
  flex:1;
  margin:0;
  font-size:clamp(26px,6vw,42px);
  font-weight:1000;
  letter-spacing:-.04em;
}
.close{
  width:48px;height:48px;
  border:3px solid var(--accent,#4e9bd2);
  border-radius:50%;
  background:#fff;
  color:#493e36;
  font-size:24px;
  font-weight:900;
}
.drawer-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.drawer-card{
  min-height:78px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 14px;
  border:3px solid #50433a;
  border-radius:18px 14px 20px 15px;
  background:rgba(255,255,255,.78);
  color:#3e342e;
  text-decoration:none;
  font-size:clamp(18px,4.3vw,28px);
  font-weight:900;
  box-shadow:3px 4px 0 rgba(62,52,46,.08);
}
.drawer-card .ico{font-size:1.5em}
.drawer-card.locked{opacity:.55}
.parent-link{
  display:block;
  width:max-content;
  margin:18px auto 0;
  padding:10px 16px;
  color:#776b62;
  text-decoration:none;
  font-weight:800;
  border-bottom:2px dashed rgba(62,52,46,.3);
}
.sr-only{
  position:absolute!important;
  width:1px!important;height:1px!important;
  padding:0!important;margin:-1px!important;
  overflow:hidden!important;clip:rect(0,0,0,0)!important;
  white-space:nowrap!important;border:0!important;
}
@media(max-width:520px){
  .drawer-grid{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){
  *{scroll-behavior:auto!important}
}
</style>
</head>

<body>
<div class="page">
  <div class="stage" aria-label="은아와 서하의 놀이터">
    <img class="design" src="./assets/home-design.png" alt="은아와 서하의 놀이터 손그림 홈 화면">

    <button class="hotspot euna" type="button" data-profile-name="은아" aria-label="은아 선택"></button>
    <button class="hotspot seoha" type="button" data-profile-name="서하" aria-label="서하 선택"></button>

    <a class="hotspot hangul" href="./hangul/" aria-label="한글 놀이터"></a>
    <a class="hotspot english" href="./english/" aria-label="영어 놀이터"></a>
    <a class="hotspot japanese" href="./japanese/" aria-label="일본어 놀이터"></a>
    <a class="hotspot math" href="./math/" aria-label="산수 놀이터"></a>
    <a class="hotspot market" href="./market/" aria-label="시장 놀이터"></a>
    <a class="hotspot pixel" href="./pixel/" aria-label="픽셀 놀이터"></a>

    <button class="hotspot draw-cat" type="button" data-drawer="draw" aria-label="그리기와 쓰기 열기"></button>
    <button class="hotspot shape-cat" type="button" data-drawer="shape" aria-label="모양 만들기 열기"></button>
    <button class="hotspot color-cat" type="button" data-drawer="color" aria-label="색 맞추기 열기"></button>
    <button class="hotspot order-cat" type="button" data-drawer="order" aria-label="순서와 규칙 열기"></button>
    <button class="hotspot find-cat" type="button" data-drawer="find" aria-label="찾기와 짝맞추기 열기"></button>

    <span class="state-check euna-check" id="check-euna" hidden>✓</span>
    <span class="state-check seoha-check" id="check-seoha" hidden>✓</span>
    <span class="state-lock" id="ja-lock" hidden>🔒</span>
  </div>

  <a class="parent-link" href="./parent/">🔑 부모님 페이지</a>
</div>

<div class="drawer-backdrop" id="drawer-backdrop" aria-hidden="true">
  <section class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <div class="drawer-head">
      <h2 class="drawer-title" id="drawer-title"></h2>
      <button class="close" id="drawer-close" type="button" aria-label="닫기">×</button>
    </div>
    <div class="drawer-grid" id="drawer-grid"></div>
  </section>
</div>

<script>window.EnjoyProfileBadge = false;</script>
<script src="./shared/profile.js"></script>
<script src="./shared/parent-settings.js"></script>

<script>
(() => {
  const DATA = {
    draw: {
      title:'✏️ 그리기와 쓰기',
      accent:'#4e9bd2',
      items:[
        ['✍️','글씨 놀이터','./write/'],
        ['✏️','선 따라 그리기','./lines/'],
        ['🎨','색칠공부','./coloring/']
      ]
    },
    shape: {
      title:'🔷 모양 만들기',
      accent:'#64a95e',
      items:[
        ['🔷','도형 놀이터','./shape/'],
        ['🌈','무지개 탱그램','./tangram/'],
        ['📌','지오보드','./geoboard/'],
        ['🥤','컵 쌓기','./cups/']
      ]
    },
    color: {
      title:'🌈 색 맞추기',
      accent:'#8a64b5',
      items:[
        ['🧪','색깔 실험실','./lab/'],
        ['🔵','구슬 보드','./beads/'],
        ['💍','손가락 고무줄','./rings/'],
        ['⚗️','시험관 구슬','./tubes/'],
        ['🔴','네 색 슬라이드','./slide/']
      ]
    },
    order: {
      title:'🔁 순서와 규칙',
      accent:'#e58a2f',
      items:[
        ['🍔','햄버거 가게','./burger/'],
        ['🍢','꼬치 가게','./kkochi/'],
        ['🔁','패턴 놀이터','./pattern/'],
        ['✏️','점 잇기','./connect/']
      ]
    },
    find: {
      title:'👀 찾기와 짝맞추기',
      accent:'#d9625b',
      items:[
        ['🔍','찾기 놀이터','./play/'],
        ['🎲','동물 주사위','./dice/'],
        ['🍩','도넛 짝맞추기','./donut/'],
        ['🎡','돌림 블록','./twist/'],
        ['🧭','방향·색 놀이터','./matrix/'],
        ['💡','생각 놀이터','./bag/']
      ]
    }
  };

  function speak(text){
    if(!window.speechSynthesis) return 0;
    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);
      u.lang='ko-KR';u.rate=1;u.pitch=1.15;
      speechSynthesis.speak(u);
      return 1;
    }catch(e){return 0}
  }

  function profileName(){
    if(!window.Profile) return '은아';
    const current=Profile.current();
    const p=Profile.LIST.find(x=>x.id===current);
    return p ? p.name : '은아';
  }

  function syncProfile(){
    const name=profileName();
    document.getElementById('check-euna').hidden = name !== '은아';
    document.getElementById('check-seoha').hidden = name !== '서하';
  }

  document.querySelectorAll('[data-profile-name]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(!window.Profile) return;
      const name=btn.dataset.profileName;
      const p=Profile.LIST.find(x=>x.name===name);
      if(!p) return;
      if(p.id!==Profile.current()) Profile.set(p.id);
      syncProfile();
      speak(name+', 어서 와!');
    });
  });

  const ja=document.querySelector('.japanese');
  const jaLocked=window.ParentSettings && !ParentSettings.japaneseUnlocked();
  document.getElementById('ja-lock').hidden=!jaLocked;

  ja.addEventListener('click',e=>{
    if(!jaLocked) return;
    e.preventDefault();
    speak('한글 놀이터에서 낱말 카드를 열 장 모으면 열려요!');
  });

  document.querySelectorAll('.stage a.hotspot').forEach(a=>{
    if(a.classList.contains('japanese')) return;
    a.addEventListener('click',e=>{
      e.preventDefault();
      const label=a.getAttribute('aria-label') || '';
      const spoke=speak(label);
      setTimeout(()=>location.href=a.href,spoke?700:0);
    });
  });

  const backdrop=document.getElementById('drawer-backdrop');
  const drawer=document.getElementById('drawer');
  const title=document.getElementById('drawer-title');
  const grid=document.getElementById('drawer-grid');

  function openDrawer(key){
    const d=DATA[key];
    if(!d) return;
    drawer.style.setProperty('--accent',d.accent);
    title.textContent=d.title;
    grid.innerHTML='';
    d.items.forEach(([ico,name,href])=>{
      const a=document.createElement('a');
      a.className='drawer-card';
      a.href=href;
      a.innerHTML='<span class="ico">'+ico+'</span><span>'+name+'</span>';
      a.addEventListener('click',e=>{
        e.preventDefault();
        const spoke=speak(name);
        setTimeout(()=>location.href=href,spoke?700:0);
      });
      grid.appendChild(a);
    });
    backdrop.classList.add('open');
    backdrop.setAttribute('aria-hidden','false');
    speak(d.title.replace(/[^\uAC00-\uD7A30-9 ]/g,'').trim());
  }

  function closeDrawer(){
    backdrop.classList.remove('open');
    backdrop.setAttribute('aria-hidden','true');
  }

  document.querySelectorAll('[data-drawer]').forEach(b=>{
    b.addEventListener('click',()=>openDrawer(b.dataset.drawer));
  });
  document.getElementById('drawer-close').addEventListener('click',closeDrawer);
  backdrop.addEventListener('click',e=>{if(e.target===backdrop)closeDrawer()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});

  syncProfile();
})();
</script>

<script src="./shared/sw-register.js"></script>
<script src="./shared/pet-avatar.js"></script>
<script src="./shared/pet.js"></script>
</body>
</html>
