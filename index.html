<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fffaf0">
<title>은아와 서하의 놀이터</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="./shared/pet.css">

<style>
:root{
  --paper:#fffaf0;
  --ink:#3e342e;
  --yellow:#e7b12e;
  --blue:#4e9bd2;
  --green:#64a95e;
  --purple:#8a64b5;
  --orange:#e58a2f;
  --red:#d9625b;
  --soft-yellow:#fff6d9;
  --soft-blue:#edf6fc;
  --soft-green:#eef8eb;
  --soft-purple:#f4edf9;
  --soft-orange:#fff1df;
  --soft-red:#fdebea;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  color:var(--ink);
  font-family:
    "Nanum Pen Script",
    "Apple SD Gothic Neo",
    "Malgun Gothic",
    "Noto Sans KR",
    sans-serif;
  user-select:none;
  background:
    radial-gradient(circle at 15% 10%, rgba(244,210,138,.22), transparent 26%),
    radial-gradient(circle at 85% 20%, rgba(255,255,255,.7), transparent 25%),
    radial-gradient(circle at 45% 80%, rgba(238,217,166,.16), transparent 30%),
    repeating-linear-gradient(
      8deg,
      rgba(120,92,60,.025) 0 1px,
      transparent 1px 5px
    ),
    var(--paper);
}

.page{
  width:min(920px,100%);
  margin:0 auto;
  padding:20px 18px calc(34px + env(safe-area-inset-bottom));
}

.doodle-top{
  position:relative;
  padding:10px 6px 8px;
}

.doodle{
  position:absolute;
  opacity:.85;
  pointer-events:none;
}

.cloud{
  width:74px;
  height:34px;
  border:4px solid #86c7ea;
  border-radius:50px;
  filter:blur(.1px);
}
.cloud::before,
.cloud::after{
  content:"";
  position:absolute;
  border:4px solid #86c7ea;
  border-radius:50%;
  background:transparent;
}
.cloud::before{width:26px;height:26px;left:10px;top:-17px}
.cloud::after{width:32px;height:32px;right:8px;top:-21px}

.cloud.c1{left:0;top:10px;transform:rotate(-4deg) scale(.9)}
.cloud.c2{right:4px;top:136px;transform:rotate(7deg) scale(.82)}

.star{
  width:34px;
  height:34px;
  color:#ec7fb6;
  right:85px;
  top:0;
  font-size:40px;
  line-height:1;
  transform:rotate(8deg);
}

.sun{
  right:8px;
  top:43px;
  width:62px;
  height:62px;
  border:4px solid #efb62d;
  border-radius:50%;
  display:grid;
  place-items:center;
  color:#d68f18;
  font-size:26px;
  transform:rotate(5deg);
}
.sun::before{
  content:"☻";
  font-size:28px;
}
.sun::after{
  content:"";
  position:absolute;
  inset:-20px;
  background:
    linear-gradient(#efb62d,#efb62d) center top/4px 16px no-repeat,
    linear-gradient(#efb62d,#efb62d) center bottom/4px 16px no-repeat,
    linear-gradient(90deg,#efb62d,#efb62d) left center/16px 4px no-repeat,
    linear-gradient(90deg,#efb62d,#efb62d) right center/16px 4px no-repeat;
  transform:rotate(8deg);
}

.title-wrap{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  padding-top:18px;
}

.rainbow{
  width:96px;
  height:68px;
  position:relative;
  overflow:hidden;
  flex:none;
  transform:rotate(-7deg);
}
.rainbow span{
  position:absolute;
  left:0;
  bottom:-15px;
  border-style:solid;
  border-radius:70px 70px 0 0;
  border-bottom:0;
}
.rainbow .r1{width:96px;height:82px;border-width:8px;border-color:#e95d4d}
.rainbow .r2{width:82px;height:70px;left:7px;border-width:8px;border-color:#f0a735}
.rainbow .r3{width:68px;height:58px;left:14px;border-width:8px;border-color:#e2cf42}
.rainbow .r4{width:54px;height:46px;left:21px;border-width:8px;border-color:#59a85d}
.rainbow .r5{width:40px;height:34px;left:28px;border-width:8px;border-color:#4c83c9}
.rainbow .r6{width:26px;height:22px;left:35px;border-width:8px;border-color:#8756a8}

h1{
  margin:0;
  font-size:clamp(34px,6.6vw,58px);
  line-height:1.05;
  font-weight:900;
  letter-spacing:-.045em;
  text-align:center;
  text-shadow:
    1px 0 rgba(62,52,46,.15),
    -1px 1px rgba(62,52,46,.10);
  transform:rotate(-.4deg);
}

.profiles{
  display:flex;
  justify-content:center;
  gap:16px;
  margin:22px auto 26px;
  flex-wrap:wrap;
}

.profile-btn{
  min-width:245px;
  min-height:94px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:16px;
  border:4px solid var(--ink);
  border-radius:48px 40px 46px 42px;
  background:rgba(255,255,255,.54);
  color:var(--ink);
  font:inherit;
  font-size:clamp(28px,4.6vw,40px);
  font-weight:900;
  box-shadow:none;
  cursor:pointer;
  position:relative;
}

.profile-btn:first-child{
  border-color:#e8ad29;
  transform:rotate(-.8deg);
}

.profile-btn:nth-child(2){
  transform:rotate(.7deg);
}

.profile-btn .p-emoji{
  font-size:1.4em;
}

.profile-btn.sel::after{
  content:"✓";
  color:#efa928;
  font-size:.85em;
  font-family:sans-serif;
  transform:rotate(-10deg);
}

.apps{
  display:flex;
  flex-direction:column;
  gap:18px;
}

.cat{
  border:4px solid var(--cat-crayon);
  background:var(--cat-bg);
  border-radius:34px 26px 36px 28px;
  overflow:hidden;
  position:relative;
  transform:rotate(-.2deg);
}

.cat:nth-child(even){
  transform:rotate(.18deg);
}

.cat-learn{--cat-crayon:#e3ad28;--cat-bg:#fffaf0}
.cat-draw{--cat-crayon:#4c98cf;--cat-bg:#edf6fc}
.cat-shape{--cat-crayon:#63a65b;--cat-bg:#eef8eb}
.cat-color{--cat-crayon:#8b66b5;--cat-bg:#f5eff9}
.cat-order{--cat-crayon:#e68b2e;--cat-bg:#fff3e3}
.cat-find{--cat-crayon:#d8665f;--cat-bg:#fdeceb}

.cat-head{
  width:100%;
  min-height:116px;
  display:flex;
  align-items:center;
  gap:18px;
  border:0;
  background:transparent;
  padding:14px 22px 14px 22px;
  color:var(--ink);
  font:inherit;
  cursor:pointer;
  text-align:left;
}

.cat-rabbit{
  width:88px;
  height:88px;
  object-fit:contain;
  flex:none;
  border-radius:50%;
}

.cat-name{
  flex:1;
  font-size:clamp(31px,5.2vw,44px);
  font-weight:900;
  letter-spacing:-.025em;
}

.cat-chev{
  width:62px;
  height:62px;
  display:grid;
  place-items:center;
  flex:none;
  border:4px solid var(--cat-crayon);
  border-radius:50%;
  background:rgba(255,255,255,.4);
  color:var(--cat-crayon);
  font-family:sans-serif;
  font-size:28px;
  font-weight:900;
  transform:rotate(0deg);
  transition:transform .22s ease;
}
.cat.open .cat-chev{
  transform:rotate(180deg);
}

.cat-body{
  display:grid;
  grid-template-rows:0fr;
  transition:grid-template-rows .25s ease;
}

.cat.open .cat-body{
  grid-template-rows:1fr;
}

.cat-cards{
  min-height:0;
  overflow:hidden;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px 20px;
  padding:0 28px;
}

.cat.open .cat-cards{
  padding-bottom:26px;
}

.app-card{
  min-height:104px;
  display:flex;
  align-items:center;
  gap:18px;
  padding:14px 18px;
  border:4px solid rgba(62,52,46,.82);
  border-radius:22px 18px 24px 19px;
  background:rgba(255,255,255,.72);
  color:var(--ink);
  text-decoration:none;
  position:relative;
  transform:rotate(-.35deg);
}

.app-card:nth-child(even){
  transform:rotate(.3deg);
}

.app-card::after{
  content:"";
  position:absolute;
  inset:4px 7px 6px 4px;
  border:1px solid rgba(62,52,46,.10);
  border-radius:inherit;
  pointer-events:none;
}

.app-card:active{
  transform:translate(2px,2px) rotate(0deg);
}

.app-card[hidden]{display:none}
.app-name{display:contents}

.ge{
  font-size:clamp(42px,6vw,58px);
  line-height:1;
  flex:none;
}

.gn{
  font-size:clamp(24px,4vw,34px);
  font-weight:900;
  line-height:1.15;
  word-break:keep-all;
  letter-spacing:-.03em;
}

.app-card.locked{
  opacity:.62;
}
.app-card.locked .ge{
  filter:grayscale(.2);
}
.lock-badge{
  position:absolute;
  top:10px;
  right:12px;
  font-size:30px;
}

.parent-link{
  display:block;
  width:max-content;
  margin:22px auto 0;
  color:#796f67;
  text-decoration:none;
  font-size:20px;
  font-weight:800;
  border-bottom:2px dashed rgba(62,52,46,.3);
  padding-bottom:4px;
}

.footer-doodle{
  position:relative;
  height:86px;
  margin-top:4px;
  overflow:hidden;
}

.grass{
  position:absolute;
  left:0;right:0;bottom:0;
  height:20px;
  border-top:4px solid #87b96d;
  transform:skewX(-8deg);
}

.tree{
  position:absolute;
  left:-4px;
  bottom:8px;
  font-size:66px;
  transform:rotate(-4deg);
}

.flower{
  position:absolute;
  left:112px;
  bottom:4px;
  font-size:34px;
  transform:rotate(6deg);
}

.dolphin{
  position:absolute;
  right:3px;
  bottom:0;
  font-size:72px;
  transform:rotate(-8deg);
}

@keyframes card-nope{
  0%,100%{transform:translateX(0)}
  25%,75%{transform:translateX(-8px)}
  50%{transform:translateX(8px)}
}
.app-card.nope{animation:card-nope .4s}

@media (max-width:760px){
  .page{padding-inline:12px}
  .title-wrap{gap:8px}
  .rainbow{width:74px;height:54px}
  .rainbow .r1{width:74px;height:64px}
  .rainbow .r2{width:62px;height:54px;left:6px}
  .rainbow .r3{width:50px;height:44px;left:12px}
  .rainbow .r4{width:38px;height:34px;left:18px}
  .rainbow .r5{width:26px;height:24px;left:24px}
  .rainbow .r6{width:14px;height:14px;left:30px}
  .profile-btn{min-width:150px;min-height:72px;padding:8px 16px}
  .cat-head{min-height:92px;padding:10px 14px}
  .cat-rabbit{width:68px;height:68px}
  .cat-chev{width:50px;height:50px;font-size:22px}
  .cat-cards{padding:0 16px;gap:12px}
  .cat.open .cat-cards{padding-bottom:18px}
  .app-card{min-height:82px;padding:10px 12px;gap:12px}
}

@media (max-width:520px){
  .cloud.c1{transform:scale(.6) rotate(-4deg);left:-10px}
  .cloud.c2{transform:scale(.55) rotate(7deg);right:-12px;top:105px}
  .sun{transform:scale(.72) rotate(5deg);right:-4px;top:34px}
  .star{transform:scale(.75) rotate(8deg);right:64px}
  .profiles{gap:10px}
  .profile-btn{min-width:138px}
  .cat-cards{grid-template-columns:1fr}
  .app-card{min-height:76px}
  .gn{font-size:clamp(24px,7vw,30px)}
  .ge{font-size:42px}
}

@media (prefers-reduced-motion:reduce){
  .cat-body,.cat-chev{transition:none}
  .app-card.nope{animation:none}
}
</style>
</head>

<script>
(() => {
  function speak(text) {
    if (!window.speechSynthesis) return 0;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR';
      u.rate = 1.0;
      u.pitch = 1.15;
      const vs = speechSynthesis.getVoices().filter(v =>
        v.lang && v.lang.replace('_','-').toLowerCase().indexOf('ko') === 0
      );
      if (vs.length) {
        let uri = null;
        try { uri = localStorage.getItem('enjoy-voice-ko'); } catch(e) {}
        u.voice = vs.find(v => v.voiceURI === uri) || vs[0];
      }
      speechSynthesis.speak(u);
      return 1;
    } catch(e) {
      return 0;
    }
  }

  function koName(card) {
    const el = card.querySelector('.app-name');
    return el ? el.textContent.replace(/[^가-힣0-9 ]/g,'').trim() : '';
  }

  const picker = document.getElementById('profile-picker');

  if (window.Profile && picker) {
    Profile.LIST.forEach(p => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'profile-btn' + (p.id === Profile.current() ? ' sel' : '');

      let avatar = p.emoji;
      if (p.name === '은아') avatar = '🐰';
      if (p.name === '서하') avatar = '🐻';

      b.innerHTML = '<span class="p-emoji">' + avatar + '</span>' + p.name;

      b.addEventListener('click', () => {
        if (p.id === Profile.current()) {
          speak(p.name + ', 어서 와!');
          return;
        }

        Profile.set(p.id);
        speak(p.name + ', 어서 와!');
        setTimeout(() => location.reload(), 900);
      });

      picker.appendChild(b);
    });
  }

  if (window.ParentSettings && ParentSettings.get('showPractika')) {
    const practika = document.getElementById('card-practika');
    if (practika) practika.hidden = false;
  }

  const jaCard = document.querySelector('a[href="./japanese/"]');
  const jaLocked = window.ParentSettings && !ParentSettings.japaneseUnlocked();

  if (jaCard && jaLocked) {
    jaCard.classList.add('locked');
    jaCard.insertAdjacentHTML('beforeend','<span class="lock-badge">🔒</span>');
  }

  document.querySelectorAll('.cat-head').forEach(head => {
    head.addEventListener('click', () => {
      const cat = head.closest('.cat');
      const wasOpen = cat.classList.contains('open');

      document.querySelectorAll('.cat').forEach(c => {
        c.classList.remove('open');
        const ch = c.querySelector('.cat-head');
        if (ch) ch.setAttribute('aria-expanded','false');
      });

      if (!wasOpen) {
        cat.classList.add('open');
        head.setAttribute('aria-expanded','true');

        const nm = head.querySelector('.cat-name');
        speak(nm ? nm.textContent.replace(/[^가-힣0-9 ]/g,'').trim() : '');
      }
    });
  });

  document.querySelectorAll('.app-card').forEach(card => {
    card.addEventListener('click', e => {
      e.preventDefault();

      if (card.classList.contains('locked')) {
        card.classList.remove('nope');
        void card.offsetWidth;
        card.classList.add('nope');
        speak('한글 놀이터에서 낱말 카드를 열 장 모으면 열려요!');
        return;
      }

      const spoke = speak(koName(card));
      setTimeout(() => {
        location.href = card.href;
      }, spoke ? 900 : 0);
    });
  });
})();
</script>

<script src="./shared/sw-register.js"></script>
<script src="./shared/pet-avatar.js"></script>
<script src="./shared/pet.js"></script>

</body>
</html>
