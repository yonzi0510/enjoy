<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFD9E6">
<title>은아와 서하의 놀이터</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="./shared/pet.css">
<style>
/* ── "포근한 장난감 방" — DESIGN.md 기준 구현 ──
   카드 = 장난감 블록: 틴트 표면 + 유채색 chunk 단면 + 대표색 원거리 그림자.
   검정 반투명 그림자는 쓰지 않는다. */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { height: 100%; }
body {
  /* height 고정 + 세로 중앙 정렬은 내용이 화면보다 길어지면 위아래가 잘리고
     스크롤이 막힌다. min-height + .wrap의 margin:auto 로 스크롤 가능한 중앙 정렬. */
  min-height: 100%;
  font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
  /* 무지개 파스텔 3색 그라데이션 + 블러 글로우 2개 + 아주 옅은 물방울 도트 */
  background:
    radial-gradient(ellipse at 15% 8%,  rgba(255,178,208,.45), transparent 60%),
    radial-gradient(ellipse at 88% 88%, rgba(148,206,255,.40), transparent 58%),
    radial-gradient(rgba(255,255,255,.5) 1.2px, transparent 1.3px),
    linear-gradient(160deg, #FFE0EC 0%, #EDE1FB 48%, #D3F1FF 100%);
  background-size: auto, auto, 24px 24px, auto;
  display: flex;
  user-select: none;
}
.wrap {
  margin: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(18px, 4vmin, 40px);
  padding: 20px 16px calc(24px + env(safe-area-inset-bottom));
  width: 100%;
}
h1 {
  font-size: clamp(28px, 6.5vmin, 52px);
  font-weight: 900;
  color: #5E3D7C; /* 한 톤 짙게 — 가독성 */
  text-shadow: 0 2px 0 rgba(255,255,255,.85);
  text-align: center;
  animation: card-in .35s ease-out backwards;
}
/* ── 놀이 묶음 6개 ──
   순서 기준은 '만든 날짜'가 아니라 '놀이 성격'이다. 한 번 정한 자리는 고정해서
   아이가 위치로 기억하게 하고, 새 놀이는 맨 뒤가 아니라 자기 묶음 안으로 들어간다.
   글을 못 읽는 아이를 위해 머리표는 묶음마다 다른 '핑크 토끼'가 대신 알려준다. */
.apps {
  display: flex;
  flex-direction: column;
  gap: clamp(18px, 3.4vmin, 34px);
  width: 100%;
  max-width: 1040px;
}
/* 묶음 하나 = 상자 하나. 머리표(토끼)를 누르면 그 묶음만 펼쳐진다.
   한 번에 하나만 열려 있어 여섯 묶음이 늘 한 화면에 들어온다. */
.cat {
  width: 100%;
  border-radius: clamp(18px, 3.4vmin, 26px);
  background: linear-gradient(180deg, #FFFFFF 0%, var(--cat-tint) 100%);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.65),
    0 6px 0 var(--cat-chunk),
    0 14px 22px rgba(var(--cat-accent), .18);
  animation: card-in .35s ease-out backwards;
}
.cat-title { margin: 0; }
.cat-head {
  display: flex;
  align-items: center;
  gap: clamp(8px, 1.8vmin, 14px);
  width: 100%;
  padding: clamp(6px, 1.2vmin, 10px) clamp(12px, 2.4vmin, 20px) clamp(6px, 1.2vmin, 10px) clamp(6px, 1.2vmin, 10px);
  border: 0;
  border-radius: inherit;
  background: none;
  font-family: inherit;
  cursor: pointer;
  text-align: left;
}
.cat-head:focus-visible { outline: 3px solid var(--cat-chunk); outline-offset: -3px; }
.cat-rabbit {
  display: block;
  flex: none;
  width: clamp(52px, 10.5vmin, 78px);
  height: clamp(52px, 10.5vmin, 78px);
  border-radius: 50%;
}
.cat-name {
  flex: 1;
  font-size: clamp(17px, 3.6vmin, 27px);
  font-weight: 900;
  color: var(--cat-ink);
  word-break: keep-all; /* '모양 만들/기'처럼 낱말 중간에서 꺾이지 않게 */
}
/* 펼침 화살표 — 글을 못 읽는 아이에게 '누르면 열린다'를 알려주는 유일한 신호라
   동그란 배지로 키워 눈에 띄게 한다 */
.cat-chev {
  flex: none;
  display: grid;
  place-items: center;
  width: clamp(30px, 6vmin, 42px);
  height: clamp(30px, 6vmin, 42px);
  border-radius: 50%;
  background: #fff;
  box-shadow: inset 0 0 0 2px var(--cat-chunk), 0 2px 0 rgba(var(--cat-accent), .35);
  font-size: clamp(15px, 3vmin, 21px);
  line-height: 1;
  color: var(--cat-chunk);
  transition: transform .24s ease;
}
.cat.open .cat-chev { transform: rotate(180deg); }
/* 접힘/펼침 — grid 1fr 트릭으로 높이를 몰라도 부드럽게 여닫는다 */
.cat-body {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows .26s ease;
}
.cat.open .cat-body { grid-template-rows: 1fr; }
/* 묶음별 색 (DESIGN.md chunk 공식 — 같은 hue에서 명도 −18~25%p) */
.cat-learn { --cat-accent: 245,179,1;   --cat-chunk: #C68C00; --cat-tint: #FFF4D6; --cat-ink: #7A5A08; }
.cat-draw  { --cat-accent: 92,184,232;  --cat-chunk: #2F8CC2; --cat-tint: #E4F3FC; --cat-ink: #1D5A85; }
.cat-shape { --cat-accent: 46,196,182;  --cat-chunk: #1E8F84; --cat-tint: #DFF6F3; --cat-ink: #12645C; }
.cat-color { --cat-accent: 138,123,224; --cat-chunk: #5F50B8; --cat-tint: #EDEAFB; --cat-ink: #493C8F; }
.cat-order { --cat-accent: 230,140,60;  --cat-chunk: #B4701C; --cat-tint: #FBEAD8; --cat-ink: #8A4A16; }
.cat-find  { --cat-accent: 232,93,154;  --cat-chunk: #C13B78; --cat-tint: #FCE7F1; --cat-ink: #8B3A5B; }
/* 놀이 버튼 — 상자 안에 격자로 깔린다.
   overflow:hidden 은 접힘 애니메이션(0fr↔1fr)에서 내용이 삐져나오지 않게 하는 것 */
.cat-cards {
  overflow: hidden;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(clamp(128px, 40vw, 172px), 1fr));
  gap: clamp(7px, 1.6vmin, 12px);
  padding: 0 clamp(9px, 1.8vmin, 15px);
}
.cat.open .cat-cards { padding-bottom: clamp(10px, 2vmin, 16px); }
.app-card {
  /* 기본은 메인홈 라벤더 — 아래에서 버튼마다 자기 앱 색으로 덮는다 */
  --accent: 201,188,232; /* 원거리 그림자용 rgb 삼중값 */
  --chunk: #B7A6DE;      /* 버튼색을 짙게 만든 바닥 단면색 */
  --tint: #F4EFFC;       /* 표면에 스미는 옅은 틴트 */
  display: flex;
  align-items: center;
  gap: clamp(5px, 1.2vmin, 9px);
  min-height: 48px; /* 5세 터치 영역 하한 */
  padding: clamp(8px, 1.7vmin, 12px) clamp(8px, 1.6vmin, 12px);
  border-radius: 14px;
  background: linear-gradient(180deg, #FFFFFF 0%, var(--tint) 100%);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.75),
    0 3px 0 var(--chunk),
    0 7px 12px rgba(var(--accent), .16);
  text-decoration: none;
  transition: transform .12s, box-shadow .12s;
}
.ge { font-size: clamp(19px, 4vmin, 27px); line-height: 1; flex: none; }
.gn {
  font-size: clamp(11px, 2.5vmin, 15px);
  font-weight: 800;
  color: #43391E;
  line-height: 1.25;
  word-break: keep-all;
}
/* 카드별 대표색 (DESIGN.md 색표) — HTML을 안 고치고 href로 입힌다 */
.app-card[href="./play/"]     { --accent: 255,217,61;  --chunk: #D9A800; --tint: #FFF6D9; }
.app-card[href="./english/"]  { --accent: 255,143,176; --chunk: #E05C86; --tint: #FFEAF1; }
.app-card[href="./pixel/"]    { --accent: 77,201,143;  --chunk: #2E9E6B; --tint: #E3F7EC; }
.app-card[href="./hangul/"]   { --accent: 245,179,1;   --chunk: #C68C00; --tint: #FFF4D6; }
.app-card[href="./japanese/"] { --accent: 247,168,196; --chunk: #D9739B; --tint: #FDEBF2; }
.app-card[href="./write/"]    { --accent: 92,184,232;  --chunk: #2F8CC2; --tint: #E4F3FC; }
.app-card[href="./math/"]     { --accent: 255,154,77;  --chunk: #DB6E1E; --tint: #FFEEDF; }
.app-card[href="./shape/"]    { --accent: 46,196,182;  --chunk: #1E8F84; --tint: #DFF6F3; }
.app-card[href="./market/"]   { --accent: 255,138,101; --chunk: #D95B32; --tint: #FFEDE5; }
.app-card[href="./lab/"]      { --accent: 156,204,101; --chunk: #6B9E3A; --tint: #F0F7E6; }
.app-card[href="./bag/"]      { --accent: 201,154,91;  --chunk: #A5763A; --tint: #F6ECDD; }
.app-card[href="./coloring/"] { --accent: 232,93,154;  --chunk: #C13B78; --tint: #FCE7F1; }
.app-card[href="./burger/"]   { --accent: 226,75,59;   --chunk: #B8321F; --tint: #FCE4E0; }
.app-card[href="./kkochi/"]   { --accent: 230,140,60;  --chunk: #B4701C; --tint: #FBEAD8; }
.app-card[href="./pattern/"]  { --accent: 31,158,147;  --chunk: #147A70; --tint: #D6F1EE; }
.app-card[href="./matrix/"]   { --accent: 76,175,110;  --chunk: #3E8F58; --tint: #E6F5EC; }
.app-card[href="./beads/"]    { --accent: 79,163,232;  --chunk: #2E77B0; --tint: #E4F0FB; }
.app-card[href="./cups/"]     { --accent: 224,80,150;  --chunk: #C43179; --tint: #FCE4F1; }
.app-card[href="./tubes/"]    { --accent: 92,120,190;  --chunk: #4A5F9E; --tint: #E9EEFA; }
.app-card[href="./connect/"]  { --accent: 242,105,75;  --chunk: #C74A30; --tint: #FFE7DC; }
.app-card[href="./dice/"]     { --accent: 96,178,110;  --chunk: #3E9B5B; --tint: #E8F6EC; }
.app-card[href="./rings/"]    { --accent: 255,122,162; --chunk: #E86A93; --tint: #FFEAF1; }
.app-card[href="./slide/"]    { --accent: 233,78,52;   --chunk: #C6371F; --tint: #FCE6DE; }
.app-card[href="./donut/"]    { --accent: 224,92,134;  --chunk: #C24A72; --tint: #FCE7EE; }
.app-card[href="./twist/"]    { --accent: 199,138,74;  --chunk: #A56A2A; --tint: #FBEEDD; }
.app-card[href="./tangram/"]  { --accent: 232,120,60;  --chunk: #C25E24; --tint: #FDECE0; }
.app-card[href="./geoboard/"] { --accent: 124,108,224;  --chunk: #6C5CE7; --tint: #ECEAFB; }
.app-card[href="./lines/"]    { --accent: 88,178,164;   --chunk: #3F9C87; --tint: #E5F5F1; }
.app-card[href="./practika/"] { --accent: 138,123,224; --chunk: #5F50B8; --tint: #EDEAFB; }
/* 묶음 상자 자체는 스태거로 등장한다 (버튼은 접혀 있어 개별 지연이 의미 없다) */
.apps .cat:nth-child(1) { animation-delay: .05s; }
.apps .cat:nth-child(2) { animation-delay: .11s; }
.apps .cat:nth-child(3) { animation-delay: .17s; }
.apps .cat:nth-child(4) { animation-delay: .23s; }
.apps .cat:nth-child(5) { animation-delay: .29s; }
.apps .cat:nth-child(n+6) { animation-delay: .35s; }
.app-card:active {
  /* chunk가 3px→1px로 줄며 블록이 눌리는 느낌 */
  transform: translateY(2px) scale(.97);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.75),
    0 1px 0 var(--chunk),
    0 4px 8px rgba(var(--accent), .12);
}
.app-card[hidden] { display: none; } /* hidden 속성이 위 display:flex에 밀리지 않게 */
.app-name { display: contents; } /* koName()이 읽는 래퍼 — 배치는 .ge/.gn 이 맡는다 */
/* 잠긴 버튼(일본어 — 한글 카드 10장을 모으면 열림) */
.app-card.locked {
  position: relative;
  opacity: .8;
  --accent: 150,142,170; --chunk: #C7C0D4; --tint: #F1EFF6; /* 회색 처리 */
}
.app-card.locked .ge { filter: grayscale(.9); }
.lock-badge {
  position: absolute;
  top: 3px; right: 5px;
  font-size: clamp(12px, 2.6vmin, 17px);
}
@keyframes card-in {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes card-nope {
  0%, 100% { transform: translateX(0); }
  25%, 75% { transform: translateX(-6px); }
  50% { transform: translateX(6px); }
}
.app-card.nope { animation: card-nope .4s; }
.parent-link {
  font-size: clamp(12px, 2.6vmin, 16px);
  font-weight: 700;
  color: #9A8BBF; /* 한 톤 짙게 — 가독성 */
  text-decoration: none;
  padding: 8px 14px;
  border-radius: 999px;
  animation: card-in .35s ease-out .45s backwards;
}
.parent-link:active { color: #5E3D7C; }
/* 누가 놀 건지 고르기 (은아·서하) */
.profiles {
  display: flex;
  gap: clamp(10px, 2.6vmin, 20px);
  animation: card-in .35s ease-out backwards;
}
.profile-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  border: 4px solid transparent;
  cursor: pointer;
  padding: clamp(8px, 2vmin, 14px) clamp(16px, 3.6vmin, 30px);
  border-radius: 999px;
  background: linear-gradient(180deg, #FFFFFF 0%, #F4EFFC 100%);
  font-family: inherit;
  font-size: clamp(17px, 4.2vmin, 28px);
  font-weight: 900;
  color: #5E3D7C;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.65),
    0 5px 0 #CBBFE4,
    0 12px 20px rgba(139,120,190,.16);
  transition: transform .12s, box-shadow .12s;
}
.profile-btn:active {
  transform: translateY(3px) scale(.98);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.65),
    0 2px 0 #CBBFE4,
    0 7px 12px rgba(139,120,190,.12);
}
.profile-btn .p-emoji { font-size: clamp(24px, 5.6vmin, 40px); }
.profile-btn.sel {
  background: linear-gradient(180deg, #FFFFFF 0%, #FFF6DC 100%);
  border-color: #FFB800;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.7),
    0 5px 0 #DFA400,
    0 12px 20px rgba(255,184,0,.22);
}
.profile-btn.sel::after { content: '✔'; color: #FFB800; font-size: .8em; }
/* 모션 줄이기 설정 존중 */
@media (prefers-reduced-motion: reduce) {
  h1, .profiles, .parent-link, .app-card, .app-card.nope, .cat { animation: none; }
  .app-card, .profile-btn { transition: none; }
  .cat-body, .cat-chev { transition: none; }
}
/* ── 가로 모드 (태블릿 가로가 1차 기준 — DESIGN.md "가로모드 우선") ──
   HTML은 그대로 두고 배치만 바꾼다. 세로모드는 위 기본 규칙 그대로.
   카드 폭을 줄여 3~4열로 펼치고, 아이콘 크기는 화면 높이(vh) 기준으로 낮춰
   한 화면에 카드가 최대한 들어오게 한다. */
@media (orientation: landscape) {
  .wrap { gap: clamp(12px, 2.2vh, 22px); }
  .apps { gap: clamp(9px, 1.6vh, 16px); max-width: 1100px; }
  /* 가로는 세로 공간이 귀하다 — 머리표를 낮추고 버튼을 한 줄에 더 많이 */
  .cat-head { padding: 5px 16px 5px 5px; gap: 10px; }
  .cat-rabbit { width: clamp(42px, 7.4vh, 62px); height: clamp(42px, 7.4vh, 62px); }
  .cat-name { font-size: clamp(15px, 2.6vh, 22px); }
  .cat-chev {
    width: clamp(26px, 4.6vh, 38px);
    height: clamp(26px, 4.6vh, 38px);
    font-size: clamp(13px, 2.3vh, 18px);
  }
  .cat-cards {
    grid-template-columns: repeat(auto-fill, minmax(clamp(120px, 15vw, 168px), 1fr));
    gap: clamp(6px, 1vh, 11px);
    padding: 0 clamp(8px, 1vw, 14px);
  }
  .app-card { min-height: 44px; padding: clamp(6px, 1.1vh, 10px) clamp(7px, .9vw, 11px); }
}
/* 넓은 가로(패드) — 프로필·제목·부모 링크를 한 줄에 모아 세로 공간을 아낀다.
   재배치는 grid-template-areas로만 한다 (선례: shared/pet.css 끝부분).
   1100px 미만에서는 제목이 두 줄로 꺾여 오히려 손해라 넓은 화면에서만 쓴다. */
@media (orientation: landscape) and (min-width: 1100px) {
  .wrap {
    display: grid;
    grid-template-columns: 1fr auto 1fr; /* 좌 프로필 · 중앙 제목 · 우 부모 링크 */
    grid-template-areas:
      "profiles title link"
      "apps     apps  apps";
    align-items: center;
    column-gap: 16px;
    row-gap: clamp(14px, 2.6vh, 26px);
    max-width: 1160px;
  }
  h1 { grid-area: title; white-space: nowrap; }
  .profiles { grid-area: profiles; justify-self: start; gap: 12px; }
  .parent-link { grid-area: link; justify-self: end; white-space: nowrap; }
  .apps { grid-area: apps; justify-self: center; width: 100%; }
  /* 옆 칸이 좁아도 이름이 세로로 꺾이지 않게 + 버튼을 홀쭉하게 (터치 높이는 유지) */
  .profile-btn { white-space: nowrap; padding: clamp(6px, 1.4vh, 12px) 18px; }
}
</style>
</head>
<body>
<div class="wrap">
<h1>🌈 은아와 서하의 놀이터</h1>
<div class="profiles" id="profile-picker"><!-- 스크립트가 은아·서하 버튼 생성 --></div>
<div class="apps">
  <section class="cat cat-learn open">
    <h2 class="cat-title"><button class="cat-head" type="button" aria-expanded="true">
      <img class="cat-rabbit" src="./assets/cat-learn.png" alt="">
      <span class="cat-name">📚 배우기</span>
      <span class="cat-chev" aria-hidden="true">▾</span>
    </button></h2>
    <div class="cat-body"><div class="cat-cards">
    <a class="app-card" href="./hangul/"><span class="app-name"><span class="ge">🌟</span><span class="gn">한글 놀이터</span></span></a>
    <a class="app-card" href="./english/"><span class="app-name"><span class="ge">🗣️</span><span class="gn">영어 놀이터</span></span></a>
    <a class="app-card" href="./japanese/"><span class="app-name"><span class="ge">🌸</span><span class="gn">일본어 놀이터</span></span></a>

<script>window.EnjoyProfileBadge = false; /* 홈엔 선택 버튼이 있어 배지 생략 */</script>
<script src="./shared/profile.js"></script>
<script src="./shared/parent-settings.js"></script>
<script>
(() => {
  // ── 글을 못 읽는 아이를 위해: 카드를 누르면 앱 이름을 말해 준 뒤 이동한다 ──
  function speak(text) {
    if (!window.speechSynthesis) return 0;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR';
      u.rate = 1.0;
      u.pitch = 1.15;
      const vs = speechSynthesis.getVoices().filter(v => v.lang && v.lang.replace('_', '-').toLowerCase().indexOf('ko') === 0);
      if (vs.length) {
        let uri = null;
        try { uri = localStorage.getItem('enjoy-voice-ko'); } catch (e) {}
        u.voice = vs.find(v => v.voiceURI === uri) || vs[0];
      }
      speechSynthesis.speak(u);
      return 1;
    } catch (e) { return 0; }
  }
  function koName(card) {
    // "🔍 찾기 놀이터" → "찾기 놀이터" (이모지는 읽지 않게)
    const el = card.querySelector('.app-name');
    return el ? el.textContent.replace(/[^가-힣0-9 ]/g, '').trim() : '';
  }

  // ── 누가 놀 건지 고르기 (은아·서하) — 진행도가 아이별로 나뉜다 ──
  const picker = document.getElementById('profile-picker');
  Profile.LIST.forEach(p => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'profile-btn' + (p.id === Profile.current() ? ' sel' : '');
    b.innerHTML = '<span class="p-emoji">' + p.emoji + '</span>' + p.name;
    b.addEventListener('click', () => {
      if (p.id === Profile.current()) { speak(p.name + ', 어서 와!'); return; }
      Profile.set(p.id);
      speak(p.name + ', 어서 와!');
      // 아이별 진행도(일본어 잠금 등)를 다시 반영하기 위해 새로고침
      setTimeout(() => location.reload(), 900);
    });
    picker.appendChild(b);
  });

  // ── 프랙티카: 회화 내용이 5세엔 어려워 부모가 허용할 때만 보여준다 ──
  if (window.ParentSettings && ParentSettings.get('showPractika')) {
    document.getElementById('card-practika').hidden = false;
  }

  // ── 일본어: 한글 낱말 카드 10장을 모으면 열림 (부모가 바로 열어줄 수도 있음) ──
  const jaCard = document.querySelector('a[href="./japanese/"]');
  const jaLocked = window.ParentSettings && !ParentSettings.japaneseUnlocked();
  if (jaCard && jaLocked) {
    jaCard.classList.add('locked');
    jaCard.insertAdjacentHTML('beforeend', '<span class="lock-badge">🔒</span>');
  }

  // ── 묶음 펼치기 — 토끼를 누르면 그 묶음만 열린다 (한 번에 하나) ──
  // 아이는 글을 못 읽으므로 화살표가 돌아가는 모습 + 묶음 이름을 읽어 주는 소리로 알린다.
  document.querySelectorAll('.cat-head').forEach(head => {
    head.addEventListener('click', () => {
      const cat = head.closest('.cat');
      const wasOpen = cat.classList.contains('open');
      document.querySelectorAll('.cat').forEach(c => {
        c.classList.remove('open');
        c.querySelector('.cat-head').setAttribute('aria-expanded', 'false');
      });
      if (!wasOpen) {
        cat.classList.add('open');
        head.setAttribute('aria-expanded', 'true');
        const nm = head.querySelector('.cat-name');
        speak(nm ? nm.textContent.replace(/[^가-힣0-9 ]/g, '').trim() : '');
      }
    });
  });

  document.querySelectorAll('.app-card').forEach(card => {
    card.addEventListener('click', e => {
      e.preventDefault();
      if (card.classList.contains('locked')) {
        card.classList.remove('nope');
        void card.offsetWidth;
        card.classList.add('nope');
        speak('한글 놀이터에서 낱말 카드를 열 장 모으면 열려요!');
        return;
      }
      const spoke = speak(koName(card));
      setTimeout(() => { location.href = card.href; }, spoke ? 900 : 0);
    });
  });
})();
</script>
