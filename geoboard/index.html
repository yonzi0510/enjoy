<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#EDEBFB">
<title>지오보드</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="../shared/voice-settings.css">
<link rel="stylesheet" href="../shared/time-limit.css">
<link rel="stylesheet" href="../shared/pet.css">
<link rel="stylesheet" href="../shared/crayon.css">
<link rel="stylesheet" href="../shared/doodle-menu.css">
<link rel="stylesheet" href="css/doodle.css">
<link rel="stylesheet" href="../shared/screen.css">
</head>
<body>

<!-- ═══ 아이 손그림 아이콘 모음 ═══
     화면 틀에 쓰던 이모지(📌⭐🔊🗣️◀▶)를 아이가 그린 듯한 인라인 SVG 로 바꾼다.
     · 획을 feTurbulence + feDisplacementMap 으로 실제로 떨리게 해 자로 그은 티를 지운다
       (본보기: shared/home-button.js 의 집 단추)
     · 칠은 윤곽선 밖으로 조금 삐져나가게 따로 그린다 — 크레용으로 색칠한 아이 그림처럼
     ⚠️ 고무줄 5색(빨강·파랑·노랑·초록·주황)은 여기서 절대 쓰지 않는다.
        색 맞추기가 곧 놀이라, 틀 아이콘이 같은 색을 쓰면 아이가 헷갈린다.
     쓰는 법: <svg class="ico"><use href="#gb-star"/></svg> -->
<svg class="ico-defs" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 삐뚤삐뚤 손떨림 (윤곽선용) -->
    <filter id="gb-hand" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3"/>
    </filter>
    <!-- 삐져나간 칠 (색칠용) — 더 크게 흔들어 윤곽 밖으로 번지게 -->
    <filter id="gb-spill" x="-28%" y="-28%" width="156%" height="156%">
      <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7"/>
    </filter>
  </defs>

  <!-- 📌 압정(못) — 이 놀이의 얼굴. 머리는 보라(고무줄 5색과 겹치지 않게) -->
  <symbol id="gb-pin" viewBox="0 0 100 100">
    <g filter="url(#gb-spill)" opacity=".9">
      <path d="M30 11 L70 13 L64 28 L75 47 L26 46 L37 27 Z" fill="#A78BE8"/>
    </g>
    <g filter="url(#gb-hand)" fill="none" stroke="#2E2A24"
       stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M32 13 L68 13 L63 27 L73 45 L27 45 L37 27 Z"/>
      <path d="M50 46 L50 90" stroke-width="6"/>
    </g>
  </symbol>

  <!-- ⭐ 별 — 모은 별·다 한 퍼즐 표시 -->
  <symbol id="gb-star" viewBox="0 0 100 100">
    <g filter="url(#gb-spill)" opacity=".92">
      <path d="M52 16 L63 40 L87 44 L67 59 L74 83 L50 71 L28 85 L33 58 L14 42 L39 37 Z" fill="#F4C020"/>
    </g>
    <path filter="url(#gb-hand)" d="M50 13 L61 38 L88 41 L68 58 L74 85 L50 71 L26 85 L32 58 L12 41 L39 38 Z"
          fill="none" stroke="#2E2A24" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  </symbol>

  <!-- 🔊 소리 — 듣기 단추 -->
  <symbol id="gb-sound" viewBox="0 0 100 100">
    <g filter="url(#gb-spill)" opacity=".85">
      <path d="M19 39 L34 39 L54 22 L54 80 L34 63 L19 63 Z" fill="#BFD9F2"/>
    </g>
    <g filter="url(#gb-hand)" fill="none" stroke="#2E2A24"
       stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 40 L33 40 L52 23 L52 79 L33 62 L18 62 Z"/>
      <path d="M66 36 Q78 51 66 66"/>
      <path d="M80 24 Q96 51 80 78"/>
    </g>
  </symbol>

  <!-- 🗣️ 말풍선 — 목소리 설정 -->
  <symbol id="gb-voice" viewBox="0 0 100 100">
    <g filter="url(#gb-hand)" fill="none" stroke="#2E2A24"
       stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 21 L85 21 L85 63 L46 63 L28 82 L31 63 L15 63 Z" fill="#FFFFFF"/>
      <path d="M31 36 L69 36"/>
      <path d="M31 49 L56 49"/>
    </g>
  </symbol>

  <!-- ◀ 뒤로 -->
  <symbol id="gb-back" viewBox="0 0 100 100">
    <path filter="url(#gb-hand)" d="M63 19 L29 50 L63 81" fill="none" stroke="#2E2A24"
          stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- ▶ 다음 -->
  <symbol id="gb-next" viewBox="0 0 100 100">
    <path filter="url(#gb-hand)" d="M37 19 L71 50 L37 81" fill="none" stroke="currentColor"
          stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- 제목에서 첫 놀이로 내려꽂는 점선 화살표 — "여기부터 놀아 보자"
       (꼬리는 오른쪽 위, 머리는 왼쪽 아래) -->
  <symbol id="gb-arrow" viewBox="0 0 160 80">
    <g filter="url(#gb-hand)" fill="none" stroke="currentColor"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M152 12 C122 4, 76 11, 47 31 C31 42, 23 55, 19 70" stroke-width="6" stroke-dasharray="2 13"/>
      <path d="M6 53 L19 72 L34 57" stroke-width="6.4"/>
    </g>
  </symbol>
</svg>

<!-- 홈 -->
<section class="screen on" id="scr-home">
  <header class="home-head">
    <h1><svg class="ico ico-title" aria-hidden="true"><use href="#gb-pin"/></svg> 지오보드</h1>
    <div class="stats">
      <span class="stat"><svg class="ico" aria-hidden="true"><use href="#gb-star"/></svg> <b id="home-stars">0</b></span>
      <a href="../" class="vs-btn" style="text-decoration:none" aria-label="메인 놀이터로">🏠</a>
      <span id="pet-slot"></span>
      <button type="button" id="btn-voice" class="vs-btn" aria-label="목소리 설정"><svg class="ico" aria-hidden="true"><use href="#gb-voice"/></svg></button>
    </div>
  </header>
  <div class="menu" id="menu"></div>
</section>

<!-- 퍼즐 목록 -->
<section class="screen" id="scr-list">
  <header class="bar">
    <button type="button" class="back" data-go="scr-home" aria-label="뒤로"><svg class="ico" aria-hidden="true"><use href="#gb-back"/></svg></button>
    <h2 id="list-title"><svg class="ico" aria-hidden="true"><use href="#gb-pin"/></svg> 쉬운 모양</h2>
    <span class="page-count" id="list-count">0 / 10</span>
  </header>
  <div class="puzzles-list" id="list"></div>
</section>

<!-- 놀이(고무줄 걸기) -->
<section class="screen" id="scr-play">
  <header class="bar">
    <button type="button" class="back" id="btn-play-back" aria-label="뒤로"><svg class="ico" aria-hidden="true"><use href="#gb-back"/></svg></button>
    <h2 id="play-title"><svg class="ico" aria-hidden="true"><use href="#gb-pin"/></svg> 똑같이 걸어요</h2>
    <button type="button" class="bigbtn small" id="btn-listen" aria-label="듣기"><svg class="ico" aria-hidden="true"><use href="#gb-sound"/></svg> <span class="btn-label">듣기</span></button>
  </header>
  <div class="play-stage">
    <!-- 본보기 카드 -->
    <div class="card-panel">
      <div class="card-cap"><svg class="ico" aria-hidden="true"><use href="#gb-pin"/></svg> 이렇게 걸어요!</div>
      <div class="board-slot card-slot">
        <div class="board-box" id="card-board"></div>
      </div>
    </div>
    <!-- 놀이 못판 + 색 고무줄 트레이 -->
    <div class="play-panel">
      <div class="board-slot play-slot">
        <div class="board-box" id="board"></div>
      </div>
      <div class="tray" id="tray"></div>
    </div>
  </div>
</section>

<!-- 보상 오버레이 -->
<div class="reward" id="reward">
  <div class="reward-card">
    <div class="reward-board" id="reward-board"></div>
    <div class="reward-praise" id="reward-praise">참 잘했어요!</div>
    <div class="reward-btns">
      <button type="button" class="bigbtn" id="reward-close">그만할래</button>
      <button type="button" class="bigbtn primary" id="reward-next">다음 <svg class="ico" aria-hidden="true"><use href="#gb-next"/></svg></button>
    </div>
  </div>
</div>

<!-- 색종이 축하 -->
<div class="confetti" id="confetti" aria-hidden="true"></div>

<script src="../shared/profile.js"></script>
<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/progress.js"></script>
<script src="js/app.js"></script>
<script src="../shared/parent-settings.js"></script>
<script src="../shared/voice-settings.js"></script>
<script src="../shared/pet-avatar.js"></script>
<script src="../shared/pet.js"></script>
<script src="../shared/time-limit.js"></script>
<script src="../shared/sw-register.js"></script>
<script src="../shared/home-button.js"></script>
</body>
</html>
