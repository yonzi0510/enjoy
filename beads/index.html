<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#DCEBFB">
<title>구슬 보드</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="../shared/voice-settings.css">
<link rel="stylesheet" href="../shared/time-limit.css">
<link rel="stylesheet" href="../shared/pet.css">
<link rel="stylesheet" href="../shared/crayon.css">
<link rel="stylesheet" href="../shared/doodle-menu.css">
</head>
<body>

<!-- ═══════ 아이가 그린 손그림 아이콘 모음 ═══════
     이모지 대신 쓰는 그림들. feTurbulence + feDisplacementMap 으로 획을 떨리게 해
     자로 그은 티를 없앤다. 굵고 고른 획, 삐뚤한 선.
     ⚠️ 놀이용 구슬(js/data.js 의 drawBead)은 여기 없다 — 구슬 색은 놀이 규칙이라 손대지 않는다. -->
<svg class="doodle-defs" aria-hidden="true" focusable="false"><defs>
  <filter id="d-wob" x="-25%" y="-25%" width="150%" height="150%">
    <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="5"/>
    <feDisplacementMap in="SourceGraphic" scale="5"/>
  </filter>
  <filter id="d-wob2" x="-25%" y="-25%" width="150%" height="150%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
    <feDisplacementMap in="SourceGraphic" scale="4"/>
  </filter>

  <!-- 구슬 한 알 (제목·배지용 장식) -->
  <symbol id="d-bead" viewBox="0 0 100 100">
    <g filter="url(#d-wob)" stroke="#2E2A24" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="50" cy="52" r="34" fill="#BFE0F7" stroke-width="7"/>
      <path d="M33 41 Q40 31 51 30" fill="none" stroke="#FFFFFF" stroke-width="7"/>
    </g>
  </symbol>

  <!-- 별 (모은 별·다 한 퍼즐) -->
  <symbol id="d-star" viewBox="0 0 100 100">
    <path filter="url(#d-wob)"
          d="M50 15 L59 39 L85 41 L65 57 L72 82 L50 68 L28 82 L35 57 L15 41 L41 39 Z"
          fill="#F6C453" stroke="#2E2A24" stroke-width="6"
          stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- 말풍선 (목소리 설정) -->
  <symbol id="d-speak" viewBox="0 0 100 100">
    <g filter="url(#d-wob)" stroke="#2E2A24" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 21 L84 22 L83 65 L50 66 L33 84 L36 65 L15 64 Z" fill="#FFF3D0" stroke-width="7"/>
      <path d="M32 37 L68 38 M32 51 L57 51" fill="none" stroke-width="6"/>
    </g>
  </symbol>

  <!-- 나팔 (듣기) -->
  <symbol id="d-sound" viewBox="0 0 100 100">
    <g filter="url(#d-wob)" stroke="#2E2A24" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13 40 L29 39 L47 21 L48 79 L29 61 L13 60 Z" fill="#F6C453" stroke-width="7"/>
      <path d="M62 34 Q72 50 62 67" stroke-width="7"/>
      <path d="M79 24 Q92 50 78 76" stroke-width="7"/>
    </g>
  </symbol>

  <!-- 화살표 ◀ ▶ -->
  <symbol id="d-back" viewBox="0 0 100 100">
    <path filter="url(#d-wob2)" d="M65 17 L30 50 L64 83" fill="none"
          stroke="#2E2A24" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="d-next" viewBox="0 0 100 100">
    <path filter="url(#d-wob2)" d="M35 17 L70 50 L36 83" fill="none"
          stroke="#2E2A24" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- 크레용 (본보기 카드 머리말) -->
  <symbol id="d-crayon" viewBox="0 0 100 100">
    <g filter="url(#d-wob)" transform="rotate(-22 50 50)" stroke="#2E2A24"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M50 14 L62 27 L62 80 L38 80 L38 27 Z" fill="#F58A72" stroke-width="6"/>
      <path d="M38 40 L62 40" fill="none" stroke-width="5"/>
    </g>
  </symbol>
</defs></svg>

<!-- 홈 -->
<section class="screen on" id="scr-home">
  <header class="home-head">
    <h1><svg class="ico" aria-hidden="true"><use href="#d-bead"/></svg> 구슬 보드</h1>
    <div class="stats">
      <span class="stat"><svg class="ico" aria-hidden="true"><use href="#d-star"/></svg> <b id="home-stars">0</b></span>
      <a href="../" class="vs-btn" style="text-decoration:none" aria-label="메인 놀이터로">🏠</a>
      <span id="pet-slot"></span>
      <button type="button" id="btn-voice" class="vs-btn" aria-label="목소리 설정"><svg class="ico" aria-hidden="true"><use href="#d-speak"/></svg></button>
    </div>
  </header>
  <div class="menu" id="menu"></div>
</section>

<!-- 퍼즐 목록 -->
<section class="screen" id="scr-list">
  <header class="bar">
    <button type="button" class="back" data-go="scr-home" aria-label="뒤로"><svg class="ico" aria-hidden="true"><use href="#d-back"/></svg></button>
    <h2 id="list-title"><svg class="ico" aria-hidden="true"><use href="#d-bead"/></svg> 작은 보드</h2>
    <span class="page-count" id="list-count">0 / 10</span>
  </header>
  <div class="list-box" id="list-box"></div>
</section>

<!-- 놀이(구슬 채우기) -->
<section class="screen" id="scr-play">
  <header class="bar">
    <button type="button" class="back" id="btn-play-back" aria-label="뒤로"><svg class="ico" aria-hidden="true"><use href="#d-back"/></svg></button>
    <h2 id="play-title"><svg class="ico" aria-hidden="true"><use href="#d-bead"/></svg> 구슬 보드</h2>
    <button type="button" class="bigbtn small" id="btn-listen" aria-label="듣기"><svg class="ico" aria-hidden="true"><use href="#d-sound"/></svg><span class="btn-label">듣기</span></button>
  </header>
  <div class="play-stage" id="play-stage">
    <!-- 본보기 카드 (색·위치를 크게, 글씨 없이 그림만) -->
    <div class="sample-card" id="sample-card">
      <div class="sample-cap"><svg class="ico" aria-hidden="true"><use href="#d-crayon"/></svg> 이렇게 채워요!</div>
      <div class="sample-holder" id="sample-holder"></div>
    </div>
    <!-- 오른쪽: 빈 보드 + 색 팔레트 -->
    <div class="work-col" id="work-col">
      <div class="board-holder" id="board-holder"></div>
      <div class="palette" id="palette"></div>
    </div>
  </div>
  <!-- 드래그 중 따라다니는 구슬 -->
  <div class="drag-ghost" id="drag-ghost" hidden></div>
</section>

<!-- 보상 오버레이 -->
<div class="reward" id="reward">
  <div class="reward-card">
    <div class="reward-bead" id="reward-bead"><svg class="ico" aria-hidden="true"><use href="#d-bead"/></svg></div>
    <div class="reward-praise" id="reward-praise">참 잘했어요!</div>
    <div class="reward-btns">
      <button type="button" class="bigbtn" id="reward-close">그만할래</button>
      <button type="button" class="bigbtn primary" id="reward-next">다음 <svg class="ico" aria-hidden="true"><use href="#d-next"/></svg></button>
    </div>
  </div>
</div>

<!-- 색종이 축하 -->
<div class="confetti" id="confetti" aria-hidden="true"></div>

<script src="../shared/profile.js"></script>
<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/progress.js"></script>
<script src="js/app.js"></script>
<script src="../shared/parent-settings.js"></script>
<script src="../shared/voice-settings.js"></script>
<script src="../shared/pet-avatar.js"></script>
<script src="../shared/pet.js"></script>
<script src="../shared/time-limit.js"></script>
<script src="../shared/sw-register.js"></script>
<script src="../shared/home-button.js"></script>
</body>
</html>
