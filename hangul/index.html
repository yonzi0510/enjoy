<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFF3C4">
<title>가나다 한글 놀이터</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="../shared/voice-settings.css">
<link rel="stylesheet" href="../shared/time-limit.css">
<link rel="stylesheet" href="../shared/pet.css">
<link rel="stylesheet" href="../shared/crayon.css">
<link rel="stylesheet" href="../shared/doodle-menu.css">
</head>
<body>

<!-- 손그림 필터 — 아이가 그린 것처럼 획을 떨리게 한다.
     한 문서 안의 인라인 SVG 는 id 로 필터를 함께 쓸 수 있어서 여기 한 번만 둔다.
     (같은 수법의 예: shared/home-button.js 의 집 그림) -->
<svg class="kid-defs" aria-hidden="true" focusable="false" width="0" height="0">
  <defs>
    <!-- 윤곽선용 — 자로 그은 티가 안 나게 살짝만 떨린다 -->
    <filter id="kid-wobble" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3"/>
    </filter>
    <!-- 화살표용 — 더 크게 떨려서 손으로 죽 그은 느낌 -->
    <filter id="kid-wobble-big" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4.5"/>
    </filter>
  </defs>
</svg>

<!-- 홈 -->
<section class="screen on" id="scr-home">
  <header class="home-head">
    <h1>🌟 가나다 한글 놀이터</h1>
    <div class="stats">
      <span class="stat">⭐ <b id="home-stars">0</b></span>
      <span class="stat">🃏 <b id="home-cards">0</b></span>
      <a href="../" class="vs-btn" style="text-decoration:none" aria-label="메인 놀이터로">🏠</a>
      <span id="pet-slot"></span>
      <button type="button" id="btn-voice" class="vs-btn" aria-label="목소리 설정">🗣️</button>
    </div>
  </header>
  <div class="menu">
    <!-- 가장 큰 칸 = 제일 먼저 할 것. 아이는 글을 못 읽으니 크기와 화살표로 알려준다. -->
    <button type="button" class="menu-card m-learn" data-go="learn">
      <!-- 제목에서 첫 놀이로 향하는 점선 화살표 (칸에 붙어 있어 칸이 움직여도 같이 따라간다) -->
      <svg class="mc-arrow" viewBox="0 0 140 78" aria-hidden="true" focusable="false">
        <g filter="url(#kid-wobble-big)" fill="none" stroke="#E0729A"
           stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 12 C36 3, 76 10, 101 32 C112 42, 117 51, 119 60" stroke-dasharray="1 13"/>
          <path d="M102 45 L120 66 L133 43"/>
        </g>
      </svg>
      <span class="mc-emoji">
        <!-- 펼친 책 — 안 닫힌 선, 색은 윤곽 밖으로 조금 삐져나온다 -->
        <svg class="ki" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
          <g filter="url(#kid-wobble)">
            <g transform="translate(-3,-3.5)">
              <path d="M50 27 C38 18, 21 16, 10 20 L12 78 C24 73, 41 74, 50 82 Z" fill="#FFDE86"/>
              <path d="M50 27 C62 18, 79 16, 90 20 L88 78 C76 73, 59 74, 50 82 Z" fill="#FFF1BE"/>
            </g>
            <g fill="none" stroke="#2E2A24" stroke-linecap="round" stroke-linejoin="round">
              <path d="M50 28 C38 19, 21 17, 10 21 L12 79 C24 74, 41 75, 50 83" stroke-width="7"/>
              <path d="M50 28 C62 19, 79 17, 90 21 L88 79 C76 74, 59 75, 50 83" stroke-width="7"/>
              <path d="M50 29 L50 82" stroke-width="5.5"/>
              <path d="M22 39 L40 42" stroke-width="4.5"/>
              <path d="M21 55 L39 58" stroke-width="4.5"/>
              <path d="M60 42 L78 39" stroke-width="4.5"/>
              <path d="M61 58 L79 55" stroke-width="4.5"/>
            </g>
          </g>
        </svg>
      </span><span class="mc-name">글자 배우기</span>
      <span class="mc-desc">ㄱㄴㄷ 소리와 낱말</span>
    </button>
    <button type="button" class="menu-card m-trace" data-go="trace">
      <span class="mc-emoji">
        <!-- 연필 — 노란 몸통에 분홍 지우개 -->
        <svg class="ki" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
          <g filter="url(#kid-wobble)">
            <g transform="translate(-3,-3.5)">
              <path d="M20 68 L66 16 L83 31 L37 83 Z" fill="#FFD54A"/>
              <path d="M66 16 L73 8 L90 23 L83 31 Z" fill="#F79AB8"/>
              <path d="M17 88 L20 68 L37 83 Z" fill="#F2E1C0"/>
            </g>
            <g fill="none" stroke="#2E2A24" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 88 L20 68 L66 16 L83 31 L37 83 Z" stroke-width="7"/>
              <path d="M66 16 L73 8 L90 23 L83 31" stroke-width="7"/>
              <path d="M20 68 L37 83" stroke-width="5"/>
              <path d="M62 21 L78 35" stroke-width="4.5"/>
            </g>
          </g>
        </svg>
      </span><span class="mc-name">따라쓰기</span>
      <span class="mc-desc">획순 따라 손가락 쓰기</span>
    </button>
    <button type="button" class="menu-card m-play" data-go="scr-games">
      <span class="mc-emoji">
        <!-- 게임기 — 십자 단추와 안 닫힌 동그라미 두 개 -->
        <svg class="ki" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
          <g filter="url(#kid-wobble)">
            <g transform="translate(-3.5,-4)">
              <path d="M24 34 C12 39, 10 66, 20 73 C29 79, 38 70, 50 70 C62 70, 71 79, 80 73 C90 66, 88 39, 76 34 C62 28, 38 28, 24 34 Z" fill="#A8DCF5"/>
              <circle cx="61" cy="44" r="8" fill="#F2A2A2"/>
              <circle cx="76" cy="57" r="7" fill="#FFD54A"/>
            </g>
            <g fill="none" stroke="#2E2A24" stroke-linecap="round" stroke-linejoin="round">
              <path d="M24 34 C12 39, 10 66, 20 73 C29 79, 38 70, 50 70 C62 70, 71 79, 80 73 C90 66, 88 39, 76 34 C62 28, 38 28, 24 34 Z" stroke-width="7"/>
              <path d="M32 41 L32 63" stroke-width="7"/>
              <path d="M21 52 L43 52" stroke-width="7"/>
              <path d="M67 39 C61 34, 53 39, 54 46 C55 53, 65 54, 67 47" stroke-width="5.5"/>
              <path d="M81 52 C76 48, 69 52, 70 58 C71 64, 79 64, 80 58" stroke-width="5.5"/>
            </g>
          </g>
        </svg>
      </span><span class="mc-name">한글 놀이</span>
      <span class="mc-desc">거품·첫소리 게임</span>
    </button>
    <button type="button" class="menu-card m-song" data-go="scr-song">
      <span class="mc-emoji">
        <!-- 음표 — 동그라미가 끝까지 안 닫힌다 -->
        <svg class="ki" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
          <g filter="url(#kid-wobble)">
            <g transform="translate(-3.5,-4)">
              <path d="M39 75 C32 69, 17 72, 17 79 C17 86, 28 90, 36 85 Z" fill="#C9B6F2"/>
              <path d="M47 18 C63 21, 78 30, 80 46 C76 34, 62 27, 47 29 Z" fill="#C9B6F2"/>
            </g>
            <g fill="none" stroke="#2E2A24" stroke-linecap="round" stroke-linejoin="round">
              <path d="M38 82 L46 16" stroke-width="8"/>
              <path d="M46 16 C64 19, 80 28, 82 46" stroke-width="8"/>
              <path d="M39 74 C31 67, 16 70, 15 79 C14 88, 27 93, 36 87" stroke-width="8"/>
            </g>
          </g>
        </svg>
      </span><span class="mc-name">가나다 노래</span>
      <span class="mc-desc">글자가 반짝반짝</span>
    </button>
    <button type="button" class="menu-card m-cards" data-go="scr-cards">
      <span class="mc-emoji">
        <!-- 낱말 카드 두 장 — 뒷장이 삐뚜름하게 겹쳐 있다 -->
        <svg class="ki" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
          <g filter="url(#kid-wobble)">
            <path d="M14 27 L6 76 L38 84 L47 33 Z" fill="#B8ECC6" transform="translate(-3,-3.5)"/>
            <path d="M16 30 L8 78 L40 85 L49 36 Z" fill="none" stroke="#2E2A24"
                  stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M43 19 L41 87 L87 87 L87 21 Z" fill="#FFFDF6"/>
            <path d="M64 36 L69 49 L83 50 L72 59 L76 73 L64 65 L52 73 L56 59 L45 50 L59 49 Z"
                  fill="#F5B301" transform="translate(-3,-3.5)"/>
            <g fill="none" stroke="#2E2A24" stroke-linecap="round" stroke-linejoin="round">
              <path d="M44 20 L42 86 L86 86 L86 22 Z" stroke-width="6.5"/>
              <path d="M64 36 L69 49 L83 50 L72 59 L76 73 L64 65 L52 73 L56 59 L45 50 L59 49 Z" stroke-width="5"/>
            </g>
          </g>
        </svg>
      </span><span class="mc-name">카드책</span>
      <span class="mc-desc">모은 낱말 카드</span>
    </button>
  </div>
</section>

<!-- 글자 그리드 (배우기/따라쓰기 공용) -->
<section class="screen" id="scr-letters">
  <header class="bar">
    <button type="button" class="back" data-go="scr-home">◀</button>
    <h2 id="letters-title">📖 글자 배우기</h2>
    <div class="tabs">
      <button type="button" class="tab on" data-tab="consonants">자음</button>
      <button type="button" class="tab" data-tab="vowels">모음</button>
    </div>
  </header>
  <div class="letters-grid" id="letters-grid"></div>
</section>

<!-- 글자 상세 -->
<section class="screen" id="scr-letter">
  <header class="bar">
    <button type="button" class="back" data-go="learn">◀</button>
    <h2 id="letter-name">기역</h2>
  </header>
  <div class="letter-hero">
    <div class="letter-big" id="letter-big">ㄱ</div>
    <button type="button" class="bigbtn" id="letter-sound">🔊 소리 듣기</button>
  </div>
  <div class="letter-words" id="letter-words"></div>
  <button type="button" class="bigbtn primary" id="letter-trace">✏️ 따라쓰기 하러 가기</button>
</section>

<!-- 따라쓰기 -->
<section class="screen" id="scr-trace">
  <header class="bar">
    <button type="button" class="back" data-go="trace">◀</button>
    <h2><span id="trace-ch">ㄱ</span> <small id="trace-name">기역</small></h2>
    <div class="dots" id="trace-dots"></div>
  </header>
  <div class="trace-holder" id="trace-holder">
    <canvas id="trace-canvas" width="560" height="560"></canvas>
  </div>
</section>

<!-- 놀이 메뉴 -->
<section class="screen" id="scr-games">
  <header class="bar">
    <button type="button" class="back" data-go="scr-home">◀</button>
    <h2>🎮 한글 놀이</h2>
  </header>
  <div class="menu">
    <button type="button" class="menu-card m-bubble" data-go="scr-bubble">
      <span class="mc-emoji">🫧</span><span class="mc-name">거품 놀이</span>
      <span class="mc-desc">글자 거품을 찾아 팡!</span>
    </button>
    <button type="button" class="menu-card m-first" data-go="scr-first">
      <span class="mc-emoji">🔤</span><span class="mc-name">첫소리 놀이</span>
      <span class="mc-desc">낱말의 첫 자음 찾기</span>
    </button>
  </div>
</section>

<!-- 거품 놀이 -->
<section class="screen" id="scr-bubble">
  <header class="bar">
    <button type="button" class="back" data-go="scr-games">◀</button>
    <h2>🫧 <span id="bubble-target">ㄱ</span> 찾기</h2>
    <div class="dots" id="bubble-dots"></div>
  </header>
  <div class="bubble-area" id="bubble-area"></div>
</section>

<!-- 첫소리 놀이 -->
<section class="screen" id="scr-first">
  <header class="bar">
    <button type="button" class="back" data-go="scr-games">◀</button>
    <h2>🔤 첫소리 놀이</h2>
    <div class="dots" id="first-dots"></div>
  </header>
  <div class="first-stage">
    <div class="first-emoji" id="first-emoji">🐘</div>
    <div class="first-word" id="first-word">코끼리</div>
    <div class="first-choices" id="first-choices"></div>
  </div>
</section>

<!-- 가나다 노래 -->
<section class="screen" id="scr-song">
  <header class="bar">
    <button type="button" class="back" data-go="scr-home">◀</button>
    <h2>🎵 가나다 노래</h2>
    <div class="tabs">
      <button type="button" class="tab on" data-mode="consonants">가나다</button>
      <button type="button" class="tab" data-mode="vowels">아야어여</button>
    </div>
  </header>
  <div class="song-grid" id="song-grid"></div>
  <button type="button" class="bigbtn primary" id="song-play">▶️ 노래 듣기</button>
</section>

<!-- 카드책 -->
<section class="screen" id="scr-cards">
  <header class="bar">
    <button type="button" class="back" data-go="scr-home">◀</button>
    <h2>🃏 낱말 카드책</h2>
    <span class="stat" id="cards-count">0 / 0</span>
  </header>
  <div class="cards-grid" id="cards-grid"></div>
</section>

<!-- 보상 오버레이 -->
<div class="reward" id="reward">
  <div class="reward-card">
    <div class="reward-title">🎉 낱말 카드 획득!</div>
    <div class="reward-emoji" id="reward-emoji">🎒</div>
    <div class="reward-word" id="reward-word">가방</div>
    <div class="reward-btns">
      <button type="button" class="bigbtn" id="reward-list" hidden>목록으로</button>
      <button type="button" class="bigbtn primary" id="reward-next">다음 글자 ✏️</button>
    </div>
  </div>
</div>

<script src="../shared/profile.js"></script>
<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/progress.js"></script>
<script src="js/trace.js"></script>
<script src="js/games.js"></script>
<script src="js/song.js"></script>
<script src="js/cards.js"></script>
<script src="js/app.js"></script>
<script src="../shared/parent-settings.js"></script>
<script src="../shared/voice-settings.js"></script>
<script src="../shared/pet-avatar.js"></script>
<script src="../shared/pet.js"></script>
<script src="../shared/time-limit.js"></script>
<script src="../shared/sw-register.js"></script>
<script src="../shared/home-button.js"></script>
</body>
</html>
