<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#E8F6EC">
<title>동물 주사위 찾기</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="../shared/voice-settings.css">
<link rel="stylesheet" href="../shared/time-limit.css">
<link rel="stylesheet" href="../shared/pet.css">
<link rel="stylesheet" href="../shared/crayon.css">
<link rel="stylesheet" href="../shared/doodle-menu.css">
</head>
<body>

<!-- ═══════════ 아이가 그린 손그림 (인라인 SVG) ═══════════
     화면 틀에 쓰던 이모지(🎲 ⭐ 🔍 ◀ 🔊 🗣️ ✅) 대신 쓰는 그림들.
     굵고 고른 획, 삐뚤한 선, 안 닫히는 동그라미, 칠은 윤곽 밖으로 조금 삐져나간다.
     — 획 떨림은 feTurbulence + feDisplacementMap 두 벌(윤곽용·칠용)로 낸다.
     — ⚠️ 주사위에 그려진 동물 얼굴(js/data.js)은 여기 없다. 아이가 찾는 놀잇감이라 그대로 둔다. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <!-- 윤곽선용 떨림 — 자로 그은 티를 없앤다 -->
  <filter id="dc-hand" x="-18%" y="-18%" width="136%" height="136%">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="5"/>
    <feDisplacementMap in="SourceGraphic" scale="2.3"/>
  </filter>
  <!-- 칠(크레용)용 떨림 — 더 크게 흔들어 윤곽 밖으로 삐져나가게 한다 -->
  <filter id="dc-crayon" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.027" numOctaves="2" seed="11"/>
    <feDisplacementMap in="SourceGraphic" scale="5"/>
  </filter>

  <!-- 주사위 한 알 (제목·굴리기 단추·단계 표시) -->
  <symbol id="dc-die" viewBox="0 0 48 48">
    <g filter="url(#dc-crayon)" transform="translate(1.6,2.2)">
      <path d="M10 10 H36 V36 H10 Z" fill="#FFE9A8"/>
    </g>
    <g filter="url(#dc-hand)" fill="none" stroke="#2E2A24" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 11 C18 9, 28 12, 37 10 C39 18, 36 28, 38 37 C29 39, 19 36, 10 38 C8 29, 11 19, 10 11 Z"/>
    </g>
    <g filter="url(#dc-hand)" fill="#2E2A24">
      <circle cx="18" cy="17" r="2.8"/><circle cx="31" cy="17" r="2.8"/>
      <circle cx="24" cy="24" r="2.8"/>
      <circle cx="18" cy="31" r="2.8"/><circle cx="31" cy="31" r="2.8"/>
    </g>
  </symbol>

  <!-- 아직 안 굴린 주사위 눈 — 주사위 알(.die)이 이미 네모라 점만 찍는다 -->
  <symbol id="dc-pips" viewBox="0 0 48 48">
    <g filter="url(#dc-hand)" fill="#7A6E60">
      <circle cx="14" cy="14" r="4.4"/><circle cx="34" cy="14" r="4.4"/>
      <circle cx="24" cy="24" r="4.4"/>
      <circle cx="14" cy="34" r="4.4"/><circle cx="34" cy="34" r="4.4"/>
    </g>
  </symbol>

  <!-- 별 (모은 별·완성 딱지) -->
  <symbol id="dc-star" viewBox="0 0 48 48">
    <g filter="url(#dc-crayon)" transform="translate(1.6,2.2)">
      <path d="M24 8 L28.1 19.3 L40.2 19.8 L30.7 27.2 L34 38.8 L24 32 L14 38.8 L17.3 27.2 L7.8 19.8 L19.9 19.3 Z" fill="#FFD34E"/>
    </g>
    <g filter="url(#dc-hand)" fill="none" stroke="#2E2A24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 8 L28.1 19.3 L40.2 19.8 L30.7 27.2 L34 38.8 L24 32 L14 38.8 L17.3 27.2 L7.8 19.8 L19.9 19.3 Z"/>
    </g>
  </symbol>

  <!-- 돋보기 — "찾아 보자" -->
  <symbol id="dc-lens" viewBox="0 0 48 48">
    <g filter="url(#dc-crayon)" transform="translate(1.5,2)"><circle cx="21" cy="20" r="11.5" fill="#BEE4F2"/></g>
    <g filter="url(#dc-hand)" fill="none" stroke="#2E2A24" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M25 8.4 a12.8 12.8 0 1 1 -6.4 .6"/>
      <path d="M29.5 29.5 L40 40.5"/>
    </g>
  </symbol>

  <!-- 뒤로 가기 화살표 -->
  <symbol id="dc-back" viewBox="0 0 48 48">
    <g filter="url(#dc-hand)" fill="none" stroke="#2E2A24" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M29 11 L15 24 L29 37"/><path d="M16 24 H35"/>
    </g>
  </symbol>

  <!-- 목소리 설정(말풍선) -->
  <symbol id="dc-talk" viewBox="0 0 48 48">
    <g filter="url(#dc-crayon)" transform="translate(1.6,2.2)"><path d="M7 10 H41 V30 H21 L13 38 V30 H7 Z" fill="#C7E9CE"/></g>
    <g filter="url(#dc-hand)" fill="none" stroke="#2E2A24" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 10 H41 V30 H21 L13 38 V30 H7 Z"/>
      <path d="M16 20 h.6 M24 20 h.6 M32 20 h.6" stroke-width="4.6"/>
    </g>
  </symbol>

  <!-- 소리 듣기(나팔) -->
  <symbol id="dc-sound" viewBox="0 0 48 48">
    <g filter="url(#dc-crayon)" transform="translate(1.4,2)"><path d="M8 19 H16 L26 11 V37 L16 29 H8 Z" fill="#FFD6A0"/></g>
    <g filter="url(#dc-hand)" fill="none" stroke="#2E2A24" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 19 H16 L26 11 V37 L16 29 H8 Z"/>
      <path d="M32 18 C36 22, 36 26, 32 30" stroke-width="3.4"/>
      <path d="M38.5 13 C45 21, 45 27, 38.5 35" stroke-width="3.4"/>
    </g>
  </symbol>

  <!-- 찾았다 도장 — 안 닫히는 동그라미에 체크 -->
  <symbol id="dc-check" viewBox="0 0 48 48">
    <g filter="url(#dc-crayon)" transform="translate(1.6,2.2)"><circle cx="24" cy="24" r="15" fill="#A9E0AE"/></g>
    <g filter="url(#dc-hand)" fill="none" stroke="#2E2A24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M29 9.2 a16 16 0 1 1 -8 .4"/>
      <path d="M15 24.5 L22 32 L34 15" stroke-width="5"/>
    </g>
  </symbol>

  <!-- 제목에서 첫 놀이(쉬운 주사위)로 향하는 점선 화살표 — "여기부터 놀아 보자" -->
  <symbol id="dc-arrow" viewBox="0 0 110 130">
    <g filter="url(#dc-hand)" fill="none" stroke="#3E9B5B" stroke-width="6"
       stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="11 10">
      <path d="M14 10 C6 42, 12 70, 34 92 C50 108, 68 114, 92 114"/>
    </g>
    <g filter="url(#dc-hand)" fill="none" stroke="#3E9B5B" stroke-width="6"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M76 100 L95 114 L75 126"/>
    </g>
  </symbol>
</defs></svg>

<!-- 홈 -->
<section class="screen on" id="scr-home">
  <header class="home-head">
    <h1><svg class="ic ic-title" aria-hidden="true"><use href="#dc-die"/></svg> 동물 주사위 찾기</h1>
    <div class="stats">
      <span class="stat"><svg class="ic" aria-hidden="true"><use href="#dc-star"/></svg> <b id="home-stars">0</b></span>
      <a href="../" class="vs-btn" style="text-decoration:none" aria-label="메인 놀이터로">🏠</a>
      <span id="pet-slot"></span>
      <button type="button" id="btn-voice" class="vs-btn" aria-label="목소리 설정">
        <svg class="ic" aria-hidden="true"><use href="#dc-talk"/></svg>
      </button>
    </div>
  </header>
  <div class="menu" id="menu"></div>
</section>

<!-- 라운드 목록 -->
<section class="screen" id="scr-rounds">
  <header class="bar">
    <button type="button" class="back" data-go="scr-home" aria-label="처음으로">
      <svg class="ic" aria-hidden="true"><use href="#dc-back"/></svg>
    </button>
    <h2 id="rounds-title">쉬운 주사위</h2>
    <span class="page-count" id="rounds-count">0 / 10</span>
  </header>
  <div class="rounds-list" id="rounds-list"></div>
</section>

<!-- 놀이(찾기) -->
<section class="screen" id="scr-play">
  <header class="bar">
    <button type="button" class="back" id="btn-play-back" aria-label="라운드 고르기로">
      <svg class="ic" aria-hidden="true"><use href="#dc-back"/></svg>
    </button>
    <h2 id="play-title">주사위 찾기</h2>
    <button type="button" class="bigbtn small" id="btn-listen">
      <svg class="ic" aria-hidden="true"><use href="#dc-sound"/></svg> 듣기
    </button>
  </header>
  <div class="play-stage" id="play-stage">
    <!-- 본보기 카드(찾을 동물) -->
    <div class="find-card" id="find-card">
      <div class="find-cap" id="find-cap"><svg class="ic" aria-hidden="true"><use href="#dc-lens"/></svg> 이 동물을 찾아요!</div>
      <div class="find-faces" id="find-faces"></div>
    </div>
    <!-- 주사위판 -->
    <div class="dice-col" id="dice-col">
      <div class="dice-grid n6" id="dice-grid"></div>
      <button type="button" class="bigbtn primary roll" id="btn-roll">
        <svg class="ic" aria-hidden="true"><use href="#dc-die"/></svg> 굴리기
      </button>
    </div>
  </div>
</section>

<!-- 보상 오버레이 -->
<div class="reward" id="reward">
  <div class="reward-card">
    <div class="reward-face" id="reward-face"><svg class="ic ic-reward" aria-hidden="true"><use href="#dc-die"/></svg></div>
    <div class="reward-praise" id="reward-praise">참 잘했어요!</div>
    <div class="reward-btns">
      <button type="button" class="bigbtn" id="reward-close">그만할래</button>
      <button type="button" class="bigbtn primary" id="reward-next">다음 <svg class="ic ic-next" aria-hidden="true"><use href="#dc-back"/></svg></button>
    </div>
  </div>
</div>

<!-- 색종이 축하 -->
<div class="confetti" id="confetti" aria-hidden="true"></div>

<script src="../shared/profile.js"></script>
<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/progress.js"></script>
<script src="js/app.js"></script>
<script src="../shared/parent-settings.js"></script>
<script src="../shared/voice-settings.js"></script>
<script src="../shared/pet-avatar.js"></script>
<script src="../shared/pet.js"></script>
<script src="../shared/time-limit.js"></script>
<script src="../shared/sw-register.js"></script>
<script src="../shared/home-button.js"></script>
</body>
</html>
