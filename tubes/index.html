<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#E9EEFA">
<title>시험관 구슬</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="../shared/voice-settings.css">
<link rel="stylesheet" href="../shared/time-limit.css">
<link rel="stylesheet" href="../shared/pet.css">
<link rel="stylesheet" href="../shared/crayon.css">
<link rel="stylesheet" href="../shared/doodle-menu.css">
</head>
<body>

<!-- 손그림 흔들림 필터 — 아이콘들이 함께 쓴다 (js/doodle.js) -->
<svg class="dd-defs" width="0" height="0" aria-hidden="true" focusable="false">
  <filter id="dd-wobble" x="-25%" y="-25%" width="150%" height="150%">
    <feTurbulence type="fractalNoise" baseFrequency="0.038" numOctaves="2" seed="5"/>
    <feDisplacementMap in="SourceGraphic" scale="3"/>
  </filter>
</svg>

<!-- 홈 -->
<section class="screen on" id="scr-home">
  <header class="home-head">
    <h1><span data-ico="tube3"></span> 시험관 구슬</h1>
    <div class="stats">
      <span class="stat"><span data-ico="star"></span> <b id="home-stars">0</b></span>
      <a href="../" class="vs-btn" style="text-decoration:none" aria-label="메인 놀이터로">🏠</a>
      <span id="pet-slot"></span>
      <button type="button" id="btn-voice" class="vs-btn" aria-label="목소리 설정"><span data-ico="voice"></span></button>
    </div>
  </header>
  <div class="menu" id="menu"></div>
</section>

<!-- 퍼즐 목록 -->
<section class="screen" id="scr-list">
  <header class="bar">
    <button type="button" class="back" data-go="scr-home" aria-label="뒤로"><span data-ico="back"></span></button>
    <h2 id="list-title">🧪 쉬운 관</h2>
    <span class="page-count" id="list-count">0 / 10</span>
  </header>
  <div class="puzzle-list" id="list"></div>
</section>

<!-- 놀이 -->
<section class="screen" id="scr-play">
  <header class="bar">
    <button type="button" class="back" id="btn-play-back" aria-label="뒤로"><span data-ico="back"></span></button>
    <h2 id="play-title">🧪 시험관 구슬</h2>
    <button type="button" class="bigbtn small" id="btn-listen"><span data-ico="listen"></span> 듣기</button>
  </header>
  <div class="play-stage" id="play-stage">
    <!-- 본보기 카드 -->
    <div class="card" id="card">
      <div class="card-cap"><span data-ico="kid"></span> 이렇게 담아요!</div>
      <div class="card-tubes" id="card-tubes"></div>
    </div>
    <!-- 놀이 시험관 -->
    <div class="tubes-area" id="tubes-area">
      <div class="play-tubes" id="play-tubes"></div>
    </div>
    <!-- 색 팔레트 -->
    <div class="palette" id="palette"></div>
  </div>
  <!-- 드래그 중 따라다니는 구슬 -->
  <div class="drag-ghost" id="drag-ghost" hidden></div>
</section>

<!-- 보상 오버레이 -->
<div class="reward" id="reward">
  <div class="reward-card">
    <div class="reward-icon" id="reward-icon"><span data-ico="reward"></span></div>
    <div class="reward-praise" id="reward-praise">참 잘했어요!</div>
    <div class="reward-btns">
      <button type="button" class="bigbtn" id="reward-close">그만할래</button>
      <button type="button" class="bigbtn primary" id="reward-next">다음 <span data-ico="fwd"></span></button>
    </div>
  </div>
</div>

<!-- 색종이 축하 -->
<div class="confetti" id="confetti" aria-hidden="true"></div>

<script src="../shared/profile.js"></script>
<script src="js/data.js"></script>
<script src="js/doodle.js"></script>
<script src="js/audio.js"></script>
<script src="js/progress.js"></script>
<script src="js/app.js"></script>
<script src="../shared/parent-settings.js"></script>
<script src="../shared/voice-settings.js"></script>
<script src="../shared/pet-avatar.js"></script>
<script src="../shared/pet.js"></script>
<script src="../shared/time-limit.js"></script>
<script src="../shared/sw-register.js"></script>
<script src="../shared/home-button.js"></script>
</body>
</html>
