<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFE7DC">
<title>점 잇기</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="../shared/voice-settings.css">
<link rel="stylesheet" href="../shared/time-limit.css">
<link rel="stylesheet" href="../shared/pet.css">
<link rel="stylesheet" href="../shared/crayon.css">
<link rel="stylesheet" href="../shared/doodle-menu.css">
</head>
<body>

<!-- ═══ 아이가 그린 손그림 아이콘 모음 ═══
     이모지 대신 쓰는 그림들. 굵고 고른 획, 둥근 끝, 그리고 feTurbulence +
     feDisplacementMap 으로 획을 실제로 떨리게 해서 자로 그은 티를 지운다.
     (예시는 shared/home-button.js 의 집 단추)
     쓰는 법: <svg class="ico"><use href="#ic-pencil"/></svg> -->
<svg class="ico-defs" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 삐뚤삐뚤 손떨림 — 아이콘 전체에 CSS filter 로 건다 -->
    <filter id="kid-ink" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.042" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3"/>
    </filter>
    <filter id="kid-ink2" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6"/>
    </filter>
  </defs>

  <!-- 연필 — 이 놀이의 얼굴 -->
  <symbol id="ic-pencil" viewBox="0 0 100 100">
    <g fill="none" stroke="#2E2A24" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 82 L25 61 L67 19 L83 35 L41 77 Z" fill="#F6C453"/>
      <path d="M20 82 L25 61 L41 77 Z" fill="#2E2A24" stroke-width="5"/>
      <path d="M60 26 L76 42" stroke-width="6"/>
    </g>
  </symbol>

  <!-- 별 — 잘한 것 표시 -->
  <symbol id="ic-star" viewBox="0 0 100 100">
    <path d="M50 12 L60 38 L88 40 L66 57 L73 84 L50 69 L27 84 L34 57 L12 40 L40 38 Z"
          fill="#F4C020" stroke="#2E2A24" stroke-width="7" stroke-linejoin="round"/>
  </symbol>

  <!-- 소리 — 듣기 단추 -->
  <symbol id="ic-sound" viewBox="0 0 100 100">
    <g fill="none" stroke="#2E2A24" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 40 L33 40 L52 23 L52 79 L33 62 L18 62 Z" fill="#9BD3F0"/>
      <path d="M66 36 Q78 51 66 66"/>
      <path d="M80 24 Q96 51 80 78"/>
    </g>
  </symbol>

  <!-- 말풍선 — 목소리 설정 -->
  <symbol id="ic-voice" viewBox="0 0 100 100">
    <g fill="none" stroke="#2E2A24" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 21 L85 21 L85 63 L46 63 L28 82 L31 63 L15 63 Z" fill="#FFFFFF"/>
      <path d="M31 36 L69 36"/>
      <path d="M31 49 L56 49"/>
    </g>
  </symbol>

  <!-- 물감 판 — 색 순서 안내 -->
  <symbol id="ic-palette" viewBox="0 0 100 100">
    <path d="M50 13 C25 13 10 31 12 52 C14 73 33 89 53 86 C63 84 62 76 57 72 C52 68 55 61 62 61 L73 61
             C84 61 90 54 89 44 C86 26 71 13 50 13 Z"
          fill="#FFFFFF" stroke="#2E2A24" stroke-width="7" stroke-linejoin="round"/>
    <g stroke="#2E2A24" stroke-width="3">
      <circle cx="32" cy="38" r="7" fill="#EA5148"/>
      <circle cx="52" cy="29" r="7" fill="#F4C020"/>
      <circle cx="71" cy="39" r="7" fill="#4FA3E8"/>
      <circle cx="30" cy="60" r="7" fill="#5DBE58"/>
    </g>
  </symbol>

  <!-- 왼쪽 화살표 — 뒤로가기 -->
  <symbol id="ic-back" viewBox="0 0 100 100">
    <path d="M63 19 L29 50 L63 81" fill="none" stroke="#2E2A24"
          stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- 오른쪽 화살표 — 다음 -->
  <symbol id="ic-next" viewBox="0 0 100 100">
    <path d="M37 19 L71 50 L37 81" fill="none" stroke="currentColor"
          stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</svg>

<!-- 홈 -->
<section class="screen on" id="scr-home">
  <header class="home-head">
    <h1><svg class="ico" aria-hidden="true"><use href="#ic-pencil"/></svg> 점 잇기</h1>
    <div class="stats">
      <span class="stat"><svg class="ico" aria-hidden="true"><use href="#ic-star"/></svg> <b id="home-stars">0</b></span>
      <a href="../" class="vs-btn" style="text-decoration:none" aria-label="메인 놀이터로">🏠</a>
      <span id="pet-slot"></span>
      <button type="button" id="btn-voice" class="vs-btn" aria-label="목소리 설정"><svg class="ico" aria-hidden="true"><use href="#ic-voice"/></svg></button>
    </div>
  </header>
  <div class="menu" id="menu"></div>
</section>

<!-- 퍼즐 목록 -->
<section class="screen" id="scr-list">
  <header class="bar">
    <button type="button" class="back" data-go="scr-home" aria-label="뒤로"><svg class="ico" aria-hidden="true"><use href="#ic-back"/></svg></button>
    <h2 id="list-title"><svg class="ico" aria-hidden="true"><use href="#ic-pencil"/></svg> 쉬운 길</h2>
    <span class="page-count" id="list-count">0 / 10</span>
  </header>
  <div class="puzzle-list" id="list"></div>
</section>

<!-- 놀이(점 잇기) -->
<section class="screen" id="scr-play">
  <header class="bar">
    <button type="button" class="back" id="btn-play-back" aria-label="뒤로"><svg class="ico" aria-hidden="true"><use href="#ic-back"/></svg></button>
    <h2 id="play-title"><svg class="ico" aria-hidden="true"><use href="#ic-pencil"/></svg> 점 잇기</h2>
    <button type="button" class="bigbtn small" id="btn-listen"><svg class="ico" aria-hidden="true"><use href="#ic-sound"/></svg> 듣기</button>
  </header>
  <div class="play-stage">
    <!-- 순서 본보기 띠 -->
    <div class="guide-card">
      <div class="guide-cap"><svg class="ico" aria-hidden="true"><use href="#ic-palette"/></svg> 이 색 순서로 이어요!</div>
      <div class="guide" id="guide"></div>
    </div>
    <!-- 점 판 -->
    <div class="board-wrap">
      <div class="board" id="board"></div>
    </div>
  </div>
</section>

<!-- 보상 오버레이 -->
<div class="reward" id="reward">
  <div class="reward-card">
    <div class="reward-board" id="reward-board"></div>
    <div class="reward-praise" id="reward-praise">참 잘했어요!</div>
    <div class="reward-btns">
      <button type="button" class="bigbtn" id="reward-close">그만할래</button>
      <button type="button" class="bigbtn primary" id="reward-next">다음 <svg class="ico" aria-hidden="true"><use href="#ic-next"/></svg></button>
    </div>
  </div>
</div>

<!-- 색종이 축하 -->
<div class="confetti" id="confetti" aria-hidden="true"></div>

<script src="../shared/profile.js"></script>
<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/progress.js"></script>
<script src="js/app.js"></script>
<script src="../shared/parent-settings.js"></script>
<script src="../shared/voice-settings.js"></script>
<script src="../shared/pet-avatar.js"></script>
<script src="../shared/pet.js"></script>
<script src="../shared/time-limit.js"></script>
<script src="../shared/sw-register.js"></script>
<script src="../shared/home-button.js"></script>
</body>
</html>
