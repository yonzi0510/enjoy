<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFEBD0">
<title>산수 놀이터</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="../shared/voice-settings.css">
<link rel="stylesheet" href="../shared/time-limit.css">
<link rel="stylesheet" href="../shared/pet.css">
<link rel="stylesheet" href="../shared/crayon.css">
<link rel="stylesheet" href="../shared/doodle-menu.css">
</head>
<body>

<!-- ═══════════ 아이가 그린 손그림 아이콘 ═══════════
     첫 화면 놀이 칸에서 <use href="#mi-…"> 로 불러 쓴다.
     이모지를 걷어낸 이유 — 기기마다 다른 그림이 나오고, 매끈하게 잘 그려져 있어
     「낙서장」 종이 위에서 혼자 인쇄물처럼 떠 보인다.

     그리는 규칙 (다섯 살이 크레용으로 그린 것처럼):
       · 굵고 고른 획 하나로 — 가늘고 굵은 변화를 주지 않는다
       · 삐뚤한 선 — feTurbulence + feDisplacementMap 으로 실제로 떨게 한다
         (#mi-line, 같은 방식의 선례는 shared/home-button.js)
       · 안 닫히는 동그라미 — 원 대신 320°쯤 도는 호를 쓰고 한 군데를 터 둔다
       · 색은 윤곽 밖으로 삐져나오게 — 채움에는 더 크게 흔드는 #mi-fill 을 따로 먹인다
     ══════════════════════════════════════════════ -->
<svg class="art-defs" aria-hidden="true" focusable="false">
<defs>
  <!-- 윤곽선용: 잔잔하게 떨린다 -->
  <filter id="mi-line" x="-25%" y="-25%" width="150%" height="150%">
    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="3.4"/>
  </filter>
  <!-- 색칠용: 크게 흔들어 선 밖으로 비어져 나오게 -->
  <filter id="mi-fill" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="2" seed="12" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="4.2"/>
  </filter>
</defs>

<!-- ✏️ 숫자 따라쓰기 — 연필과 연필이 그은 선 -->
<symbol id="mi-trace" viewBox="0 0 100 100">
  <g filter="url(#mi-fill)">
    <path d="M32 60 L62 30 L71 39 L41 69 Z" fill="#F7C948"/>
    <path d="M31 61 L41 71 L20 82 Z" fill="#E8A15C"/>
    <path d="M14 90 C26 82 34 96 46 88 C58 80 68 94 84 86" fill="none" stroke="#7BC4F0" stroke-width="7" stroke-linecap="round"/>
  </g>
  <g filter="url(#mi-line)" fill="none" stroke="#2E2A24" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 60 L62 28 L74 40 L42 72 Z"/>
    <path d="M30 60 L42 72 L18 84 Z"/>
  </g>
</symbol>

<!-- 🐸 숫자 징검다리 — 개구리 얼굴 -->
<symbol id="mi-stones" viewBox="0 0 100 100">
  <g filter="url(#mi-fill)">
    <path d="M20 56 C20 34 80 34 80 58 C80 80 20 80 20 56 Z" fill="#8ED96B"/>
    <circle cx="32" cy="32" r="13" fill="#8ED96B"/>
    <circle cx="68" cy="32" r="13" fill="#8ED96B"/>
  </g>
  <g filter="url(#mi-line)" fill="none" stroke="#2E2A24" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 56 C18 32 82 32 82 58 C82 82 20 84 18 62"/>
    <path d="M42.4 38 A12 12 0 1 1 42.4 26" fill="#FFFDF6"/>
    <path d="M78.4 38 A12 12 0 1 1 78.4 26" fill="#FFFDF6"/>
    <path d="M30 62 Q50 78 70 60"/>
  </g>
  <g filter="url(#mi-line)" fill="#2E2A24" stroke="none">
    <circle cx="33" cy="33" r="4.5"/><circle cx="69" cy="33" r="4.5"/>
  </g>
</symbol>

<!-- 🔢 수 세기 — 공 세 개 (셋 다 어딘가 터져 있다) -->
<symbol id="mi-count" viewBox="0 0 100 100">
  <g filter="url(#mi-fill)">
    <circle cx="24" cy="56" r="10" fill="#F58BA8"/>
    <circle cx="52" cy="50" r="10" fill="#7BC4F0"/>
    <circle cx="79" cy="58" r="9" fill="#F7C948"/>
  </g>
  <g filter="url(#mi-line)" fill="none" stroke="#2E2A24" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M35.3 60.1 A12 12 0 1 1 35.3 51.9"/>
    <path d="M63.8 47.9 A12 12 0 1 1 59.7 40.8"/>
    <path d="M75.2 68.3 A11 11 0 1 1 82.8 68.3"/>
  </g>
</symbol>

<!-- 💯 숫자표 채우기 — 칸 그린 표, 두 칸만 칠했다 -->
<symbol id="mi-chart" viewBox="0 0 100 100">
  <g filter="url(#mi-fill)">
    <path d="M19 21 L39 20 L40 40 L20 41 Z" fill="#7FD8C4"/>
    <path d="M66 63 L86 62 L87 82 L67 83 Z" fill="#F7C948"/>
  </g>
  <g filter="url(#mi-line)" fill="none" stroke="#2E2A24" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 18 L86 16 L88 84 L18 86 Z"/>
    <path d="M40 17 L41 85"/>
    <path d="M64 16 L65 85"/>
    <path d="M17 41 L87 39"/>
    <path d="M17 63 L87 61"/>
  </g>
</symbol>

<!-- ✨ 점 잇기 — 점을 이어 만든 별, 마지막 한 줄은 아직 점선 -->
<symbol id="mi-dots" viewBox="0 0 100 100">
  <g filter="url(#mi-line)" fill="none" stroke="#2E2A24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50 20 L69 77 L20 42 L80 42 L31 77"/>
    <path d="M31 77 L50 20" stroke-width="5" stroke-dasharray="2 11"/>
  </g>
  <g filter="url(#mi-fill)" stroke="none">
    <circle cx="50" cy="20" r="8" fill="#F5C542"/>
    <circle cx="80" cy="42" r="8" fill="#EF6A5E"/>
    <circle cx="69" cy="77" r="8" fill="#5FBFE8"/>
    <circle cx="31" cy="77" r="8" fill="#7BC96F"/>
    <circle cx="20" cy="42" r="8" fill="#C7A6EE"/>
  </g>
  <g filter="url(#mi-line)" fill="none" stroke="#2E2A24" stroke-width="4.5">
    <circle cx="50" cy="20" r="7"/><circle cx="80" cy="42" r="7"/>
    <circle cx="69" cy="77" r="7"/><circle cx="31" cy="77" r="7"/><circle cx="20" cy="42" r="7"/>
  </g>
</symbol>

<!-- 🚂 패턴 이어가기 — 기차와 딸린 칸 -->
<symbol id="mi-pattern" viewBox="0 0 100 100">
  <g filter="url(#mi-fill)">
    <path d="M13 43 L53 42 L54 67 L14 68 Z" fill="#EF8A7A"/>
    <path d="M23 25 L35 25 L35 42 L23 42 Z" fill="#EF8A7A"/>
    <path d="M65 49 L89 48 L90 67 L66 68 Z" fill="#7BC4F0"/>
  </g>
  <g filter="url(#mi-line)" fill="none" stroke="#2E2A24" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 42 L54 41 L55 68 L13 69 Z"/>
    <path d="M22 42 L22 24 L36 24 L36 42"/>
    <path d="M64 48 L90 47 L91 68 L65 69 Z"/>
    <path d="M32 76 A8 8 0 1 1 26.7 68.5"/>
    <path d="M54 76 A8 8 0 1 1 48.7 68.5"/>
    <path d="M88 76 A8 8 0 1 1 82.7 68.5"/>
  </g>
</symbol>

<!-- 🎲 주사위 수 놀이 — 삐뚜름한 주사위, 눈 다섯 -->
<symbol id="mi-dice" viewBox="0 0 100 100">
  <g filter="url(#mi-fill)">
    <path d="M21 25 L77 19 L83 73 L27 81 Z" fill="#FFF1D6"/>
  </g>
  <g filter="url(#mi-line)" fill="none" stroke="#2E2A24" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 24 L78 18 L84 74 L26 82 Z"/>
  </g>
  <g filter="url(#mi-fill)" fill="#E8635A" stroke="none">
    <circle cx="37" cy="37" r="6"/><circle cx="66" cy="33" r="6"/>
    <circle cx="52" cy="50" r="6"/>
    <circle cx="41" cy="66" r="6"/><circle cx="70" cy="62" r="6"/>
  </g>
</symbol>

<!-- 🍎 그림 덧셈 — 사과 하나에 작은 ＋ -->
<symbol id="mi-add-visual" viewBox="0 0 100 100">
  <g filter="url(#mi-fill)">
    <path d="M53 40 C36 32 23 45 26 60 C29 75 42 83 52 76 C62 83 75 75 78 60 C81 45 68 32 53 40 Z" fill="#EF6A5E"/>
    <path d="M55 25 C64 18 74 23 69 30 C64 36 57 31 55 26 Z" fill="#7BC96F"/>
  </g>
  <g filter="url(#mi-line)" fill="none" stroke="#2E2A24" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M52 38 C34 30 20 44 24 60 C28 76 42 84 52 76 C62 84 76 76 80 60 C84 44 70 30 52 38 Z"/>
    <path d="M52 38 L54 22"/>
    <path d="M54 24 C64 16 76 22 70 30 C64 37 56 32 54 25" stroke-width="6"/>
  </g>
  <g filter="url(#mi-line)" fill="none" stroke="#2E2A24" stroke-width="8" stroke-linecap="round">
    <path d="M7 22 L25 21"/><path d="M16 13 L16 31"/>
  </g>
</symbol>

<!-- 🍏 그림 뺄셈 — 한 입 베어 문 사과에 작은 － -->
<symbol id="mi-sub-visual" viewBox="0 0 100 100">
  <!-- 베어 문 자국은 마스크로 「파낸다」 — 종이색으로 덧칠하면 카드 바탕색이
       조금만 달라도 흰 얼룩이 남는다 -->
  <mask id="mi-bite">
    <rect x="0" y="0" width="100" height="100" fill="#FFFFFF"/>
    <circle cx="84" cy="54" r="14" fill="#000000"/>
  </mask>
  <g mask="url(#mi-bite)">
    <g filter="url(#mi-fill)">
      <path d="M53 40 C36 32 23 45 26 60 C29 75 42 83 52 76 C62 83 75 75 78 60 C81 45 68 32 53 40 Z" fill="#8FD16A"/>
      <path d="M55 25 C64 18 74 23 69 30 C64 36 57 31 55 26 Z" fill="#4FA84A"/>
    </g>
    <g filter="url(#mi-line)" fill="none" stroke="#2E2A24" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M52 38 C34 30 20 44 24 60 C28 76 42 84 52 76 C62 84 76 76 80 60 C84 44 70 30 52 38 Z"/>
      <path d="M52 38 L54 22"/>
      <path d="M54 24 C64 16 76 22 70 30 C64 37 56 32 54 25" stroke-width="6"/>
    </g>
  </g>
  <!-- 파낸 자리 가장자리 -->
  <g filter="url(#mi-line)" fill="none" stroke="#2E2A24" stroke-width="7" stroke-linecap="round">
    <path d="M84 40 A14 14 0 0 0 84 68"/>
  </g>
  <g filter="url(#mi-line)" fill="none" stroke="#2E2A24" stroke-width="10" stroke-linecap="round">
    <path d="M7 23 L28 21"/>
  </g>
</symbol>

<!-- ➕ 덧셈 문제 — 큼직한 ＋ -->
<symbol id="mi-add" viewBox="0 0 100 100">
  <g filter="url(#mi-fill)">
    <path d="M25 43 L75 42 L75 58 L25 59 Z" fill="#7BC4F0"/>
    <path d="M43 25 L58 25 L57 75 L42 75 Z" fill="#7BC4F0"/>
  </g>
  <g filter="url(#mi-line)" fill="none" stroke="#2E2A24" stroke-width="13" stroke-linecap="round">
    <path d="M22 51 L78 49"/><path d="M50 22 L51 78"/>
  </g>
</symbol>

<!-- ➖ 뺄셈 문제 — 큼직한 － -->
<symbol id="mi-sub" viewBox="0 0 100 100">
  <g filter="url(#mi-fill)">
    <path d="M20 46 L82 42 L82 57 L20 61 Z" fill="#C7A6EE"/>
  </g>
  <g filter="url(#mi-line)" fill="none" stroke="#2E2A24" stroke-width="13" stroke-linecap="round">
    <path d="M20 52 L80 48"/>
  </g>
</symbol>
</svg>

<!-- 홈 -->
<section class="screen on" id="scr-home">
  <header class="home-head">
    <h1>🔢 산수 놀이터</h1>
    <div class="stats">
      <span class="stat">⭐ <b id="home-stars">0</b></span>
      <a href="../" class="vs-btn" style="text-decoration:none" aria-label="메인 놀이터로">🏠</a>
      <span id="pet-slot"></span>
      <button type="button" id="btn-voice" class="vs-btn" aria-label="목소리 설정">🗣️</button>
    </div>
  </header>
  <div class="menu" id="menu"></div>
</section>

<!-- 숫자 따라쓰기: 묶음 목록 -->
<section class="screen" id="scr-groups">
  <header class="bar">
    <button type="button" class="back" data-go="scr-home">◀</button>
    <h2>✏️ 숫자 따라쓰기</h2>
  </header>
  <div class="items-list" id="groups-list"></div>
</section>

<!-- 숫자 따라쓰기 -->
<section class="screen" id="scr-trace">
  <header class="bar">
    <button type="button" class="back" id="btn-groups-back">◀</button>
    <h2 id="trace-title">✏️ 7 쓰기</h2>
    <span class="page-count" id="trace-count">1 / 10</span>
  </header>
  <button type="button" class="side-nav prev" id="btn-tprev" aria-label="이전 숫자">◀</button>
  <button type="button" class="side-nav next" id="btn-tnext" aria-label="다 쓰고 다음 숫자">▶</button>
  <div class="trace-stage">
    <div class="page-head">
      <button type="button" class="bigbtn" id="btn-tlisten">🔊 듣기</button>
      <div class="pen-hint" id="pen-hint">✏️ 펜슬로 써 보세요!</div>
    </div>
    <div class="trace-visual" id="trace-visual"></div>
    <div class="note" id="trace-holder">
      <div class="note-line">
        <span class="line-tag">따라 써요</span>
        <canvas id="ink-trace"></canvas>
        <button type="button" class="line-clear" id="btn-tclear" aria-label="지우기">🧽</button>
      </div>
    </div>
    <div class="toolbar">
      <div class="swatches" id="swatches">
        <button type="button" class="swatch" aria-label="분홍"></button>
        <button type="button" class="swatch" aria-label="파랑"></button>
        <button type="button" class="swatch" aria-label="초록"></button>
        <button type="button" class="swatch" aria-label="노랑"></button>
        <button type="button" class="swatch sw-rb" aria-label="무지개"></button>
      </div>
      <button type="button" class="bigbtn" id="btn-tundo">↩️ 한 획</button>
    </div>
  </div>
</section>

<!-- 문제: 단계 고르기 -->
<section class="screen" id="scr-levels">
  <header class="bar">
    <button type="button" class="back" data-go="scr-home">◀</button>
    <h2 id="levels-title">➕ 덧셈 문제</h2>
  </header>
  <div class="items-list" id="levels-list"></div>
</section>

<!-- 숫자 징검다리 -->
<section class="screen" id="scr-stones">
  <header class="bar">
    <button type="button" class="back" id="btn-stones-back">◀</button>
    <h2>🐸 숫자 징검다리</h2>
    <span class="dots" id="stones-dots"></span>
  </header>
  <div class="stones-stage">
    <div class="stones-task" id="stones-task"></div>
    <div class="stones-wrap">
      <div class="frog" id="frog">🐸</div>
      <div class="stones-row" id="stones-row"></div>
    </div>
    <div class="quiz-expr stones-expr" id="stones-expr" hidden></div>
    <button type="button" class="bigbtn primary big-next" id="btn-snext" hidden>알겠어! 다음 ▶</button>
  </div>
</section>

<!-- 문제 풀기 -->
<section class="screen" id="scr-quiz">
  <header class="bar">
    <button type="button" class="back" id="btn-levels-back">◀</button>
    <h2 id="quiz-title">➕ 덧셈 문제</h2>
    <span class="dots" id="quiz-dots"></span>
  </header>
  <div class="quiz-stage">
    <div class="quiz-visual" id="quiz-visual" hidden></div>
    <div class="quiz-expr" id="quiz-expr"></div>
    <div class="quiz-choices" id="quiz-choices"></div>
    <button type="button" class="bigbtn" id="btn-hint">💡 그림으로 보기</button>
    <button type="button" class="bigbtn primary big-next" id="btn-qnext" hidden>알겠어! 다음 ▶</button>
  </div>
</section>

<!-- 수 세기 맞춤 -->
<section class="screen" id="scr-count">
  <header class="bar">
    <button type="button" class="back" id="btn-count-back">◀</button>
    <h2>🔢 수 세기</h2>
    <span class="dots" id="count-dots"></span>
  </header>
  <div class="quiz-stage">
    <div class="quiz-visual big" id="count-visual"></div>
    <div class="quiz-choices" id="count-choices"></div>
    <button type="button" class="bigbtn primary big-next" id="btn-cnext" hidden>알겠어! 다음 ▶</button>
  </div>
</section>

<!-- 숫자표 빈칸 채우기 -->
<section class="screen" id="scr-chart">
  <header class="bar">
    <button type="button" class="back" id="btn-chart-back">◀</button>
    <h2>💯 숫자표 채우기</h2>
    <span class="page-count" id="chart-left">빈칸 0</span>
  </header>
  <div class="chart-stage">
    <div class="chart-grid" id="chart-grid"></div>
    <div class="quiz-choices chart-choices" id="chart-choices" hidden></div>
  </div>
</section>

<!-- 패턴 이어가기 -->
<section class="screen" id="scr-pattern">
  <header class="bar">
    <button type="button" class="back" id="btn-pattern-back">◀</button>
    <h2>🚂 패턴 이어가기</h2>
    <span class="dots" id="pattern-dots"></span>
  </header>
  <div class="pattern-stage">
    <div class="train-wrap">
      <div class="train" id="train"></div>
    </div>
    <button type="button" class="bigbtn" id="btn-pread">🔊 다시 듣기</button>
    <div class="quiz-choices pattern-choices" id="pattern-choices"></div>
    <button type="button" class="bigbtn primary big-next" id="btn-pnext" hidden>알겠어! 다음 ▶</button>
  </div>
</section>

<!-- 주사위 수 놀이 -->
<section class="screen" id="scr-dice">
  <header class="bar">
    <button type="button" class="back" id="btn-dice-back">◀</button>
    <h2>🎲 주사위 수 놀이</h2>
    <span class="page-count" id="dice-count">0 / 0</span>
  </header>
  <div class="dice-stage" id="dice-stage">
    <div class="dice-board" id="dice-board"></div>
    <div class="dice-tray" id="dice-tray"></div>
  </div>
</section>

<!-- 점 잇기 -->
<section class="screen" id="scr-dots">
  <header class="bar">
    <button type="button" class="back" id="btn-dots-back">◀</button>
    <h2 id="dots-title">✨ 점 잇기</h2>
    <span class="page-count" id="dots-count">0 / 0</span>
  </header>
  <div class="dots-stage">
    <svg id="dots-svg" viewBox="-9 -9 118 118" aria-label="점 잇기 그림판"></svg>
  </div>
</section>

<!-- 보상 오버레이 -->
<div class="reward" id="reward">
  <div class="reward-card">
    <div class="reward-stars">⭐</div>
    <div class="reward-praise" id="reward-praise">참 잘했어요!</div>
    <div class="reward-btns">
      <button type="button" class="bigbtn" id="reward-close" hidden>그만할래</button>
      <button type="button" class="bigbtn primary" id="reward-next">다음 ▶</button>
    </div>
  </div>
</div>

<script src="../shared/profile.js"></script>
<script src="js/data.js"></script>
<script src="js/dots.js"></script>
<script src="js/audio.js"></script>

<script src="js/ink.js"></script>
<script src="js/app.js"></script>
<script src="../shared/parent-settings.js"></script>
<script src="../shared/voice-settings.js"></script>
<script src="../shared/pet-avatar.js"></script>
<script src="../shared/pet.js"></script>

</body>
