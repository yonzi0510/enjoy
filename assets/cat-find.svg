    <circle cx="102.5" cy="102.5" r="88" fill="none" stroke="#E8453C" stroke-width="9" stroke-linecap="round" opacity=".9"/>
    <circle cx="102.5" cy="102.5" r="80" fill="#E8453C" opacity=".12"/>
  </g>
  <g transform="translate(2.5 0)" filter="url(#wob)">
