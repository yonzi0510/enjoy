<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 205 205" role="img" aria-label="색 맞추기 — 팔레트 든 토끼">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB6CF"/><stop offset="1" stop-color="#FFA8C4"/>
    </linearGradient>
    <!-- 선을 실제로 떨리게 해 손으로 그린 티를 낸다 -->
    <filter id="wob"><feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="2.6"/></filter>
  </defs>
  <rect width="205" height="205" fill="#FFFDF6"/>
  <!-- 묶음 구분은 배경색이 아니라 크레용으로 그린 동그라미 색으로 준다 -->
  <g filter="url(#wob)">
    <circle cx="102.5" cy="102.5" r="88" fill="none" stroke="#9B59B6" stroke-width="9" stroke-linecap="round" opacity=".9"/>
    <circle cx="102.5" cy="102.5" r="80" fill="#9B59B6" opacity=".12"/>
  </g>
  <g transform="translate(2.5 0)" filter="url(#wob)">
    <g stroke="#5A4632" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <!-- 귀 -->
      <path d="M78 66 Q70 24 82 16 Q94 24 90 66 Z" fill="#F9B8CE"/>
      <path d="M122 66 Q130 24 118 16 Q106 24 110 66 Z" fill="#F9B8CE"/>
      <path d="M81 58 Q77 34 83 27 Q89 34 87 58 Z" fill="#F08CAE" stroke="none"/>
      <path d="M119 58 Q123 34 117 27 Q111 34 113 58 Z" fill="#F08CAE" stroke="none"/>
      <!-- 몸 -->
      <path d="M100 178 Q58 178 58 142 Q58 118 100 118 Q142 118 142 142 Q142 178 100 178 Z" fill="#F9B8CE"/>
      <!-- 머리 -->
      <circle cx="100" cy="92" r="44" fill="#F9B8CE"/>
      <!-- 볼 -->
      <ellipse cx="72" cy="102" rx="9" ry="6.5" fill="#F08CAE" stroke="none"/>
      <ellipse cx="128" cy="102" rx="9" ry="6.5" fill="#F08CAE" stroke="none"/>
      <!-- 눈·코·입: 점과 짧은 획으로만 (크레용으로 콕 찍은 느낌) -->
      <circle cx="86" cy="88" r="4.6" fill="#5A4632" stroke="none"/>
      <circle cx="114" cy="88" r="4.6" fill="#5A4632" stroke="none"/>
      <path d="M96 103 h8 l-4 4 z" fill="#5A4632" stroke="none"/>
      <path d="M100 107 q-6 6 -12 2 M100 107 q6 6 12 2" fill="none" stroke-width="3.4"/>
    </g>
      <path d="M100 124 q46 0 46 37 q0 17 -17 17 h-11 q-10 0 -10 9 q0 11 -13 11 q-40 0 -40 -37 q0 -37 45 -37 z"
            fill="#FFFDF8" stroke="#3A2E26" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="78" cy="147" r="11.5" fill="#FF6F91"/>
      <circle cx="108" cy="141" r="11.5" fill="#FFC24B"/>
      <circle cx="128" cy="160" r="11.5" fill="#5BBDF0"/>
      <circle cx="83" cy="175" r="11.5" fill="#7BD86B"/>
  </g>
</svg>
