<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#E6F5EC">
<title>방향·색 놀이터</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="../shared/voice-settings.css">
<link rel="stylesheet" href="../shared/time-limit.css">
<link rel="stylesheet" href="../shared/pet.css">
<link rel="stylesheet" href="../shared/crayon.css">
<link rel="stylesheet" href="../shared/doodle-menu.css">
<link rel="stylesheet" href="../shared/screen.css">
</head>
<body>

<!-- ═══════════ 아이가 그린 손그림 (인라인 SVG) ═══════════
     UI 이모지(🧭 ⭐ 🗣️ ◀ 🔊 🎨 ↑ 🧩 🟢🔵🟣) 자리에 들어가는 그림들.
     굵고 고른 획, 삐뚤한 선, 안 닫히는 동그라미, 칠은 윤곽 밖으로 조금 삐져나간다.
     떨림은 feTurbulence + feDisplacementMap 두 벌(윤곽용·칠용)로 낸다.

     ⚠️ 놀잇감(얼굴 삼각형 조각·방향 화살표 헤더·색 스와치)은 여기 없다.
        이 놀이는 조각이 '어느 쪽을 보는지'를 맞추는 것이라, 조각 그림에 떨림·기울기를
        주면 방향이 흐려진다. 조각은 js/data.js 의 또렷한 SVG 그대로 둔다. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <!-- 윤곽선용 떨림 — 자로 그은 티를 없앤다 -->
  <filter id="mx-hand" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="5"/>
    <feDisplacementMap in="SourceGraphic" scale="2.2"/>
  </filter>
  <!-- 칠(크레용)용 떨림 — 더 크게 흔들어 윤곽 밖으로 삐져나가게 한다 -->
  <filter id="mx-crayon" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="2" seed="2"/>
    <feDisplacementMap in="SourceGraphic" scale="4.6"/>
  </filter>

  <!-- 나침반 — 제목과 격자 왼쪽 위 모서리 (🧭) -->
  <symbol id="mx-compass" viewBox="0 0 48 48">
    <g filter="url(#mx-crayon)" transform="translate(1.4,2)">
      <circle cx="24" cy="24" r="14.5" fill="#BFE6CC"/>
      <path d="M24 12 L29 24 L24 36 L19 24 Z" fill="#EE7A6A"/>
    </g>
    <g filter="url(#mx-hand)" fill="none" stroke="#2E2A24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 7 a17 17 0 1 1 -5 .8"/>
      <path d="M24 12 L30 24 L24 36 L18 24 Z"/>
    </g>
  </symbol>

  <!-- 별 — 모은 별 개수, 다 맞춘 퍼즐 표시 (⭐) -->
  <symbol id="mx-star" viewBox="0 0 48 48">
    <g filter="url(#mx-crayon)" transform="translate(1.4,2)">
      <path d="M24 8 L30 20 L42 22 L33 31 L35.5 43 L24 37 L12.5 43 L15 31 L6 22 L18 20 Z" fill="#FFD34E"/>
    </g>
    <g filter="url(#mx-hand)" fill="none" stroke="#2E2A24" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 7 L30 19.5 L42.5 21.5 L33.5 30.8 L36 43.5 L24 37.4 L12 43.5 L14.5 30.8 L5.5 21.5 L18 19.5 Z"/>
    </g>
  </symbol>

  <!-- 말풍선 — 목소리 설정 (🗣️) -->
  <symbol id="mx-voice" viewBox="0 0 48 48">
    <g filter="url(#mx-crayon)" transform="translate(1.4,2)">
      <path d="M9 11 H39 V30 H23 L15 38 V30 H9 Z" fill="#CFE9F7"/>
    </g>
    <g filter="url(#mx-hand)" fill="none" stroke="#2E2A24" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 12 C9 9.5 11 8.5 13 8.5 H36 C38 8.5 40 9.5 40 12 V27 C40 29.5 38 30.5 36 30.5 H23 L15 38.5 V30.5 H13 C11 30.5 9 29.5 9 27 Z"/>
      <path d="M16 17 C19 15 22 19 25 17 C28 15 31 19 34 17"/>
      <path d="M16 24 C19 22 22 26 25 24 C28 22 31 26 34 24"/>
    </g>
  </symbol>

  <!-- 왼쪽 화살표 — 뒤로 가기 (◀) -->
  <symbol id="mx-back" viewBox="0 0 48 48">
    <g filter="url(#mx-hand)" fill="none" stroke="#2E2A24" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M30 9 L15 24 L30 39"/>
    </g>
  </symbol>

  <!-- 집 — 놀이터 홈 (🏠, 공용 집 단추가 대신 나오면 숨는다) -->
  <symbol id="mx-home" viewBox="0 0 48 48">
    <g filter="url(#mx-crayon)" transform="translate(1.2,1.8)">
      <path d="M11 23 L24 11 L37 23 V38 H11 Z" fill="#F6C453"/>
    </g>
    <g filter="url(#mx-hand)" fill="none" stroke="#2E2A24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 24 L24 9 L41 24"/>
      <path d="M12 21 V39 H36 V21"/>
    </g>
  </symbol>

  <!-- 나팔 — 소리로 알려주기 (🔊) -->
  <symbol id="mx-speaker" viewBox="0 0 48 48">
    <g filter="url(#mx-crayon)" transform="translate(1.4,2)">
      <path d="M7 19 H15 L25 11 V37 L15 29 H7 Z" fill="#FFD9A8"/>
    </g>
    <g filter="url(#mx-hand)" fill="none" stroke="#2E2A24" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 19 H15 L25 11 V37 L15 29 H7 Z"/>
      <path d="M31 17 C35 21 35 27 31 31"/>
      <path d="M38 12 C45 20 45 28 38 36"/>
    </g>
  </symbol>

  <!-- 팔레트 — 색을 보라는 안내 (🎨). 물감 네 방울은 이 놀이의 색 4종 -->
  <symbol id="mx-palette" viewBox="0 0 48 48">
    <g filter="url(#mx-crayon)" transform="translate(1.4,2)">
      <path d="M24 7 C36 7 43 15 43 23 C43 29 38 31 34 31 C31 31 29 33 30 36 C31 39 29 41 25 41 C15 41 6 34 6 24 C6 14 14 7 24 7 Z" fill="#FDF3D2"/>
    </g>
    <g filter="url(#mx-hand)" fill="none" stroke="#2E2A24" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 7 C36 7 43 15 43 23 C43 29 38 31 34 31 C31 31 29 33 30 36 C31 39 29 41 25 41 C15 41 6 34 6 24 C6 14 14 7 24 7 Z"/>
    </g>
    <g filter="url(#mx-crayon)">
      <circle cx="16" cy="17" r="3.4" fill="#EE5140"/>
      <circle cx="26" cy="14" r="3.4" fill="#FFCE44"/>
      <circle cx="35" cy="20" r="3.4" fill="#4FAAE8"/>
      <circle cx="15" cy="28" r="3.4" fill="#68C566"/>
    </g>
  </symbol>

  <!-- 위쪽 화살표 — 방향을 보라는 안내 (↑) -->
  <symbol id="mx-arrow-up" viewBox="0 0 48 48">
    <g filter="url(#mx-crayon)" transform="translate(1.4,2)">
      <path d="M24 9 L37 24 H30 V39 H18 V24 H11 Z" fill="#C9DCE8"/>
    </g>
    <g filter="url(#mx-hand)" fill="none" stroke="#2E2A24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 9 L37 24 H30 V39 H18 V24 H11 Z"/>
    </g>
  </symbol>

  <!-- 퍼즐 조각 — 아직 안 한 퍼즐 표시 (🧩) -->
  <symbol id="mx-puzzle" viewBox="0 0 48 48">
    <g filter="url(#mx-crayon)" transform="translate(1.4,2)">
      <path d="M11 11 H20 a4.5 4.5 0 0 1 9 0 H38 V20 a4.5 4.5 0 0 0 0 9 V38 H11 V29 a4.5 4.5 0 0 1 0 -9 Z" fill="#DED2F5"/>
    </g>
    <g filter="url(#mx-hand)" fill="none" stroke="#2E2A24" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 11 H20 a4.5 4.5 0 0 1 9 0 H38 V20 a4.5 4.5 0 0 0 0 9 V38 H11 V29 a4.5 4.5 0 0 1 0 -9 Z"/>
    </g>
  </symbol>

  <!-- 단계 동그라미 셋 (🟢 🔵 🟣) — 색만 다르다 -->
  <symbol id="mx-lv1" viewBox="0 0 48 48">
    <g filter="url(#mx-crayon)" transform="translate(1.2,1.8)"><circle cx="24" cy="24" r="14" fill="#68C566"/></g>
    <g filter="url(#mx-hand)" fill="none" stroke="#2E2A24" stroke-width="3.8" stroke-linecap="round"><path d="M24 8 a16 16 0 1 1 -4.8 .8"/></g>
  </symbol>
  <symbol id="mx-lv2" viewBox="0 0 48 48">
    <g filter="url(#mx-crayon)" transform="translate(1.2,1.8)"><circle cx="24" cy="24" r="14" fill="#4FAAE8"/></g>
    <g filter="url(#mx-hand)" fill="none" stroke="#2E2A24" stroke-width="3.8" stroke-linecap="round"><path d="M24 8 a16 16 0 1 1 -4.8 .8"/></g>
  </symbol>
  <symbol id="mx-lv3" viewBox="0 0 48 48">
    <g filter="url(#mx-crayon)" transform="translate(1.2,1.8)"><circle cx="24" cy="24" r="14" fill="#A78BE0"/></g>
    <g filter="url(#mx-hand)" fill="none" stroke="#2E2A24" stroke-width="3.8" stroke-linecap="round"><path d="M24 8 a16 16 0 1 1 -4.8 .8"/></g>
  </symbol>
</defs></svg>

<!-- 홈 -->
<section class="screen on" id="scr-home">
  <header class="home-head">
    <h1><svg class="ic ic-title" aria-hidden="true"><use href="#mx-compass"/></svg> 방향·색 놀이터</h1>
    <div class="stats">
      <span class="stat"><svg class="ic" aria-hidden="true"><use href="#mx-star"/></svg> <b id="home-stars">0</b></span>
      <a href="../" class="vs-btn" style="text-decoration:none" aria-label="메인 놀이터로"><svg class="ic" aria-hidden="true"><use href="#mx-home"/></svg></a>
      <span id="pet-slot"></span>
      <button type="button" id="btn-voice" class="vs-btn" aria-label="목소리 설정"><svg class="ic" aria-hidden="true"><use href="#mx-voice"/></svg></button>
    </div>
  </header>
  <div class="menu" id="menu"></div>
</section>

<!-- 퍼즐 목록 -->
<section class="screen" id="scr-puzzles">
  <header class="bar">
    <button type="button" class="back" data-go="scr-home" aria-label="뒤로"><svg class="ic" aria-hidden="true"><use href="#mx-back"/></svg></button>
    <h2 id="puzzles-title"><svg class="ic" aria-hidden="true"><use href="#mx-lv1"/></svg> 작은 격자</h2>
    <span class="page-count" id="puzzles-count">0 / 10</span>
  </header>
  <div class="puzzles-list" id="puzzles-list"></div>
</section>

<!-- 놀이(격자 채우기) -->
<section class="screen" id="scr-play">
  <header class="bar">
    <button type="button" class="back" id="btn-play-back" aria-label="뒤로"><svg class="ic" aria-hidden="true"><use href="#mx-back"/></svg></button>
    <h2 id="play-title"><svg class="ic" aria-hidden="true"><use href="#mx-compass"/></svg> 격자 채우기</h2>
    <button type="button" class="bigbtn small" id="btn-listen"><svg class="ic" aria-hidden="true"><use href="#mx-speaker"/></svg> 듣기</button>
  </header>
  <div class="play-stage" id="play-stage">
    <div class="hint-chip" id="hint-chip"><svg class="ic" aria-hidden="true"><use href="#mx-palette"/></svg> 색을 보고 <svg class="ic" aria-hidden="true"><use href="#mx-arrow-up"/></svg> 화살표 방향으로!</div>
    <!-- 격자 -->
    <div class="board-col">
      <div class="board" id="board"></div>
    </div>
    <!-- 조각 트레이 -->
    <div class="tray" id="tray"></div>
  </div>
  <!-- 드래그 중 따라다니는 조각 -->
  <div class="drag-ghost" id="drag-ghost" hidden></div>
</section>

<!-- 보상 오버레이 -->
<div class="reward" id="reward">
  <div class="reward-card">
    <div class="reward-grid" id="reward-grid"></div>
    <div class="reward-praise" id="reward-praise">참 잘했어요!</div>
    <div class="reward-btns">
      <button type="button" class="bigbtn" id="reward-close">그만할래</button>
      <button type="button" class="bigbtn primary" id="reward-next">다음 ▶</button>
    </div>
  </div>
</div>

<!-- 색종이 축하 -->
<div class="confetti" id="confetti" aria-hidden="true"></div>

<script src="../shared/profile.js"></script>
<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/progress.js"></script>
<script src="js/app.js"></script>
<script src="../shared/parent-settings.js"></script>
<script src="../shared/voice-settings.js"></script>
<script src="../shared/pet-avatar.js"></script>
<script src="../shared/pet.js"></script>
<script src="../shared/time-limit.js"></script>
<script src="../shared/sw-register.js"></script>
<script src="../shared/home-button.js"></script>
</body>
</html>
